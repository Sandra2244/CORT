<!doctype html>
<!-- Sonda de la cara (rondas F8, F9 y F10) · se abre con el núcleo arrancado:
       http://127.0.0.1:8000/sonda-carita.html
     Para qué: las hojas de Música, MV y Equipo del teléfono no existen sin puente
     de Java, así que en el portátil era imposible VER lo que se cambia en la cara
     (la píldora de la esquina, el gesto que se tragaba los botones, el historial del
     chat, y en F9 el cajón, el calco de Lark y el de Gemini). Esta hoja monta el
     MISMO módulo `js/pantallas.js` con un puente de mentira — un `window.CortNative`
     que devuelve un estado de música inventado y anota lo que le mandan — y con un
     `fetch` de mentira para `/api/chat`, `/api/models`, `/api/files` y `/api/lee`,
     y luego se comprueba a sí misma, aquí debajo, con líneas `ok` / `NO`.

     Ronda F10 (la lista de fallos de la dueña sobre el `2.6.0-nucleo`, con sus doce
     capturas de Lark por delante): aquí se comprueban las cuatro cosas que ella
     señaló en Música y MV, porque todas son de cara y de puente y ninguna se ve en
     el portátil sin esto — · las **carátulas**, que en 2.6.0 no existían ni pedidas;
     · la pestaña **Vídeos** en rejilla, que no salía porque Java mezclaba los clips
     con las canciones en el mismo tope de 400; · el **buscador**, que era un campo
     suelto en vez de la pantalla de Lark con su historial y sus Sitios; · la
     **letra fusionada** en el reproductor (hoja escondida que sólo abre el botón ❝,
     sin orbe WebGL dibujándose encima del vídeo), y el botón nativo «CORT · PC», que
     estaba atravesado sobre la píldora y ya no existe: su sitio es el bloque 9 de
     Equipo, que conecta con el PC o el VPS sin arrancar nada solo.

     Lo que SÍ va al servidor de verdad: `/api/port` y `/api/history` (lecturas). No
     envía nada que cambie el estado del núcleo, y no toca el teléfono: el puente es
     de mentirijilla. Sirve también para enseñarle a la dueña la interfaz nueva sin
     tener el APK delante.

     Las comprobaciones están escritas para poder fallar: cada una lee lo que hay en
     el DOM o lo que se mandó, y se mutó a propósito (cambiar un id, quitar un
     manejador) para verla ponerse en `NO`. Una prueba que nunca se pone roja es
     decorativa. -->
<meta charset="utf-8">
<title>Sonda de la cara · CORT F10</title>
<link rel="stylesheet" href="/css/hud.css">
<link rel="stylesheet" href="/css/apps.css">
<style>
  #sonda { position: fixed; left: 0; right: 0; bottom: 0; max-height: 42vh; overflow: auto;
    z-index: 900; background: #02040a; color: #cfe9ff; font: 12px/1.5 Consolas, monospace;
    padding: 10px 14px; border-top: 1px solid #1d3f5c; }
  #sonda h1 { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: #5fd7ff; margin: 0 0 6px; }
  #sonda .ok { color: #2bff9e; } #sonda .no { color: #ff6b8a; }
  #sonda button { background: #0d1a2a; color: #dff2ff; border: 1px solid #1d3f5c;
    border-radius: 6px; padding: 4px 10px; margin: 0 6px 6px 0; cursor: pointer; font: inherit; }
</style>

<div id="sonda"><h1>Sonda de la cara · F10</h1><div id="salida">montando…</div></div>

<script type="module">
const salida = document.getElementById('salida');
const lineas = [];
// Si la sonda se cae a mitad, hay que VER por qué: sin esto el navegador deja la hoja
// en «montando…» y uno se pone a cazar el fallo a ciegas.
addEventListener('error', e => { salida.textContent = 'CAÍ: ' + (e.message || e.type) +
  '\n' + ((e.error && e.error.stack) || (e.filename + ':' + e.lineno)); });
addEventListener('unhandledrejection', e => { salida.textContent = 'CAÍ (promesa): ' +
  ((e.reason && e.reason.stack) || e.reason); });
const dice = (bueno, texto) => lineas.push(`<div class="${bueno ? 'ok' : 'no'}">${bueno ? 'ok ' : 'NO '} ${texto}</div>`);

/* ── el puente de mentirijilla ───────────────────────────────────────────────
   Sólo los métodos que la cara de estas rondas necesita. `musicaEstado` devuelve lo
   que pongamos en `estado`, y cada orden que manda se anota en `mandadas` para
   poder decir «el play de verdad llamó a musicaPausa».

   Desde F10 hay que simular también los ocho métodos nuevos del contrato, porque sin
   ellos la cara se comporta con la rama `puede()` — y lo que quiero ver es la rama
   buena, la del APK nuevo. */
let estado = null;
const mandadas = [];
let carasPedidas = [];
const PISTAS = [
  // Java manda desde 2.7.0 estas campos más (`album`, `id`, `fecha`, `letra`, `mv`):
  // con ellos se agrupan Artistas y Álbumes sin volver al índice, se ordena por
  // «más recientes», y las pildoritas LETRAS/MV prometen algo que la hoja de letra
  // va a encontrar de verdad.
  { uri: 'content://a', titulo: 'Zanja', artista: 'Eika', album: 'Neón', id: 11,
    genero: 'city pop', dur: 191000, video: 0, fecha: 1_730_000_000, letra: 1, mv: 0 },
  { uri: 'content://b', titulo: 'Ámbar', artista: 'Luv Resval', album: 'Onda', id: 12,
    genero: 'rap', dur: 62000, video: 0, fecha: 1_750_000_000, letra: 0, mv: 0 },
  { uri: 'content://c', titulo: 'Still Falling', artista: 'Aiko', album: 'Neón', id: 13,
    genero: 'pop', dur: 201000, video: 1, fecha: 1_760_000_000, letra: 1, mv: 1 },
];
/* La carátula de mentira es un JPEG de verdad, pintado aquí con un lienzo: Java
   responde `data:image/jpeg;base64,…` (el WebView del APK tiene `setAllowFileAccess
   (false)`, así que una ruta o un `file://` nunca cargarían), y el tinte de Lark se
   calcula sobre ese imagen. `content://b` responde VACÍO a propósito: es la pista sin
   carátula, y la cara tiene que quitar el `<img>` y dejar el glifo en vez de fingir
   un cuadro — si esta hoja sólo devolviera imágenes buenas, el caso más común en un
   teléfono real (clips sin etiqueta) quedaría sin comprobar. */
const CARAS_FALSAS = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 48;
  const g = c.getContext('2d');
  g.fillStyle = '#c8324b';
  g.fillRect(0, 0, 48, 48);
  return c.toDataURL('image/jpeg');
})();
let ocultas = 0;
window.CortNative = {
  avisos: () => '[]',
  accion: () => 'null',
  capacidades: () => 'nucleo',
  aparato: () => '{}',
  sensores: () => '{}',
  memoria: () => 'null',
  // `String mente(String)` en Java: con `que:'preguntar'` contesta `{"ok":true,
  // "pendiente":true}` al instante y la respuesta llega DESPUÉS por `__cortNative`.
  // Se anota el `que` para poder comprobar que la Charla, sin portátil, le pregunta
  // al cerebro del teléfono en vez de rendirse con una frase de disculpa.
  mente: pedido => {
    let que = 'roto';
    try { que = String(JSON.parse(pedido).que || ''); } catch { que = 'roto'; }
    mandadas.push('mente:' + que);
    return que === 'preguntar' ? '{"ok":true,"pendiente":true}' : '{"ok":true,"mente":"sin-estado"}';
  },
  atuendo: () => 'null',
  agenda: () => 'null',
  ajusteVoz: () => 'null',
  comparte: uri => { mandadas.push('comparte:' + uri); return '{"ok":true,"envia":"Still Falling"}'; },
  // El estado sale CON el modo juego leído del propio estado: `modoJuego(on)` lo escribe
  // aquí, igual que el servicio de Java, para que el avispón y la píldora se pinten de
  // lo que el aparato dice, no de lo que la hoja pidió.
  musicaEstado: () => (estado ? JSON.stringify(estado) : ''),
  musicaPuedeLeer: () => true,
  musicaBuscar: (q, video) => {
    mandadas.push('musicaBuscar');
    const t = String(q || '').toLowerCase();
    return JSON.stringify(!t ? PISTAS
      : PISTAS.filter(p => (p.titulo + ' ' + p.artista + ' ' + p.album + ' '
        + p.genero).toLowerCase().includes(t)));
  },
  musicaCaratula: (uri, lado) => { carasPedidas.push(uri + '@' + lado);
    return uri === 'content://b' ? '' : CARAS_FALSAS; },
  musicaVelocidad: x => { mandadas.push('musicaVelocidad:' + x); return ''; },
  musicaOculta: uri => { mandadas.push('musicaOculta:' + uri); ocultas++; return true; },
  musicaOcultas: () => ocultas,
  musicaMuestraTodas: () => { mandadas.push('musicaMuestraTodas'); ocultas = 0; return true; },
  musicaDuerme: m => { mandadas.push('musicaDuerme:' + m); return true; },
  abreEnlace: url => { mandadas.push('abreEnlace:' + url); return ''; },
  // F17 · el bloque 9 (PC o VPS). `bgStatus` es el mismo JSON que arma Java, con la
  // dirección ya guardada; aquí contesta una para que la sonda vea que la caja se
  // llena sola. `setPc` es el método de siempre (guardar y cargar la cara remota) y
  // `abreMenu` el que abrió el botón nativo, ahora sólo desde esta hoja.
  bgStatus: () => JSON.stringify({ pc: 'http://192.168.1.50:8000' }),
  setPc: url => { mandadas.push('setPc:' + url); return true; },
  abreMenu: () => { mandadas.push('abreMenu'); return true; },
  musicaPorGusto: () => { mandadas.push('musicaPorGusto'); return JSON.stringify(PISTAS); },
  musicaPoner: (uris, desde) => { mandadas.push('musicaPoner:' + desde); return true; },
  musicaPonerLista: () => true,
  musicaListas: () => JSON.stringify(['para correr']),
  musicaGuardarLista: () => true,
  musicaGustar: () => true,
  musicaPerfil: () => JSON.stringify({ generos: [{ nombre: 'city pop', puntos: 9 }],
                                       artistas: [{ nombre: 'Eika', puntos: 7 }] }),
  musicaPlay: () => mandadas.push('musicaPlay'),
  musicaPausa: () => mandadas.push('musicaPausa'),
  // F14 · la tecla de transporte del sistema (`boolean teclaMedia(String)`), la que
  // llega al reproductor que sea. La cara la pide para las acciones de música de la
  // tabla; sin ella aquí, la sonda recorrería la rama del APK viejo.
  teclaMedia: que => { mandadas.push('teclaMedia:' + que); return true; },
  // F15 · la música por nombre y el ecualizador devuelven el JSON que la cara lee.
  // Sin estas tres, el `puede()` de la sección 4d daría `false` y la sonda recorrería
  // la rama del APK viejo: verde, pero mirando lo que la dueña no lleva encima.
  musicaPonerNombre: nombre => { mandadas.push('musicaPonerNombre:' + nombre);
    return JSON.stringify({ ok: true, titulo: 'After Dark', artista: 'Mr. Kitty',
                            dice: 'Pongo «After Dark», de Mr. Kitty.' }); },
  ecualiza: preset => { mandadas.push('ecualiza:' + preset);
    return JSON.stringify({ ok: true, puesto: 'Rock', dice: 'Ecualizador en «Rock».' }); },
  ecualizaEstado: () => { mandadas.push('ecualizaEstado');
    return JSON.stringify({ ok: true, activo: false, puesto: '',
                            dice: 'El ecualizador se enciende con la música.' }); },
  musicaAutomatica: () => mandadas.push('musicaAutomatica'),
  musicaSiguiente: () => mandadas.push('musicaSiguiente'),
  musicaAnterior: () => mandadas.push('musicaAnterior'),
  musicaParar: () => mandadas.push('musicaParar'),
  musicaSalto: () => true,
  musicaCuadro: () => true,
  musicaVolumen: () => true,
  // Los dos del modo juego, con sus firmas de Java (`void modoJuego(boolean)` y
  // `boolean juegoActivo()`): la cara pregunta el estado DESPUÉS de pedirlo, así que
  // el avispón se pinta de lo que el aparato contesta y no de un deseo.
  modoJuego: on => { estado = { ...(estado || {}), juego: !!on }; return undefined; },
  juegoActivo: () => !!(estado && estado.juego),
  // Las cuatro cosas del APK nuevo que `pantallas.js`/`telefono.js` piden con
  // `llama()`/`puede()` y que aquí faltaban: sin su simulación la sonda Entrera
  // caminaba por la rama «APK viejo» (un `puede` que da `false`), verde pero mirando
  // otra cosa. Sus formas son las de Java: `String oidoEstado()`,
  // `String oidoPropio(boolean)`, `String burbuja(boolean)`,
  // `boolean requestPermission(String)`, `void pidePermisoMedios()`.
  // Las tres primeras devuelven el JSON que Java arma con `Json.p`/`n`/`s`, y el del
  // oído dice `listo` para que la hoja de Equipo pinte la rama buena.
  oidoEstado: () => JSON.stringify({ type: 'motor', oido: 'listo', listo: true, motor: 'vosk',
                                    modelo: 'vosk-model-small-es-0.42', libresMB: 903,
                                    pesoModelo: 52000000 }),
  oidoPropio: enciende => JSON.stringify({ ok: true, oido: !!enciende }),
  burbuja: visible => JSON.stringify({ ok: true, on: !!visible }),
  // F16 · el despertador propio: consultar, quitar, detener y posponer. Sin las
  // cuatro, el `puede()` de la alarma daría `false` y la sonda recorrería la rama
  // del APK viejo. `alarmaEstado` contesta con una puesta para que la hoja pinte
  // la rama buena; poner va por `accion` (`que:'alarma'`), como en Java.
  alarmaEstado: () => { mandadas.push('alarmaEstado');
    return JSON.stringify({ ok: true, puesta: true, alarma: '07:30', en: 'en 8 h 5 min',
                            cuando: 0, exacta: false, cancion: 'after dark',
                            titulo: 'After Dark', artista: 'Mr. Kitty',
                            nota: 'el examen', rutina: true,
                            dice: 'Despertador a las 07:30, en 8 h 5 min.' }); },
  alarmaCancela: () => { mandadas.push('alarmaCancela');
    return JSON.stringify({ ok: true, puesta: false, dice: 'Alarma cancelada.' }); },
  alarmaDetener: () => { mandadas.push('alarmaDetener');
    return JSON.stringify({ ok: true, sonando: false, dice: 'Despertador detenido.' }); },
  alarmaPosponer: () => { mandadas.push('alarmaPosponer');
    return JSON.stringify({ ok: true, puesta: true, cuando: 0, en: 'en 5 min',
                            dice: 'Te despierto otra vez en 5 minutos.' }); },
  requestPermission: () => true,
  pidePermisoMedios: () => undefined,
};

/* ── el `fetch` de mentirijilla: lo que la cara MANDA, no sólo lo que pinta ──
   `/api/port` y `/api/history` se dejan ir al servidor de verdad (son lecturas).
   `/api/chat`, `/api/models/use` y `/api/notes` se anotan para poder comprobar el
   CUERPO que sale: que el modo se pone delante y que el adjunto viaja dentro del
   mensaje es justo lo que ningún css puede demostrar. */
const peticiones = [];
const real = window.fetch.bind(window);
const R = o => Promise.resolve({ ok: true, status: 200, json: () => Promise.resolve(o) });
/* El apagón del portátil, simulado. `hayNucleo()` guarda la base mientras responde, y
   la sección 7 la necesita de verdad (el historial sale de `/api/history`); más abajo
   se pone `sinPc = true` para comprobar la otra mitad: que la Charla no se queda en
   «sin núcleo» cuando el teléfono tiene su propio cerebro. */
let sinPc = false;
window.fetch = (u, opts) => {
  const url = String(u);
  if (sinPc && (url.includes('/api/port') || url.includes('/api/chat')))
    return Promise.reject(new TypeError('Failed to fetch (la sonda apagó el portátil)'));
  if (url.includes('/api/port') || url.includes('/api/history')) return real(u, opts);
  let cuerpo = null;
  try { cuerpo = opts && opts.body ? JSON.parse(opts.body) : null; } catch { cuerpo = null; }
  peticiones.push({ url, cuerpo });
  if (url.includes('/api/models/use')) return R({ ok: true });
  if (url.includes('/api/models')) return R({ modelos: [
    { modelo: 'llama3.2', descargado: true, activo: true },
    { modelo: 'qwen2.5-coder', descargado: true, activo: false },
    { modelo: 'mistral', descargado: false }] });
  if (url.includes('/api/chat')) return R({ reply: 'respuesta de la sonda', source: 'sonda' });
  if (url.includes('/api/lee')) return R({ ok: true, archivo: 'nota.txt', carpetas: 'Documentos',
    texto: 'CONTENIDO_DEL_DOCUMENTO', entero: true, caracteres: 22 });
  // La letra que devuelve LRCLIB por `/api/letras`: con marcas de tiempo para que el
  // karaoke de la hoja fusionada pinte líneas y se pueda comprobar la fusión (F10).
  if (url.includes('/api/letras')) return R({ ok: true, fuente: 'lrclib',
    plana: 'still falling down\nneon rain on me',
    sincronizada: '[00:01.20] still falling down\n[00:41.55] neon rain on me' });
  if (url.includes('/api/files')) return R({ path: 'Documentos', entries: [
    { name: 'Apuntes', type: 'dir', size: 0, folders: 2, files: 1, fecha: '2026-10-01' },
    { name: 'nota.txt', type: 'file', size: 1200, fecha: '2026-10-02' }] });
  if (url.includes('/api/notes')) return R([{ id: 1, fecha: '2026-10-02 09:00', texto: 'comprar pilas' }]);
  /* El copiloto (F11). Tres respuestas de mentira con la FORMA de las verdaderas, y
     un plan deliberately MIXTO: un paso de sólo lectura y un `rm -rf`. La prueba que
     importa es que la cara no le pida ejecutar el segundo a nadie. */
  if (url.includes('/api/copiloto/ejecuta')) return R({ ok: true, ejecutado: true, codigo: 0,
    orden: 'uname -a', ms: 12, salida: 'Linux sonda 6.12.107 x86_64 GNU/Linux',
    dice: 'salió bien en 12 ms' });
  if (url.includes('/api/copiloto/plan')) return R({ ok: true, origen: 'plantilla probada',
    objetivo: (cuerpo && cuerpo.objetivo) || '', token: 'sonda-token', caduca_en: 900, seguros: 1,
    dice: '2 pasos · 1 se puede ejecutar solo · 1 queda escrito para que lo copies',
    pasos: [{ indice: 0, paso: 'paso 1', orden: 'uname -a', seguro: true, motivo: 'sólo lectura',
              permitido_por_ella: false },
            { indice: 1, paso: 'paso 2', orden: 'rm -rf /tmp/ejemplo', seguro: false,
              motivo: '`rm` escribe o no tiene vuelta atrás: CORT no lo ejecuta',
              permitido_por_ella: false }] });
  if (url.includes('/api/copiloto')) return R({ ok: true, recetas: ['ver cómo está el equipo',
    'ver qué está ocupando el disco'], solo_lectura: ['ls', 'df', 'free'],
    negados_siempre: ['rm', 'mv'], archivo: '~/.cort/copiloto.json',
    dice: '77 comandos de sólo lectura · 14 que dependen del suborden' });
  return R({});
};

/* ── la carcasa de verdad, traída de `index.html` ──────────────────────────
   El cajón, su botón, la cortina y los conmutadores no los inventa el JS: viven en
   el índice. Si la sonda se fabricara su propio `<div id="cajon">`, no serviría para
   nada — lo que se quiere comprobar es que **el índice que se instala** trae esos
   nodos y que la cara los enchufa. `DOMParser` no ejecuta `<script>`, así que se
   adoptan los nodos y sólo los maneja `pantallas.js`. */
const cruda = await (await real('/index.html')).text();
const pagina = new DOMParser().parseFromString(cruda, 'text/html');
// `#scene` se adopta también, y no es decorativo: es el lienzo del orbe, y lo que la
// dueña pidió en MV fue «que el orbe NO aparezca ahí». Con la hoja de letra montada se
// puede MEDIR su `display` computed — la regla de apagón y su especificidad se comprueban
// sobre el CSS que se instala, no sobre una promesa en un comentario.
['orb-menu', 'cortina', 'cajon', 'mic', 'wake', 'hand', 'scene'].forEach(id => {
  const n = pagina.getElementById(id);
  if (n) document.body.appendChild(document.importNode(n, true));
  else lineas.push(`<div class="no">NO index.html no trae #${id}</div>`);
});

const m = await import('/js/pantallas.js');
/* `android-bridge.js` es el que en el teléfono crea `window.__cortNative` (un registro
   de `on()`/`emit()` sobre el que Java empuja `{type:'music'|'mente'|'atajo'|…}). La
   sonda no carga ese guion, y sin él `escuchaMusica()`, `escuchaAtajos()` y
   `escuchaMente()` se van por la puerta `if (!window.__cortNative) return` — o sea: la
   mitad de la cara no se probaría. Se pone el registro de mentirijilla aquí, con `emit`
   a mano, para poder soltar un aviso del cerebro cuando toque. */
const oidores = [];
window.__cortNative = { on: cb => oidores.push(cb), emit: ev => oidores.forEach(cb => cb(ev)) };
// `api()` tiene que devolver una dirección de verdad: la cara guarda el resultado de
// `hayNucleo()` y un `''` (la raíz relativa) se lee como «no hay portátil», así que
// con `''` esta sonda nunca llegaría a la lista de modelos.
m.initPantallas({ api: () => location.origin, term: () => {}, say: () => {}, orb: { burst: () => {}, pausa: () => {} }, voice: {} });
document.documentElement.classList.add('mobile');   // la cara del teléfono, en el navegador

/* ── ayuda: un deslizamiento de dedo, con su recorrido horizontal ───────────*/
function desliza(el, dx) {
  const r = el.getBoundingClientRect(), cy = r.y + r.height / 2;
  const bulto = (tipo, x) => {
    const t = new Touch({ identifier: 1, target: el, clientX: x, clientY: cy });
    return new TouchEvent(tipo, { touches: tipo === 'touchend' ? [] : [t], changedTouches: [t], bubbles: true });
  };
  el.dispatchEvent(bulto('touchstart', r.x + r.width / 2));
  el.dispatchEvent(bulto('touchend', r.x + r.width / 2 + dx));
}
const tecla = k => document.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true }));
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
/* Las hojas (「Ordenar por」, el ⋮, Velocidad…) se cierran con su animación: durante
   260 ms siguen DOS nodos `.hoja` en el DOM, la que baja y la que sube. Consultar
   `document` a pelo contaría el doble y la prueba se pondría roja sin que nada esté
   roto. `h()` siempre mira la ÚLTIMA hoja montada, que es la que está delante. */
const h = sel => { const r = [...document.querySelectorAll('.hoja')].pop(); return r ? [...r.querySelectorAll(sel)] : []; };
const espera = ms => new Promise(r => setTimeout(r, ms));
/* LO QUE LA CARA NO TIENE QUE TENER. Son selectors que esta hoja consulta PARA ver
   que no existen: Lark trae ecualizador, cola y carpetas, y el puente de CORT no da
   nada de eso, así que copiarlos sería un cuadro de adorno. Se declaran aquí, y no
   en medio de la comprobación, porque `scripts/prueba-costura.py` [21] cruza TODOS
   los selectors que la sonda usa contra la cara real: lo que no esté en la cara y no
   esté listado aquí es una errata, y una errata en `$('#mu-busca-limpia')` da
   `null`/`0` y pone verde una prueba que no ha mirado nada. */
const NEGATIVOS = ['#mu-ecualizador', '#mu-cola', '#mu-carpetas', '.lk-ecualizador'];

ponEstado({ vivo: true, suena: true, pos: 42000, dur: 191000, juego: false,

dice(masFilas.length === 11, 'el ⋮ sube con sus ' + masFilas.length + ' filas (en 2.6.0 eran cuatro botones sueltos)');
['Letra y vídeo', 'Velocidad', 'Temporizador para dormir', 'Ocultar esta pista', 'Compartir',
 'Mostrar las ocultadas', 'Modo juego', 'Agregar a la lista'].forEach(txt =>
  dice(masFilas.some(t => t.includes(txt)), '「' + txt + '」 está, como en sus capturas'));
dice(!masFilas.some(t => /Borrar/.test(t)),
  'y NO hay 「Borrar」: eso tiraría la música de su teléfono; un botón que borra por accidente no es una réplica');
dice(masFilas.some(t => /Ahorro de energía/.test(t) && /Android/.test(t)),
  '「Ahorro de energía」 se dice como es: lo decide Android, CORT no se pone a sí misma en ahorro');
h('.hoja-fila').find(f => /Velocidad/.test(f.textContent)).click();
await espera(320);
dice(h('[data-v]').length === 7, 'Velocidad abre su hoja de 0,5× a 2×');
dice(/pausa/.test((h('.hoja-nota')[0] || {}).textContent || ''), 'y avisa de que Android exige pausar para cambiarla');
h('[data-v]').find(f => f.dataset.v === '1.5').click();
await espera(320);
dice(mandadas.includes('musicaVelocidad:1.5'), 'elegirla manda `musicaVelocidad(1.5)` a Java');
$('#mu-mas-btn').click(); await espera(320);
h('.hoja-fila').find(f => /Temporizador/.test(f.textContent)).click();
await espera(320);
dice(h('[data-m]').length === 7, 'el temporizador para dormir trae sus minutos y el 0 (apagar)');
h('[data-m]').find(f => f.dataset.m === '30').click();
await espera(320);
dice(mandadas.includes('musicaDuerme:30'), 'y manda `musicaDuerme(30)`');
$('#mu-mas-btn').click(); await espera(320);
mandadas.length = 0;
h('.hoja-fila').find(f => /Ocultar esta pista/.test(f.textContent)).click();
await espera(320);
dice(mandadas.some(x => x === 'musicaOculta:content://c'), 'Ocultar manda la URI exacta de la pista que suena');
$('#mu-mas-btn').click(); await espera(320);
const muestra = h('.hoja-fila').find(f => /Mostrar las ocultadas/.test(f.textContent));
dice(/1 escondida/.test(muestra.textContent), 'y la fila de enfrente cuenta las escondidas (' + muestra.textContent.trim() + ')');
h('.hoja-fila').find(f => /Mostrar las ocultadas/.test(f.textContent)).click();
await espera(320);
dice(mandadas.includes('musicaMuestraTodas'), '「Mostrar las ocultadas」 llama a `musicaMuestraTodas`');
$('#mu-mas-btn').click(); await espera(320);
mandadas.length = 0;
h('.hoja-fila').find(f => /Compartir/.test(f.textContent)).click();
await espera(320);
dice(mandadas.includes('comparte:content://c') && m.pantallaActual() === 'musica',
  'Compartir manda la URI al cuadro de apps de Android sin llevársela a otra hoja');

/* ── 6 d · el buscador: la PANTALLA de Lark, no un campo suelto ───────────────
   «el buscador dentro de música no funciona bien». Eran dos cosas: filtraba por el SQL
   del índice (ASCII, así que «Ámbar» con til no salía) y no se parecía a lo que ella ve
   en Lark. Aquí se prueba que busca SOLO al escribir, que guarda historial, y que los
   Sitios llaman a `abreEnlace` con la URL ya armada. */
$('#mu-busca-btn').click();
dice(!$('#mu-buscador').hidden, 'la lupa abre una pantalla de búsqueda con su barra');
dice(/aún no buscaste nada/.test($('#mu-historial').textContent), 'el historial empieza honesto, vacío');
dice($$('#mu-sitios .mu-chip').map(b => b.textContent).join() === 'YouTube,SoundCloud,Instagram,Facebook,X',
  'los cinco Sitios de sus capturas');
$('#mu-busca').value = 'ámbar';
$('#mu-busca').dispatchEvent(new Event('input', { bubbles: true }));
await espera(420);            // 320 ms de silencio = busca sola, sin pulsar «buscar»
dice($$('#mu-pistas .lk-fila .lk-txt b').map(b => b.textContent).join() === 'Ámbar',
  'escribir con tilde acierta (Java pliega a minúsculas; el SQL del índice no)');
dice(JSON.parse(localStorage.getItem('cort-busca-historial') || '[]')[0] === 'ámbar',
  'y la frase queda en el historial, como en Lark');
dice($$('#mu-historial .mu-chip').map(b => b.textContent).includes('ámbar'), 'el historial se pinta en la pantalla');
mandadas.length = 0;
$$('#mu-sitios .mu-chip')[0].click();
dice(mandadas.some(x => x === 'abreEnlace:https://www.youtube.com/results?search_query=' + encodeURIComponent('ámbar')),
  'un Sitio llama a `abreEnlace` con su URL armada (' + (mandadas.find(x => x.startsWith('abreEnlace')) || 'nada') + ')');
$('#mu-busca').value = 'eika';
$('#mu-busca').dispatchEvent(new Event('input', { bubbles: true }));
await espera(420);
dice($$('#mu-pistas .lk-fila').length === 1, 'buscar por artista deja esa canción');
dice($$('#mu-historial .mu-chip').map(b => b.textContent).join() === 'eika,ámbar',
  'el historial pone lo MÁS RECIENTE delante (sus capturas: hot girl, hard, stereo… en orden)');
$$('#mu-historial .mu-chip')[1].click();
await espera(420);
dice($('#mu-busca').value === 'ámbar' && $$('#mu-pistas .lk-fila').length === 1,
  'tocar una frase del historial la escribe y busca sola (la fila de «hot girl» de sus capturas)');
$('#mu-busca-limpia').click();
dice(JSON.parse(localStorage.getItem('cort-busca-historial') || '[]').length === 0, '「borrar」 limpia el historial');
$('#mu-busca-cierra').click();
dice($('#mu-buscador').hidden, 'y la ✕ cierra la pantalla de búsqueda');
localStorage.removeItem('cort-busca-historial');
// Se deja la lista como estaba: la próxima sección (y la tira de botones de abajo)
// tienen que ver las tres pistas del índice, no el residuo de la prueba de búsqueda.
$('#mu-busca').value = '';
$('#mu-busca').dispatchEvent(new Event('input', { bubbles: true }));
await espera(420);
dice($$('#mu-pistas .lk-fila').length === 2, 'y al vaciar el campo vuelve la lista completa');

// Lo que Lark tiene y CORT no finge: ni ecualizador, ni carpetas, ni cola.
const fingido = NEGATIVOS.filter(s => $(s)).length;
dice(fingido === 0, 'nada inventado: sin ecualizador, sin cola y sin carpetas (el puente no los da)');
$('#mu-chips .lk-pestana[data-c="canciones"]').click();

/* ── 7 · Charla: calco de Gemini con la estructura de Qoder ─────────────────*/
m.ir('charla');
dice(!!$('#gm-menu') && !!$('#gm-modelo') && !!$('#gm-adj') && !!$('#ch-enviar'),
  'la barra y la píldora de Gemini: ☰, modelo ▾, + y enviar');
dice($('#ch-entrada').closest('.gm-pildora') !== null, 'el campo vive DENTRO de la píldora');
$('#gm-modelo').click();
await espera(200);            // `cargaModelos()` es async: la lista llega después del toque
dice($('#gm-despl').classList.contains('abierto') && $$('#gm-despl .gm-opc[data-m]').length === 2,
  'el desplegable lista los modelos bajados (' + $$('#gm-despl .gm-opc[data-m]').length + ')');
dice($('#gm-modelo-n').textContent === 'llama3.2', 'y la barra lleva el nombre del modelo activo');
$$('#gm-despl .gm-opc[data-m]')[1].click();
await espera(120);            // `models/use` es una promesa: el rótulo cambia al volver
dice(peticiones.some(x => x.url.includes('/api/models/use') && x.cuerpo?.modelo === 'qwen2.5-coder'),
  'elegir modelo manda el nombre a /api/models/use');
dice($('#gm-modelo-n').textContent === 'qwen2.5-coder', 'y el rótulo de la barra cambia');
$('#ch-msgs').click();
dice(!$('#gm-despl').classList.contains('abierto'), 'tocar fuera del desplegable lo cierra');
dice($$('#gm-modos .gm-modo').length === 6, 'los seis modos de la fila de abajo');
$('#gm-modos .gm-modo[data-m="resume"]').click();
dice($('#gm-modos .gm-modo.activa').dataset.m === 'resume', 'el modo elegido queda marcado');
// Adjuntar: `+` → Un documento → la hoja de archivos → el archivo → texto leído.
$('#gm-adj').click();
dice($$('.gm-adjuntar button').length === 3, 'la hoja del + trae sus botones redondos');
$$('.gm-adjuntar button')[0].click();
await espera(160);
dice($$('.hoja [data-i]').length === 2, 'el explorador lista la carpeta que devuelve /api/files');
$$('.hoja [data-i]')[1].click();
await espera(160);
dice(!!$('#gm-adj-chip') && $('#gm-usando').textContent.includes('adjunto nota.txt'),
  'el documento queda adjunto y se anuncia (' + $('#gm-usando').textContent + ')');
// Enviar con modo + adjunto: el cuerpo que sale hacia /api/chat es la prueba real.
peticiones.length = 0;
$('#ch-entrada').value = 'hablame de Eika';
$('#ch-enviar').click();
await espera(80);
const chat = peticiones.find(x => x.url.includes('/api/chat'));
dice(!!chat && chat.cuerpo.message.startsWith('Responde en tres frases'),
  'el modo se pone DELANTE de la pregunta (así funciona sin campo de modo en el backend)');
dice(!!chat && chat.cuerpo.message.includes('CONTENIDO_DEL_DOCUMENTO')
     && chat.cuerpo.message.includes('hablame de Eika'),
  'el texto leído viaja dentro del mensaje, junto a la pregunta');
dice($('#ch-msgs .burbuja.de-tu .bur-adj')?.textContent.includes('nota.txt'), 'la burbuja dice qué llevabas adjunto');
dice($('#gm-adj-chip') === null, 'y el adjunto se suelta solo tras enviar (no se repite en la siguiente)');
dice($('#gm-saludo').hidden, 'con conversación delante, el saludo de Gemini se aparta');
// El botón nuevo NO borra la memoria del núcleo: sólo la hoja local.
localStorage.setItem('cort-charla', JSON.stringify([{ de: 'tu', texto: 'borrable' }]));
m.ir('musica'); m.ir('charla');
$('#gm-nueva').click();
dice($$('#ch-msgs .burbuja').length === 0, '「✚」 empieza de cero en esta hoja');
dice(peticiones.every(x => !/api\/notes/.test(x.url) || x.cuerpo?.texto),
  'guardar una nota manda {texto}, el campo que de verdad pide el backend');

/* ── 7b · la Charla sin portátil: piensa el teléfono ───────────────────────
   La queja: «charla con IA le faltan muchas cosas… chat tampoco [funciona]». En
   2.6.0, apagar el PC dejaba la hoja con su frase de disculpa aunque el APK tuviera
   `mente()` (Groq con la clave del perfil, o las reglas locales). Aquí se apaga el
   núcleo de mentira y se comprueba las dos mitades: que la cara PREGUNTA por el
   puente y que la respuesta, que llega tarde por `__cortNative`, se pinta en la
   Charla. También se comprueba el negativo: un aviso de Ollama usa el mismo `type`
   y no es una respuesta de nadie. */
sinPc = true;
$('#ch-entrada').value = '¿qué sabes de mí?';
$('#ch-enviar').click();
await espera(300);
// El primer envío todavía confía en la base guardada: el fallo tiene que borrar esa
// idea (sin esto, un PC que se duerme a media tarde deja la Charla muda el resto del
// día, porque la cara seguiría dando por bueno el «sí hay» de por la mañana).
dice(/El núcleo se cayó/.test($('#ch-msgs .burbuja:last-child .bur-texto').textContent),
  'si el portátil se cae a media respuesta, la hoja lo dice y deja de darlo por vivo');
$('#ch-entrada').value = '¿qué sabes de mí?';
$('#ch-enviar').click();
await espera(400);
dice(mandadas.includes('mente:preguntar'),
  'y sin núcleo, la Charla le pregunta al cerebro del teléfono por el puente');
dice(/pensando en el teléfono/.test($('#scr-charla .scr-estado').textContent),
  'mientras tanto dice DÓNDE lo está pensando, no «sin núcleo»');
window.__cortNative.emit({ type: 'mente', de: 'ollama', accion: 'lista' });
dice(/pensando en el teléfono/.test($('#scr-charla .scr-estado').textContent),
  'un aviso de Ollama, que usa el mismo `type`, no se toma por respuesta');
window.__cortNative.emit({ type: 'mente', de: 'nube', responde: 'Que te gusta Eika y el city pop.' });
dice($('#ch-msgs .burbuja:last-child .bur-texto').textContent === 'Que te gusta Eika y el city pop.',
  'la respuesta del teléfono llega a la Charla (' + $('#ch-msgs .burbuja:last-child .bur-texto').textContent + ')');
dice(/cerebro del teléfono: nube/.test($('#scr-charla .scr-estado').textContent),
  'y el pie dice de dónde salió: nube, o local, según Java lo diga');
sinPc = false;

/* ── 8 · cada hoja es otra app, y el botón nativo no estorba ─────────────────*/
const acentoDe = id => { m.ir(id); return getComputedStyle(document.documentElement).getPropertyValue('--app-accent').trim(); };
const tintes = ['musica', 'charla', 'codigo', 'equipo'].map(acentoDe);
dice(new Set(tintes).size === 4, 'cada hoja pinta con SU acento (' + tintes.join(' / ') + ')');
m.ir('musica');
dice(getComputedStyle($('#scr-musica')).backgroundColor === 'rgb(0, 0, 0)', 'Música es negro puro, como Lark');
m.ir('charla');
dice(getComputedStyle($('.gm-pildora')).borderRadius.startsWith('26'), 'la Charla termina en píldora redonda');
/* El botón «CORT · PC» ya no existe: en 2.10.0 estaba atravesado sobre la píldora y,
   peor, CORT arrancaba el PC solo al abrir. Su sitio es el bloque 9 de Equipo, una
   GUÍA que no se abre sola. Aquí se comprueba lo que la cara manda al puente: la
   dirección escrita viaja a `setPc`, volver manda la cadena vacía, y el menú nativo
   se pide con `abreMenu`. Que el botón siga GONE lo vigila la costura de Java. */
m.ir('equipo');
const pcDir = $('#eq-pc-dir');
dice(!!pcDir && pcDir.value === 'http://192.168.1.50:8000',
  'el bloque 9 de Equipo trae la dirección que Java ya guardó (bgStatus.pc)');
const pcBloque = $('#eq-pc-conecta')?.closest('.eq-bloque');
dice(!!pcBloque && /PC o VPS/.test(pcBloque.querySelector('summary')?.textContent || ''),
  'y vive dentro de la hoja, no flotando encima de la píldora');
dice(!!$('#eq-pc-menu') && !!$('#eq-pc-telefono'), 'con sus tres salidas: conectar, volver al teléfono y menú');
pcDir.value = 'http://192.168.1.77:8000';
mandadas.length = 0;
$('#eq-pc-conecta').click();
dice(mandadas.join() === 'setPc:http://192.168.1.77:8000',
  'conectar manda la dirección escrita a setPc (' + mandadas.join() + ')');
mandadas.length = 0;
$('#eq-pc-telefono').click();
dice(mandadas.join() === 'setPc:', 'volver al teléfono manda setPc vacío: no vuelve a abrir el PC solo');
mandadas.length = 0;
$('#eq-pc-menu').click();
dice(mandadas.join() === 'abreMenu', 'el menú de dieciséis filas se pide con abreMenu');
mandadas.length = 0;
pcDir.value = 'sin-http';
$('#eq-pc-conecta').click();
dice(mandadas.length === 0 && /http:\/\//.test($('#eq-pc-dice').textContent),
  'una dirección sin http:// no se manda: avisa en su propia línea');
m.ir('orbe');
// En el orbe no queda UN solo botón de herramientas: el dock se fue al cajón.
dice($$('#dock button:not([data-pc])').length > 0
     && getComputedStyle(document.getElementById('dock')).display !== 'none'
     && !document.getElementById('pantalla-menu') && !document.getElementById('pantalla-bar'),
  'en el orbe no queda ni la barra de hojas ni el menú viejo: sólo ☰');

/* ── 9 · el copiloto: piensa los comandos y ejecuta sólo los que no rompen ───
   El punto 4 de su lista era «CORT debe guiarte como copiloto y ejecutar los comandos
   él solo». La promesa tiene dos mitades, y la sonda caza las dos: que la cara PIDA
   el plan al backend (no lo inventa en JS) y que el ▶ sólo esté encendido en los pasos
   que el backend marcó como de sólo lectura. Para eso el plan de mentira trae un
   `uname -a` y un `rm -rf`: si la cara pidiera ejecutar el segundo, el `rm` llegaría
   al portátil — y aquí se vería, porque se anota cada `fetch` con su cuerpo. */
m.ir('codigo');
const cpOn = $('#cod-cop-on');
dice(!!cpOn, 'la hoja de Código tiene el interruptor del modo copiloto');
dice(!!$('#cod-cop-chips') && !!$('#cod-cop-plan'), 'y trae su caja de sugerencias y su caja de plan');
peticiones.length = 0;
cpOn.checked = true; cpOn.dispatchEvent(new Event('change'));
await espera(220);
dice(peticiones.some(x => x.url.includes('/api/copiloto') && !x.cuerpo),
  'al encenderlo pregunta al backend qué recetas sabe hacer (no las escribe la cara)');
dice($$('#cod-cop-chips .eq-chip').length === 2,
  'y pinta las recetas que devolvió, no dos inventadas (' + $$('#cod-cop-chips .eq-chip').length + ')');
dice(localStorage.getItem('cort-copiloto') === '1', 'el modo se recuerda en localStorage (mañana sigue puesto)');
dice(/objetivo/.test($('#cod-entrada').placeholder),
  'la pista de la línea cambia de objetivo: pide un OBJETIVO, no un comando');
peticiones.length = 0;
$('#cod-entrada').value = 'cómo está el equipo';
$('#cod-enviar').click();
await espera(260);
const cpPlan = peticiones.find(x => x.url.includes('/api/copiloto/plan'));
dice(!!cpPlan && cpPlan.cuerpo && cpPlan.cuerpo.objetivo === 'cómo está el equipo',
  'la línea se mandó como OBJETIVO a /api/copiloto/plan');
dice(!peticiones.some(x => x.url.includes('/api/command')),
  'y NO se mandó a /api/command: con el copiloto puesto la terminal no actúa a ciegas');
dice($$('#cod-cop-plan .cp-paso').length === 2, 'el plan se pinta paso por paso ('
  + $$('#cod-cop-plan .cp-paso').length + ' pasos)');
const cpBtns = $$('#cod-cop-plan [data-ejecuta]');
dice(cpBtns.length === 1 && cpBtns[0].dataset.ejecuta === '0',
  'sólo el paso de sólo lectura tiene ▶ (el `rm -rf` no lo tiene, no está desvanecido: no existe)');
const cpMalo = $$('#cod-cop-plan .cp-paso').find(d => d.classList.contains('malo'));
dice(!!cpMalo && /vuelta atrás/.test(cpMalo.querySelector('.cp-motivo').textContent),
  'el paso que escribe se muestra con su motivo y su botón de copiar');
dice(!!cpMalo && !!cpMalo.querySelector('[data-copia="1"]')
     && !!cpMalo.querySelector('.cp-b[disabled]'), 'y el ▶ del paso malo está apagado');
peticiones.length = 0;
cpBtns[0].click();
await espera(260);
const cpEje = peticiones.find(x => x.url.includes('/api/copiloto/ejecuta'));
dice(!!cpEje && cpEje.cuerpo.token === 'sonda-token' && cpEje.cuerpo.indice === 0,
  'al pulsar ▶ se ejecuta ese paso con el token del plan (token ' + (cpEje?.cuerpo?.token || 'ninguno') + ')');
dice(!!$('#cod-cop-plan .cp-salida') && /Linux sonda/.test($('#cod-cop-plan .cp-salida').textContent),
  'la salida del comando aparece en la tarjeta del paso');
peticiones.length = 0;
$('#cp-todos').click();
await espera(260);
const cpTodos = peticiones.filter(x => x.url.includes('/api/copiloto/ejecuta'));
dice(cpTodos.length === 1 && cpTodos.every(x => x.cuerpo.indice === 0),
  '«ejecuta los seguros» sólo corre el paso 1: el 2 quedó fuera (' + cpTodos.length + ' orden(es))');
// La salida de emergencia: prefijar `> ` no pide ningún plan (y deja la línea a la
// terminal de siempre, que en el teléfono es el puente y en el PC es `/api/command`).
peticiones.length = 0;
$('#cod-entrada').value = '> reproduce música';
$('#cod-enviar').click();
await espera(260);
dice(!peticiones.some(x => x.url.includes('/api/copiloto')),
  'prefijar `> ` salta el copiloto: no se le pide un plan a nada');
// Y el plan se puede cerrar sin dejar restos.
$('#cp-cierra')?.click(); await espera(60);
dice($$('#cod-cop-plan .cp-paso').length === 0, '«cerrar el plan» vacía la caja');
cpOn.checked = false; cpOn.dispatchEvent(new Event('change')); await espera(60);
dice(localStorage.getItem('cort-copiloto') === '0' && !$('#cod-cop-chips').childElementCount,
  'y al apagarlo se borran las sugerencias y se guarda el apagado (no despierta el modo solo)');

salida.innerHTML = lineas.join('') +
  `<div><button id="otro">otra pista</button><button id="sin-cara">pista sin carátula</button>` +
  `<button id="para">parar</button>` +
  `<button id="juego">modo juego</button><button id="musica">ir a Música</button>` +
  `<button id="letra">❝ letra</button>` +
  `<button id="abre-cajon">abrir el cajón</button></div>` +
  '<div style="margin-top:6px;color:#5e8cab">La tira de abajo es la sonda; el cajón, la píldora y las hojas son la cara real.</div>';
document.getElementById('otro').onclick = () => { ponEstado({ ...estado, pista: PISTAS[0], suena: true }); m.ir('musica'); };
// La pista SIN carátula (`content://b`): los botones de arriba sirven para VER los dos
// casos con la cara montada, sin tener que andar cambiando el puente a mano.
document.getElementById('sin-cara').onclick = () => { ponEstado({ ...estado, pista: PISTAS[1], suena: true }); m.ir('musica'); };
document.getElementById('para').onclick = () => { ponEstado({ ...estado, pista: null, suena: false }); m.ir('charla'); };
document.getElementById('juego').onclick = () => { ponEstado({ ...estado, juego: !estado.juego }); m.ir('charla'); };
document.getElementById('musica').onclick = () => m.ir('musica');
document.getElementById('letra').onclick = () => { m.ir('musica'); document.getElementById('mu-letras').click(); };
document.getElementById('abre-cajon').onclick = () => $('#orb-menu').click();
window.__sonda = () => lineas.map(s => s.replace(/<[^>]+>/g, ''));
</script>
