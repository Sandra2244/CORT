<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#02040a">
<title>C.O.R.T.</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="11" fill="none" stroke="%2339c2ff" stroke-width="2"/><circle cx="16" cy="16" r="4" fill="%2339c2ff"/></svg>'>
<script>
  if (location.search.includes('glass')) document.documentElement.classList.add('glass');
  if (navigator.userAgent.includes('Electron')) document.documentElement.classList.add('electron');
</script>
<script src="js/android-bridge.js"></script>
<script src="js/icons.js"></script>
<link rel="stylesheet" href="css/hud.css">
</head>
<body>
<div id="scene"></div>
<div id="boot"></div>

<!-- marco de cabina (líneas y arcos de la referencia azul) -->
<svg id="frame" viewBox="0 0 100 100" preserveAspectRatio="none">
  <g stroke="rgba(70,190,255,.35)" stroke-width=".18" fill="none" vector-effect="non-scaling-stroke">
    <path d="M2,14 Q2,2 14,2" /><path d="M86,2 Q98,2 98,14" />
    <path d="M2,86 Q2,98 14,98" /><path d="M86,98 Q98,98 98,86" />
    <path d="M6,20 L6,80" stroke-dasharray="2 3" /><path d="M94,20 L94,80" stroke-dasharray="2 3" />
    <path d="M20,6 L80,6" stroke-dasharray="2 3" /><path d="M20,94 L80,94" stroke-dasharray="2 3" />
  </g>
</svg>

<!-- HUD fijo -->
<div class="panel" id="top"><b>C.O.R.T.</b> · Cognitive Orchestrator / Real-Time
  <div class="sub">a sus órdenes · <span id="hudver">v0.2</span></div></div>
<!-- arcos laterales + humano digital (referencia azul 90e2) -->
<div id="arcs">
  <svg class="arc left" viewBox="0 0 120 400">
    <path d="M112,20 Q40,200 112,380" /><path class="in" d="M96,60 Q48,200 96,340" />
    <g class="ticks"><line x1="104" y1="60" x2="112" y2="60"/><line x1="92" y1="120" x2="100" y2="120"/>
    <line x1="86" y1="200" x2="94" y2="200"/><line x1="92" y1="280" x2="100" y2="280"/>
    <line x1="104" y1="340" x2="112" y2="340"/></g>
    <text x="66" y="196" class="lbl">SISTEMAS</text>
  </svg>
  <svg class="arc right" viewBox="0 0 120 400">
    <path d="M8,20 Q80,200 8,380" /><path class="in" d="M24,60 Q72,200 24,340" />
    <g class="ticks"><line x1="8" y1="60" x2="16" y2="60"/><line x1="20" y1="120" x2="28" y2="120"/>
    <line x1="26" y1="200" x2="34" y2="200"/><line x1="20" y1="280" x2="28" y2="280"/>
    <line x1="8" y1="340" x2="16" y2="340"/></g>
    <text x="34" y="196" class="lbl">NAVEGACIÓN</text>
  </svg>
</div>
<div id="twin" title="gemelo digital">
  <svg viewBox="0 0 60 140">
    <circle cx="30" cy="16" r="9"/><path d="M30,25 L30,78 M30,34 L14,58 M30,34 L46,58 M30,78 L18,126 M30,78 L42,126"/>
    <g class="scan"><line x1="6" y1="0" x2="54" y2="0"/></g>
  </svg>
  <div class="twinlbl">GEMELO · OK</div>
</div>

<div class="panel" id="status">conectando…</div>
<div class="panel" id="clock">--:--:--</div>

<!-- árbol lateral persistente (la columna 00·–09· de Jared Hood) -->
<div class="panel" id="tree">
  <div class="winbar" style="cursor:default"><span class="ico" data-ic="folder"></span><span class="ttl">Arbol del sistema</span><span class="hint">toca = desplegar</span></div>
  <div id="treebody"></div>
  <div id="brain" title="el muro de recuerdos de CORT">▸ CORT'S BRAIN</div>
</div>

<!-- chips flotantes: archivos/notas que CORT te "lanza a las manos" (Jared) -->
<div id="chips"></div>

<!-- dock de ventanas (estética Jared Hood: chips rectangulares con icono + etiqueta monoespaciada) -->
<div class="panel" id="dock">
  <button data-win="files" title="01 · Archivos"><i data-ic="folder"></i><span>Archivos</span></button>
  <button data-win="env" title="02 · Entorno"><i>◉</i><span>Entorno</span></button>
  <button data-win="chat" title="03 · Canal de voz"><i>✦</i><span>Canal</span></button>
  <button data-win="notes" title="04 · Notas"><i>✎</i><span>Notas</span></button>
  <button data-win="music" title="05 · Música"><i>♪</i><span>Musica</span></button>
  <button data-win="term" title="06 · Consola"><i>▤</i><span>Consola</span></button>
  <button data-win="perfil" title="07 · Perfil"><i data-ic="gear"></i><span>Perfil</span></button>
  <button data-win="cerebro" title="08 · Cerebro (muro de recuerdos)"><i>⌗</i><span>Cerebro</span></button>
  <button data-act="open" title="Abrir en el explorador la carpeta que estás viendo"><i data-ic="open"></i><span>Abrir</span></button>
  <button data-win="modelos" title="10 · Modelos locales (Ollama): descargar y elegir"><i data-ic="download"></i><span>Modelos</span></button>
  <button data-win="optimiza" title="11 · Optimización: RAM y caché del equipo"><i data-ic="gauge"></i><span>Optimizar</span></button>
  <button data-win="ayuda" title="09 · Ayuda, atajos y soporte"><i data-ic="help"></i><span>Ayuda</span></button>
  <button data-act="hide" title="Ocultar / mostrar todas las ventanas (Esc)"><i>◫</i><span>Ocultar</span></button>
  <span id="lamp" title="estado de CORT"><i></i><span>arrancando</span></span>
</div>

<!-- botones flotantes: voz, escucha permanente y manos -->
<div id="livetxt" aria-live="polite"></div>
<button class="fab" id="mic" title="Hablar" aria-label="Hablar"><i data-ic="mic"></i></button>
<button class="fab" id="wake" title="Escucha permanente «Oye CORT»" aria-label="Oye CORT"><i data-ic="wake"></i></button>
<button class="fab" id="hand" title="Gestos con la mano" aria-label="Gestos"><i data-ic="hand"></i></button>

<!-- mini-vista de la cámara de gestos (panel 08) -->
<div id="camwrap">
  <div class="winbar"><span class="ico" data-ic="hand"></span><span class="ttl">09 · Gestos</span></div>
  <div id="gesthelp">palma = ventanas · pinza = canal · puño = ocultar</div>
  <video id="camv" playsinline muted style="display:none"></video>
  <canvas id="gest" width="160" height="120"></canvas>
  <div id="gestlabel">apagada</div>
</div>

<script type="importmap">
{"imports":{"three":"./vendor/three.module.js"}}
</script>
<script type="module">
import { initORB } from './js/orb.js';
import { wireUI } from './js/hud.js';
const orb = initORB(document.getElementById('scene'));
window.__orb = orb;   // depuración/consola: __orb.activate(), __orb.setDisc(true)…
wireUI(orb);
</script>
</body>
</html>
