<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C.O.R.T.</title>
<script>
  if (location.search.includes('glass')) document.documentElement.classList.add('glass');
  if (navigator.userAgent.includes('Electron')) document.documentElement.classList.add('electron');
</script>
<link rel="stylesheet" href="css/hud.css">
</head>
<body>
<div id="scene"></div>
<div id="boot"></div>

<!-- marco de cabina (líneas y arcos de la referencia azul) -->
<svg id="frame" viewBox="0 0 100 100" preserveAspectRatio="none">
  <g stroke="rgba(70,190,255,.35)" stroke-width=".18" fill="none" vector-effect="non-scaling-stroke">
    <path d="M2,14 Q2,2 14,2" /><path d="M86,2 Q98,2 98,14" />
    <path d="M2,86 Q2,98 14,98" /><path d="M86,98 Q98,98 98,86" />
    <path d="M6,20 L6,80" stroke-dasharray="2 3" /><path d="M94,20 L94,80" stroke-dasharray="2 3" />
    <path d="M20,6 L80,6" stroke-dasharray="2 3" /><path d="M20,94 L80,94" stroke-dasharray="2 3" />
  </g>
</svg>

<!-- HUD fijo -->
<div class="panel" id="top"><b>C.O.R.T.</b> · Cognitive Orchestrator / Real-Time
  <div class="sub">a sus órdenes</div></div>
<!-- arcos laterales + humano digital (referencia azul 90e2) -->
<div id="arcs">
  <svg class="arc left" viewBox="0 0 120 400">
    <path d="M112,20 Q40,200 112,380" /><path class="in" d="M96,60 Q48,200 96,340" />
    <g class="ticks"><line x1="104" y1="60" x2="112" y2="60"/><line x1="92" y1="120" x2="100" y2="120"/>
    <line x1="86" y1="200" x2="94" y2="200"/><line x1="92" y1="280" x2="100" y2="280"/>
    <line x1="104" y1="340" x2="112" y2="340"/></g>
    <text x="66" y="196" class="lbl">SISTEMAS</text>
  </svg>
  <svg class="arc right" viewBox="0 0 120 400">
    <path d="M8,20 Q80,200 8,380" /><path class="in" d="M24,60 Q72,200 24,340" />
    <g class="ticks"><line x1="8" y1="60" x2="16" y2="60"/><line x1="20" y1="120" x2="28" y2="120"/>
    <line x1="26" y1="200" x2="34" y2="200"/><line x1="20" y1="280" x2="28" y2="280"/>
    <line x1="8" y1="340" x2="16" y2="340"/></g>
    <text x="34" y="196" class="lbl">NAVEGACIÓN</text>
  </svg>
</div>
<div id="twin" title="gemelo digital">
  <svg viewBox="0 0 60 140">
    <circle cx="30" cy="16" r="9"/><path d="M30,25 L30,78 M30,34 L14,58 M30,34 L46,58 M30,78 L18,126 M30,78 L42,126"/>
    <g class="scan"><line x1="6" y1="0" x2="54" y2="0"/></g>
  </svg>
  <div class="twinlbl">GEMELO · OK</div>
</div>

<div class="panel" id="status">conectando…</div>
<div class="panel" id="clock">--:--:--</div>

<!-- dock de ventanas (como en la referencia azul: botones circulares abajo) -->
<div class="panel" id="dock">
  <button data-win="files" title="01 · Archivos">🗀</button>
  <button data-win="env" title="02 · Entorno">◉</button>
  <button data-win="chat" title="03 · Canal de voz">✦</button>
  <button data-win="notes" title="04 · Notas">✎</button>
  <button data-win="music" title="05 · Música">♪</button>
  <button data-win="term" title="06 · Consola">▤</button>
  <button data-win="perfil" title="07 · Perfil">⚙</button>
</div>

<!-- botones flotantes: voz, escucha permanente y manos -->
<button class="fab" id="mic" title="Hablar">🎙</button>
<button class="fab" id="wake" title="Escucha permanente «Oye CORT»">👂</button>
<button class="fab" id="hand" title="Gestos (modo ligero)">✋</button>

<!-- mini-vista de la cámara de gestos (panel 08) -->
<div id="camwrap">
  <div class="winbar"><span class="ico">✋</span><span class="ttl">08 · Gestos</span></div>
  <video id="camv" playsinline muted style="display:none"></video>
  <canvas id="gest" width="160" height="120"></canvas>
  <div id="gestlabel">apagada</div>
</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import { initORB } from './js/orb.js';
import { wireUI } from './js/hud.js';
const orb = initORB(document.getElementById('scene'));
window.__orb = orb;   // depuración/consola: __orb.activate(), __orb.setDisc(true)…
wireUI(orb);
</script>
</body>
</html>
