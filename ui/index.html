<!-- La ropa por app (F9): cada apartado con su fondo, su acento y su cabecera, para

     Va DESPUÉS de `hud.css` a propósito: son reglas que ajustan las de siempre. -->
<link rel="stylesheet" href="css/apps.css">
<!-- El manto JARVIS (paso 1.4): la charla sobre el orbe, como en la referencia. Va al
     final porque es una capa que se pone ENCIMA de la ropa de siempre, y todas sus
     reglas cuelgan de `html.manto-jarvis`: sin esa clase, este archivo no pinta nada. -->
<link rel="stylesheet" href="css/jarvis.css">

<body>
<!-- agua del atuendo (F17): dos manchas que respiran detrás del orbe. Sólo

     quieta y sin desenfoque (ver `hud.css`). -->

<div id="scene"></div>
<div id="boot"></div>

<!-- marco de cabina (líneas y arcos de la referencia azul) -->

    <path d="M20,6 L80,6" stroke-dasharray="2 3" /><path d="M20,94 L80,94" stroke-dasharray="2 3" />
  </g>
</svg>

<!-- HUD fijo -->
<div class="panel" id="top"><b>C.O.R.T.</b> · Cognitive Orchestrator / Real-Time
  <div class="sub">a sus órdenes · <span id="hudver">v0.2</span></div></div>

<div class="panel" id="status">conectando…</div>
<div class="panel" id="clock">--:--:--</div>

<!-- árbol lateral persistente (la columna 00·–09· de Jared Hood) -->
<div class="panel" id="tree">
  <div class="winbar" style="cursor:default"><span class="ico" data-ic="folder"></span><span class="ttl">Arbol del sistema</span><span class="hint">toca = desplegar</span></div>
  <div id="treebody"></div>
  <div id="brain" title="el muro de recuerdos de CORT">▸ CORT'S BRAIN</div>
</div>

<!-- chips flotantes: archivos/notas que CORT te "lanza a las manos" (Jared) -->
<div id="chips"></div>

<!-- ================= EL CAJÓN =================
     La dueña: «el orbe será sólo pantalla principal, sin botones; sólo uno de las
     acciones o menú». Todo lo que antes cruzaba el borde inferior (la tira de doce
     botones) se va a este cajón lateral, que es lo único que abre el botón ☰: sus
     apps, sus herramientas y sus ajustes, en tres bloques con nombre. El `#dock` de
     siempre NO se duplica ni se reescribe: viaja dentro del cajón con sus mismos
     nodos, porque `windows.js` engancha las ventanas buscando `#dock [data-win=…]`
     y esos manejadores son los que ya funcionan. Lo que sólo existe en el PC
     (`data-pc`) se esconde en el teléfono con CSS: un botón que lleva a una hoja de
     escritorio en un móvil es peor que no ofrecerlo. -->
<button class="fab" id="orb-menu" title="Menú de CORT" aria-label="Menú de CORT"><i>☰</i></button>
<div id="cortina"></div>
<aside id="cajon">
  <header id="cj-cab">
    <b>C.O.R.T.</b><span>elige tu app</span>
    <button id="cj-cierra" title="Cerrar el menú (Esc)">✕</button>
  </header>
  <div class="cj-grupo">Tus apps</div>
  <div id="cj-apps"><!-- lo rellena `pantallas.js` con las hojas visibles --></div>
  <div class="cj-grupo">Herramientas</div>
  <div class="panel" id="dock">
    <button data-win="files" title="01 · Archivos" data-pc><i data-ic="folder"></i><span>Archivos</span></button>
    <button data-win="env" title="02 · Entorno" data-pc><i>◉</i><span>Entorno</span></button>
    <button data-win="chat" title="03 · Canal de voz"><i>✦</i><span>Canal</span></button>
    <button data-win="notes" title="04 · Notas"><i>✎</i><span>Notas</span></button>
    <button data-win="music" title="05 · Música" data-pc><i>♪</i><span>Musica</span></button>
    <button data-win="term" title="06 · Consola" data-pc><i>▤</i><span>Consola</span></button>
    <button data-win="perfil" title="07 · Perfil"><i data-ic="gear"></i><span>Perfil</span></button>
    <button data-win="cerebro" title="08 · Cerebro (muro de recuerdos)"><i>⌗</i><span>Cerebro</span></button>
    <button data-act="open" title="Abrir en el explorador la carpeta que estás viendo" data-pc><i data-ic="open"></i><span>Abrir</span></button>
    <button data-win="modelos" title="10 · Modelos locales (Ollama): descargar y elegir"><i data-ic="download"></i><span>Modelos</span></button>
    <button data-win="optimiza" title="11 · Optimización: RAM y caché del equipo" data-pc><i data-ic="gauge"></i><span>Optimizar</span></button>
    <button data-win="ayuda" title="09 · Ayuda, atajos y soporte"><i data-ic="help"></i><span>Ayuda</span></button>
    <button data-act="hide" title="Ocultar / mostrar todas las ventanas (Esc)" data-pc><i>◫</i><span>Ocultar</span></button>
    <span id="lamp" title="estado de CORT"><i></i><span>arrancando</span></span>
  </div>
  <div class="cj-grupo">Ajustes y accesibilidad</div>
  <div id="cj-ajustes"><!-- aquí se reubican `#wake` y `#hand` al montar la cara --></div>
</aside>

<!-- botones flotantes: voz, escucha permanente y manos -->
<div id="livetxt" aria-live="polite"></div>
<button class="fab" id="mic" title="Hablar" aria-label="Hablar"><i data-ic="mic"></i></button>
<button class="fab" id="wake" title="Escucha permanente «Oye CORT»" aria-label="Oye CORT"><i data-ic="wake"></i></button>
<button class="fab" id="hand" title="Gestos con la mano" aria-label="Gestos"><i data-ic="hand"></i></button>

<!-- mini-vista de la cámara de gestos (panel 08) -->
<div id="camwrap">
  <div class="winbar"><span class="ico" data-ic="hand"></span><span class="ttl">09 · Gestos</span></div>
  <div id="gesthelp">palma = ventanas · pinza = canal · puño = ocultar</div>
  <!-- El vídeo es la FUENTE del lienzo: no se enseña él, se copia a #gest. No
       puede ir en `display:none` porque algunos WebView no decodifican cuadros
       de un vídeo sin caja; se deja en 2×2 px invisibles y sin tocar el layout. -->
  <video id="camv" playsinline muted autoplay
         style="position:fixed;left:-4px;top:-4px;width:2px;height:2px;opacity:0;pointer-events:none"></video>
  <canvas id="gest" width="160" height="120"></canvas>
  <div id="gestlabel">apagada</div>
</div>

<script type="importmap">
{"imports":{"three":"./vendor/three.module.js"}}
</script>
<script type="module">
/* El arranque ya no puede morir entero por un módulo. En la 2.10.0, un `import`
   de un nombre que no se exportaba hizo que Chromium rechazara TODO el grafo
   antes de ejecutar una línea: ni orbe, ni botones, ni voz. Ahora se importa
   por partes, el orbe tiene un doble que no hace nada y cualquier fallo se
   escribe en pantalla —los registros del WebView no se pueden leer desde el
   repo, y una frase visible es lo único que ella puede mandar. */
const pintaFalla = (e) => {
  if (document.getElementById('falla')) return;
  const caja = document.createElement('div');
  caja.id = 'falla';
  caja.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;'
    + 'background:#2a0b12;color:#ffd9df;border:1px solid #ff6b81;border-radius:10px;'
    + 'padding:10px 12px;font:12px/1.35 system-ui,sans-serif;white-space:pre-wrap;'
    + 'max-height:42vh;overflow:auto';
  caja.textContent = 'CORT no pudo montar una parte de la cara:\n'
    + ((e && (e.stack || e.message)) || e || 'error sin mensaje');
  document.body.appendChild(caja);
};
addEventListener('error', ev => pintaFalla(ev.error || ev.message));
addEventListener('unhandledrejection', ev => pintaFalla(ev.reason));

/* El doble del orbe: la cara sigue viva aunque WebGL o Three no arranquen. */
const orbeDePalo = {
  speak() {}, burst() {}, activate() {}, stop() {}, listen() {}, setDisc() {},
  setAudio() {}, pausa() {}, vestir() { return {}; }, colores() { return {}; },
  estado() { return 'reposo'; },
};
let orb = orbeDePalo;
try {
  const { initORB } = await import('./js/orb.js');
  orb = initORB(document.getElementById('scene')) || orbeDePalo;
} catch (e) { pintaFalla(e); }
window.__orb = orb;   // depuración/consola: __orb.activate(), __orb.setDisc(true)…
try {
  const { wireUI } = await import('./js/hud.js');
  wireUI(orb);
} catch (e) { pintaFalla(e); }
</script>
</body>
</html>
