<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="CORT">
  <!-- Logo de CORT: el orbe de partículas de la interfaz (cort-orbe.js: ~260 puntos
       sobre una esfera, núcleo brillante y dos órbitas) reducido a marca. Paleta de
       cort-style.css. Sin texto: el isotipo tiene que aguantar 48 px en el cajón de
       Android y el recorte circular del launcher. -->
  <defs>
    <radialGradient id="fondo" cx="50%" cy="46%" r="70%">
      <stop offset="0%" stop-color="#0a2531"/>
      <stop offset="50%" stop-color="#05121c"/>
      <stop offset="100%" stop-color="#03070d"/>
    </radialGradient>
    <radialGradient id="esfera" cx="42%" cy="38%" r="66%">
      <stop offset="0%" stop-color="#22e5ff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#7b5cff" stop-opacity="0.10"/>
      <stop offset="85%" stop-color="#7b5cff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#7b5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nucleo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="34%" stop-color="#22e5ff" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#22e5ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00ffc8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="anillo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ffc8"/>
      <stop offset="55%" stop-color="#22e5ff"/>
      <stop offset="100%" stop-color="#ff2bd6"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#fondo)"/>
  <polygon points="54,14 458,14 498,54 498,458 458,498 54,498 14,458 14,54" fill="none" stroke="url(#anillo)" stroke-width="5" opacity="0.4"/>

  <!-- Volumen de la esfera antes de los puntos: sin esto la marca se lee como un
       anillo con satélites y no como el orbe. -->
  <circle cx="256" cy="256" r="178" fill="url(#esfera)"/>

  <!-- Órbitas completas por detrás de la nube de puntos; el arco delantero se
       repinta después del núcleo, así el anillo pasa por dentro de la esfera. -->
  <g opacity="0.45">
    <ellipse cx="256" cy="256" rx="196" ry="58" fill="none" stroke="#22e5ff" stroke-width="3"
             transform="rotate(-14 256 256)"/>
    <ellipse cx="256" cy="256" rx="182" ry="50" fill="none" stroke="#ff2bd6" stroke-width="2.5"
