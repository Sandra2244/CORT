# Compilar el APK del teléfono en el pipeline, no en el portátil.
#
# Por qué existe: la dueña del proyecto quiere abrir CORT desde su Samsung con
# un APK descargable, y **no se puede compilar en su máquina** — 1,8 GiB de RAM,
# sin JDK (`javac` medido: no está) y un `gradle build` que la congeló. Las
# herramientas que hacen falta (`aapt2`, `d8`, `zipalign`, `apksigner`) vienen
# **preinstaladas** en el runner de GitHub Actions, y `apps/apk/compilar.sh` las
# usa sin Gradle ni AndroidX: una actividad Java pura, cuatro pasos, cero
# descargas.
#
# Por qué también `push: branches: main`: para ver si compila **antes** de
# etiquetar. Si algo se rompe, el fallo se lee sin sesión: el paso convierte el
# final de su propio log en un annotation del check-run, y esa API es pública.
#
# Por qué espera a que exista la Release: quien abre la página es
# `publicar-release.yml`, disparado por la misma etiqueta. Subir el APK antes
# fracasaría (`gh release upload` sobre una página que no existe), así que este
# trabajo espera, reintentando, hasta que `publicar-release` la abra —sin
# fusionar los dos pipelines: si un día el SDK del runner se rompe, la Release
# de texto sigue saliendo igual—.
#
# Por qué también busca la etiqueta cuando el evento es `main` (medido el
# 2026-10-15 con v0.14.0): `publicar-release.yml` se dispara con el `push` de
# `main` y llama a `gh release create v0.14.0`, que **crea la etiqueta él solo**
# sobre el commit si no existía. Ese corte no generó ningún evento de etiqueta,
# así que el APK se compiló verde y se quedó sin subir: la página salió con su
# texto y sus `.zip` de fuente, pero sin `CORT-v0.14.0.apk`. Desde este fix el
# paso, si va por rama, pregunta a la API de tags qué etiqueta apunta a *este*
# commit y sube a esa página. Compilar tarda minuto y pico, y la Release se abre
# en cinco segundos: la carrera está a favor, no en contra.
#
# La firma es desechable **mientras no haya secreto** `CORT_APK_KEYSTORE_B64` en
# el repo: cada APK sale con una llave nueva y hay que desinstalar el anterior
# para instalar el nuevo. Con el secreto puesto, `compilar.sh` firma con la
# llave guardada y el APK se actualiza instalando encima. La llave estable ya
# existe (se generó con `keytool` el 2026-10-15 y vive en `apps/apk/llave/`,
# ignorada por git): falta que la dueña la pegue en Settings → Secrets and
# variables → Actions, y `apps/apk/README.md` dice qué archivo va en qué secreto
# y cómo se comprueba el resultado — cada run publica en la Release un
# `CORT-v<etiqueta>-firma.txt` con la huella del certificado usado.
name: compilar-apk

on:
  push:
    tags:
      - "v*"
    branches:
      - "main"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el repo
        uses: actions/checkout@v4

      - name: Averiguar la versión que lleva escrita el APK
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          buscar() {
            # El `|| true` es deliberado **aquí** y no en el paso de subida: si la
            # API falla, este build es un comprobador del Java y no debe ponerse
            # rojo por un etiqueta que no pudo leer —sale como `0.0.0` y sigue—; el
            # paso de subida sí debe fallar, porque ahí quedarse sin etiqueta
            # significa dejar la Release sin su APK y eso no se tapa con un 0.
            gh api "repos/$GITHUB_REPOSITORY/tags?per_page=30" 2>/dev/null \
              | python3 scripts/etiqueta_del_commit.py "${1:-$GITHUB_SHA}" || true
          }
          case "${GITHUB_REF_NAME:-}" in
            v*) etiqueta="$GITHUB_REF_NAME" ;;
            *)
              # Run de rama: la etiqueta la está creando **ahora mismo** su hermana
              # `publicar-release.yml` con `gh release create`, así que se buscan
              # tres veces con cinco segundos de por medio. Si no aparece, no pasa
              # nada: esto es un build de comprobación y sale como `0.0.0`.
              etiqueta="$(buscar)"
              for i in 1 2 3; do
                [ -n "$etiqueta" ] && break
                sleep 5
                etiqueta="$(buscar)"
              done
              ;;
          esac
          version="${etiqueta#v}"
          [ -n "$version" ] || version="0.0.0"
          {
            echo "etiqueta=$etiqueta"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$etiqueta" ]; then
            echo "Este commit es $etiqueta: el APK sale con versionName $version."
          else
            echo "Sin etiqueta sobre ${GITHUB_SHA:0:7}: el APK sale como 0.0.0 (build de comprobación)."
          fi

      - name: Compilar
        run: |
          # `set +e` es obligatorio, no cosmético: el shell por defecto de GitHub
          # se comporta como `bash -e`, y en el run 38677344363 (medido) eso mató
          # el paso justo en la línea de `compilar.sh` — antes de `st=$?` y antes
          # del annotation. Sin esta línea el paso falla en 1 s y no cuenta por
          # qué, que es exactamente el problema que este bloque quiere resolver.
          set +e
          # La versión **no** se lee del ref: medido el 2026-10-15, el
          # `CORT-v0.14.1.apk` salió con `versionName «main»` porque el run vino por
          # rama y `${GITHUB_REF_NAME#v}` dejaba `main`. Ahora la pone el paso de
          # arriba, que mira qué etiqueta apunta a este commit.
          TAG="${{ steps.ver.outputs.version }}"
          # Las logs de Actions **no son públicas** (medido 2026-10-15: la API de
          # logs pide `admin:read` y la URL web pide sesión — el comentario que
          # decía lo contrario estaba mal). Los *annotations* del check-run sí se
          # leen sin credenciales, así que si algo falla, el final del log sale
          # por ahí: es la única ventana honesta que hay desde fuera.
          {
            echo "ANDROID_HOME=${ANDROID_HOME:-vacío} · ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-vacío}"
            ls -d /usr/local/lib/android/* 2>/dev/null || echo "(sin /usr/local/lib/android)"
          } > /tmp/pre.log
          # `-x` desde el run 6 (medido 2026-10-15): el script salió con 1 sin
          # imprimir nada después de la nota de `javac`, y un fallo mudo no se
          # puede diagnosticar ni por annotation. El trazado deja en el log cada
          # comando ejecutado; el último sobreviviente dice dónde murió.
          bash -x apps/apk/compilar.sh "${TAG:-0.0.0}" > /tmp/apk.log 2>&1
          st=$?
          cat /tmp/apk.log
          if [ $st -ne 0 ]; then
            msg=$( { cat /tmp/pre.log; echo "-- final del log --"; tail -c 2500 /tmp/apk.log; } \
                   | tr '\n\r%;#()' ' ...... ' )
            echo "::error::compilar.sh salió con $st — $msg"
            exit $st
          fi
        env:
          # Si la dueña guarda un keystore en los secretos, se usa; si no, el
          # script genera uno desechable y lo dice en el log.
          CORT_APK_KEYSTORE_B64: ${{ secrets.CORT_APK_KEYSTORE_B64 }}
          CORT_APK_KEYSTORE_PASS: ${{ secrets.CORT_APK_KEYSTORE_PASS }}

      - name: Dejar el APK como artefacto del run
        uses: actions/upload-artifact@v4
        with:
          name: CORT-apk
          path: |
            apps/apk/build/CORT.apk
            apps/apk/build/firma.txt

      - name: Subirlo a la Release (cuando este commit tiene etiqueta)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          buscar_etiqueta_del_commit() {
            # Una sola verdad: el resolutor vive en `scripts/etiqueta_del_commit.py`
            # y lleva sus 10 pruebas en `test_etiqueta_commit.py`.
            gh api "repos/$GITHUB_REPOSITORY/tags?per_page=30" \
              | python3 scripts/etiqueta_del_commit.py
          }
          etiqueta="${{ steps.ver.outputs.etiqueta }}"
          if [ -z "$etiqueta" ]; then
            # El paso de arriba no la vio (la hermana `publicar-release` corre en
            # paralelo y tarda ~10 s en abrir la página y crear la etiqueta).
            # Esperar dos minutos cubre la carrera de sobra: este paso llega
            # después de compilar, que ya dura minuto y pico. Medido con v0.14.0:
            # la etiqueta la creó el pipeline con su token, y eso **no** dispara
            # otro trabajo, así que el APK se quedó sin subir.
            for i in $(seq 1 12); do
              sleep 10
              etiqueta="$(buscar_etiqueta_del_commit)"
              [ -n "$etiqueta" ] && break
            done
          fi
          if [ -z "$etiqueta" ]; then
            echo "Sin etiqueta sobre ${GITHUB_SHA:0:7}: el APK queda sólo como artefacto del run."
            exit 0
          fi
          echo "Etiqueta de este commit: $etiqueta"
          # Esperar a `publicar-release.yml` abra la página (máx. 10 min).
          for i in $(seq 1 60); do
            if gh release view "$etiqueta" >/dev/null 2>&1; then
              break
            fi
            sleep 10
          done
          if ! gh release view "$etiqueta" >/dev/null 2>&1; then
            echo "::error::no hay Release para $etiqueta tras 10 min de espera — revisar publicar-release.yml"
            exit 1
          fi
          # Nombre con la versión dentro: es lo que se toca desde el teléfono y
          # tiene que decir qué es sin abrir el gestor de archivos.
          cp apps/apk/build/CORT.apk "CORT-$etiqueta.apk"
          gh release upload "$etiqueta" "CORT-$etiqueta.apk" --clobber
          # La nota de la firma viaja al lado del APK: es la única forma de
          # comprobar, sin leer un log privado, si esta Release se hizo con la
          # llave estable (se actualiza encima) o con una desechable (desinstalar).
          cp apps/apk/build/firma.txt "CORT-$etiqueta-firma.txt"
          gh release upload "$etiqueta" "CORT-$etiqueta-firma.txt" --clobber
          echo "APK subido a la Release $etiqueta"
