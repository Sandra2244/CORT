name: apk

# F7: el APK se compila aquí, no en la Canaima. La máquina de Sandra no tiene
# javac (sólo JRE 21), ni Gradle, ni SDK de Android, así que prometer un APK
# "hecho en casa" sería mentira. Lo que sí se puede garantizar es que lo que se
# publica salió de este archivo y de este código, con el peso y el SHA-256
# medidos y escritos en el log.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["cort-v*"]
    paths:
      - "apps/android/**"
      - ".github/workflows/apk.yml"

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - name: código
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: SDK de Android (lo que hay en el runner, medido en el log)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ls "$ANDROID_HOME" || echo "no hay SDK preinstalado"
          echo "--- plataformas ---"; ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "(ninguna)"
          echo "--- build-tools ---"; ls "$ANDROID_HOME/build-tools" 2>/dev/null || echo "(ninguna)"
          SDKMGR="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          if [ -z "$SDKMGR" ]; then
            echo "No está sdkmanager: se bajan las herramientas oficiales de Google y se listan antes de ejecutarlas"
            mkdir -p /tmp/cmd/ && cd /tmp/cmd
            curl -fsSLO https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q commandlinetools-linux-11076708_latest.zip -d /tmp/cmd
            SDKMGR=/tmp/cmd/cmdline-tools/bin/sdkmanager
          fi
          echo "SDKMGR=$SDKMGR" >> "$GITHUB_ENV"
          yes | "$SDKMGR" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          "$SDKMGR" --sdk_root="$ANDROID_HOME" --list_installed | head -20

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          cache-read-only: false

      - name: compilar el APK (depuración, instalable)
        run: gradle -p apps/android --no-daemon --console=plain assembleDebug

      - name: peso y huella medidos
        run: |
          APK=apps/android/app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          echo "bytes: $(stat -c%s "$APK")"
          echo "megabytes: $(awk "BEGIN{printf \"%.2f\", $(stat -c%s "$APK")/1048576}")"
          sha256sum "$APK" | tee "$APK.sha256"
          echo "--- dentro del APK ---"
          unzip -l "$APK" | sed -n '1,30p'

      - name: publicar el artefacto
        uses: actions/upload-artifact@v4
        with:
          name: CORT-android-debug
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
