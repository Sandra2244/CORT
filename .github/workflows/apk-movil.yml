name: apk-movil

# El APK de esta rama (la app híbrida: cara nativa en el teléfono + ventana al
# puente de la PC) se compila aquí, no en la Classmate: medido en esta máquina,
# OpenJDK 21 está sólo en versión *runtime* (no hay `javac`), y no hay Gradle, ni
# SDK de Android, ni `adb`. `apps/android/compilar.sh` usa las herramientas que
# el runner ya trae (`aapt2`, `d8`, `zipalign`, `apksigner`).
#
# Desde F12 este build SÍ descarga piezas de terceros: el oído local (Vosk) y su
# puente nativo (JNA) viajan dentro del APK. No se descargan "las que haya":
# `apps/android/deps.txt` fija nombre, URL y SHA-256 de cada uno, y `compilar.sh`
# se cae si la suma no cuadra. Las licencias están en
# `apps/android/ACREDITACION.md`, y `vendor/` está en `.gitignore` para que ningún
# modelo de 39,8 MB entre al repositorio por descuido.
#
# Desde `cort-v0.16.2` el modelo de español **ya no bajaba en el build ni viaja en
# el APK**: lo descarga el teléfono desde Almacén (`assets/oido.json` lleva su
# URL, su peso y la misma suma de `deps.txt`), y el build tampoco lo pide
# (`CORT_OIDO_DENTRO=1` era la única forma de meterlo). Motivo medido: con las dos
# ABIs y las `.so` sin comprimir, el APK llegaba a 162 817 475 bytes y en esta
# casa se cortaba al bajarlo.
#
# Desde `cort-v0.17.2` el modelo **vuelve a dentro** (`CORT_OIDO_DENTRO=0` lo
# saca) y el APK además empaqueta la cara del PC (`cort-web/` → `assets/web/`),
# que es lo que la dueña pidió: «que sea la copia exacta de la versión de PC
# incluyendo sus funciones». Y pesó más, con su permiso expreso: preguntada por el
# tamaño, contestó «tiene que pesar más, no importa» y pidió el modelo y las dos
# ABIs dentro. El número que hace eso posible no es un capricho sino una medida:
# en la corrida verde de `cort-v0.16.2` el `.so` del motor comprimido ocupa
# 14 265 297 de sus 56 508 296 bytes, así que la segunda ABI (`armeabi-v7a`) suma
# ~12 MB y no 46. Con el oído, las dos ABIs y la cara del PC dentro el APK queda
# en el orden de 70-90 MB: más de lo que la casa baja sin cortarse a ~40 KB/s,
# menos de la mitad que los 162 817 475 bytes de `cort-v0.16.1` que sí se cortaron.
# El peso real, con suma, lo publica la propia release; y si alguna vez la
# descarga se corta, `CORT_ABIS="arm64-v8a"` devuelve el paquete de una sola ABI.
#
# Las logs de Actions de un repo privado no se pueden leer desde fuera sin sesión,
# así que si un paso falla su final se publica como **annotation del check-run**,
# que sí es pública. Eso es lo que se mira cuando el triángulo sale rojo.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "versión que se escribe dentro del APK (X.Y.Z)"
        default: "0.12.0"
      delgado:
        description: "compilar sin oído local (apk de prueba, CORT_SIN_MOTOR=1)"
        type: boolean
        default: false
      etiqueta:
        description: "si se rellena, además publica la release con este nombre (ej. cort-v0.12.0)"
        default: ""
      comite:
        description: "commit o etiqueta que se compila cuando se publica (el APK de una release tiene que salir del código de su etiqueta)"
        default: ""
  push:
    branches: [web/cort-v0]
    tags: ["cort-v*"]
    paths:
      - "apps/android/**"
      - "cort-web/**"
      - ".github/workflows/apk-movil.yml"

jobs:
  apk:
    runs-on: ubuntu-24.04
    # `contents: write` sólo se usa cuando la corrida pide publicar la release; sin
    # `etiqueta` rellena este paso ni siquiera se intenta. Es el token efímero de
    # Actions, no un secreto nuestro, y no sirve para empujar código: sólo para
    # crear la release y subirle los cuatro archivos.
    permissions:
      contents: write
      # U1: `actions: read` es lo que permite listar los artefactos con `gh api` para
      # saber si el motor ya está compilado. Sin esta línea el `permissions:` de arriba
      # deja el resto en `none` y la lista contesta 403 — no por falta de token, sino
      # por falta de alcance.
      actions: read
    steps:
      - name: código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: cambiarse al código de la etiqueta que se va a publicar
        # Una release tiene que contener el APK de SU etiqueta, no el de la punta de
        # la rama. Si se publicó con `etiqueta`+`comite`, este step hace `checkout`
        # de ese commit antes de compilar; si no, la corrida es normal y no toca nada.
        if: ${{ github.event.inputs.etiqueta != '' }}
        env:
          COMITE: ${{ github.event.inputs.comite }}
        run: |
          if [ -z "$COMITE" ]; then
            echo "::error::se pidió publicar sin decir qué commit: la release saldría con el APK de la punta de la rama"
            exit 1
          fi
          git checkout --detach "$COMITE"
          echo "compilando $(git rev-parse HEAD) para la etiqueta ${COMITE}"
          # Se guarda el SHA resuelto, no el nombre: `target_commitish` de la API de
          # releases acepta un commit o una rama, y HTTP 422 rechaza una etiqueta
          # (medido en la corrida 41974028217: `Release.target_commitish is invalid`
          # con `--target cort-v0.15.1`). Aquí se compila justo el commit de la
          # etiqueta, así que el SHA es lo que la release debe apuntar.
          echo "CODIGO=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: caché del oído (Vosk y JNA; el modelo ya no baja en el build)
        uses: actions/cache@v4
        with:
          path: apps/android/vendor
          key: cort-oido-${{ hashFiles('apps/android/deps.txt') }}
          restore-keys: cort-oido-

      - name: qué trae el runner (medido en el log)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          S="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ls "$S" 2>/dev/null || echo "(el SDK no está en esa ruta)"
          echo "plataformas:"; ls "$S/platforms" 2>/dev/null || echo "(ninguna)"
          echo "build-tools:";  ls "$S/build-tools" 2>/dev/null || echo "(ninguna)"
          for h in aapt2 d8 zipalign apksigner javac keytool unzip curl python3; do
            printf "  %-10s %s\n" "$h" "$(command -v $h || echo '(no está)')"
          done
          java -version 2>&1 | head -2
          echo "disco libre: $(df -h /runner 2>/dev/null | tail -1)"

      - name: buscar el artefacto del motor
        id: busca
        # U1: `libcortmotor.so` la compila `motor-local.yml` con el NDK, en OTRA
        # corrida. Aquí se baja lo que esa corrida publicó, buscando el id por API.
        #
        # Medido en la corrida 42104161078 (2026-11-05, 20:31): con
        # `actions/download-artifact@v4` + `run-id: ${{ env.MOTOR_ARTIFACT }}` el
        # paso se ejecutó y contestó «Artifact not found for name: motor-local-ndk»
        # — el `env.` dentro del `with:` de un `uses:` no llegó a rellenarse y la
        # acción buscó en su propia corrida, que no tiene ese artefacto. El APK salió
        # verde pero SIN motor. Se deja constancia porque es el segundo modo fallido
        # que se prueba aquí; el que funciona es la API directa de abajo.
        # El `first` va dentro del `--jq`, no con `| head -1` pegado al `gh`: con
        # `set -euo pipefail` un `head` que corta la tubería puede dejar a `gh` con
        # señal 141 y el paso entero se aborta — justo lo que no debe abortar.
        run: |
          set -euo pipefail
          LINEA="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name=="motor-local-ndk" and .expired==false)] | first // empty | "\(.id) \(.workflow_run.id) \(.size_in_bytes)"')"
          if [ -z "$LINEA" ]; then
            echo "::warning::no hay artefacto motor-local-ndk: el APK sale SIN cerebro GGUF (la app lo dice en pantalla)"
            echo "art_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ID="${LINEA%% *}"; RESTO="${LINEA#* }"; RUNID="${RESTO%% *}"; PESO="${RESTO##* }"
          echo "motor-local-ndk: artefacto $ID de la corrida $RUNID, $PESO bytes"
          echo "art_id=$ID" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: bajar el motor
        if: steps.busca.outputs.art_id != ''
        # Descarga por la API del artefacto, no con `download-artifact`. La URL del
        # zip responde 302 hacia un enlace firmado de almacenamiento.
        #
        # Medido el 2026-11-05 contra el artefacto 13414146808 con el token de la
        # dueña: `gh api ... -i` NO sirve para leer la cabecera — `gh` sigue la
        # redirección y se pone a bajar los 208 125 998 bytes por la tubería (la
        # sonda local se tuvo que matar dos veces). Lo que sí funciona es `curl -sSI`
        # contra `api.github.com`, que devuelve el `Location` sin cuerpo: son 622
        # caracteres de URL firmada. Y el `curl` de esa URL firmada va SIN cabecera
        # de autorización, a propósito — el enlace ya trae su firma y un token de
        # Actions no debe salir hacia `*.blob.core.windows.net` en una redirección.
        #
        # `continue-on-error`: si esto falla el APK se publica igual, sin cerebro, y
        # el paso de abajo lo confiesa. Una compilación de APK no se pone roja por
        # culpa de un trabajo de otro workflow.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ID='${{ steps.busca.outputs.art_id }}'
          case "$ID" in
            ''|*[!0-9]*) echo "::error::id de artefacto no numérico: '$ID'"; exit 1 ;;
          esac
          LOC="$(curl -sSI -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" \
            | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}')"
          if [ -z "$LOC" ]; then
            echo "::error::la API del artefacto $ID no devolvió URL firmada"
            exit 1
          fi
          case "$LOC" in https://*) ;; *) echo "::error::URL firmada que no es https"; exit 1 ;; esac
          echo "enlace firmado leído (host: $(printf '%s' "$LOC" | sed -e 's|^https://||' -e 's|/.*||'))"
          rm -rf apps/android/vendor/motor-bajado /tmp/motor.zip
          mkdir -p apps/android/vendor/motor-bajado
          # SIN `-L`: si el enlace firmado re-dirigiera otra vez, el token no tiene
          # que viajar a ningún lado. Aquí ya no hay cabecera de autorización.
          curl -sS --fail --max-time 900 -o /tmp/motor.zip "$LOC"
          echo "zip: $(stat -c%s /tmp/motor.zip) bytes · suma $(sha256sum /tmp/motor.zip | awk '{print substr($1,1,12)}')"
          unzip -q /tmp/motor.zip -d apps/android/vendor/motor-bajado
          find apps/android/vendor/motor-bajado -type f -name '*.so' | sed -e 's/^/  /'

      - name: colocar las .so del motor
        if: steps.busca.outputs.art_id != ''
        run: |
          set -euo pipefail
          # El artefacto trae `motor/<abi>/*.so` y `auditoria-motor.txt`. `compilar.sh`
          # espera `vendor/motor/<abi>/`, que es de donde los copia a
          # `build/stage/lib/<abi>/` sin comprimir y alineados.
          #
          # Se busca el directorio donde haya caído `libcortmotor.so` y se copia SÓLO
          # él: enlazado estático y autocontenido, las demás .so del artefacto son
          # llama.cpp suelto y meterlas costaría ~105 MB de APK sin dar ninguna función.
          if [ ! -e apps/android/vendor/motor-bajado ]; then
            echo "::warning::la descarga del motor no trajo nada: el APK sale SIN cerebro GGUF (la app lo dice en pantalla)"
            exit 0
          fi
          # Sin tuberías con `head`: el `find` se recorre entero con `while read` y
          # se guarda el archivo del arm64. De ahí se deduce la raíz y se toman las
          # dos ABIs.
          arm64=""
          while IFS= read -r F; do
            case "$F" in
              */arm64-v8a/libcortmotor.so) arm64="$F" ;;
            esac
          done < <(find apps/android/vendor/motor-bajado -type f -name libcortmotor.so)
          if [ -z "$arm64" ]; then
            echo "::error::el artefacto llegó pero no contiene libcortmotor.so en arm64-v8a; se ve así: $(find apps/android/vendor/motor-bajado -maxdepth 3 | tr '\n' ' ')"
            exit 0
          fi
          raiz="${arm64%/arm64-v8a/libcortmotor.so}"
          mkdir -p apps/android/vendor/motor
          for ABI in arm64-v8a armeabi-v7a; do
            if [ -f "$raiz/$ABI/libcortmotor.so" ]; then
              mkdir -p "apps/android/vendor/motor/$ABI"
              cp "$raiz/$ABI/libcortmotor.so" "apps/android/vendor/motor/$ABI/"
            fi
          done
          echo "motor tomado de: $raiz"
          for F in apps/android/vendor/motor/*/*.so; do
            [ -e "$F" ] || continue
            echo "  $(stat -c%s "$F") bytes · $(sha256sum "$F" | awk '{print substr($1,1,12)}') · $F"
          done

      - name: compilar
        id: compila
        env:
          # Sin estas dos líneas el secreto del repo no llegaría nunca al script:
          # las variables de un paso no se heredan del `env:` del trabajo si no se
          # declaran aquí. Con `CORT_APK_KEYSTORE_B64` el APK se actualiza
          # instalando encima; sin él sale llave desechable y hay que desinstalar.
          CORT_APK_KEYSTORE_B64: ${{ secrets.CORT_APK_KEYSTORE_B64 }}
          CORT_APK_KEYSTORE_PASS: ${{ secrets.CORT_APK_KEYSTORE_PASS }}
        run: |
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ]; then V="$(echo "${GITHUB_REF_NAME}" | sed 's/^cort-v//')"; fi
          case "$V" in *[!0-9.]*) V="0.12.0";; esac
          # El interruptor `delgado` llega como texto desde `workflow_dispatch`
          # ('true'/'false') o como vacío desde un `push`. Comparar con `&&` dentro
          # de la expresión de GitHub daría '1' hasta con la palabra 'false', que
          # es un texto no vacío: se traduce aquí, en el shell, donde sí existe la
          # comparación de cadenas.
          case "${{ github.event.inputs.delgado }}" in
              true|True|1) export CORT_SIN_MOTOR=1 ;;
              *) export CORT_SIN_MOTOR=0 ;;
          esac
          echo "versión: $V · oído local: $([ "$CORT_SIN_MOTOR" = "1" ] && echo 'no (apk delgado)' || echo 'sí')"
          # `set +e` y `bash -x`, ambos medidos en la otra línea del repo (runs
          # 38677344363 y el del 2026-10-15): el shell de Actions se comporta como
          # `bash -e` y mataba el paso antes de leer el código de salida, y un
          # fallo mudo no se puede diagnosticar desde fuera.
          set +e
          bash -x apps/android/compilar.sh "$V" > /tmp/salida.log 2>&1
          COD=$?
          cat /tmp/salida.log
          if [ $COD -ne 0 ]; then
            # Los errores de `javac` y de `d8` PRIMERO y después el final del log:
            # con sólo el `tail`, la lista de veinte se cortaba por caracteres y
            # llegaba la cola del último. Cada run cuesta.
            ERRORES="$(grep -E '\.java:[0-9]+: error:|Error in |Uncaught class' /tmp/salida.log | head -20 | sed 's/%/%25/g')"
            echo "::error::compilar.sh cayó con código $COD"
            printf '%s\n' "${ERRORES:-sin errores .java en el log}" | head -20 | sed 's/^/::error::/'
            tail -c 900 /tmp/salida.log | tr '\n\r' '  ' | sed -e 's/%/%25/g' -e 's/^/::error::final: /'
          fi
          exit $COD

      - name: la suite de comprobaciones del APK
        # Corre DESPUÉS de compilar, porque varias comprobaciones miran lo que salió
        # en `build/`. Y existe porque el 2026-11-04 las notas de la release citaban
        # el número a mano («44 comprobaciones») cuando la suite ya llevaba 51: el
        # texto publicado mentía sobre su propia prueba. Ahora la release copia el
        # número que imprime la suite de esta misma corrida.
        run: |
          python3 scripts/prueba_apk.py | tee /tmp/suite.log
          COD=${PIPESTATUS[0]}
          if [ "$COD" != "0" ]; then
            echo "::error::la suite cayó con código $COD"
            grep -A20 'sin pasar' /tmp/suite.log | sed 's/^/::error::/' || true
            exit $COD
          fi
          TOTAL="$(sed -n 's/^resultado: \([0-9]*\)\/.*/\1/p' /tmp/suite.log | tail -1)"
          echo "COMPROBACIONES=$TOTAL" >> "$GITHUB_ENV"

      - name: publicar el artefacto
        uses: actions/upload-artifact@v4
        with:
          name: CORT-movil-${{ github.run_number }}
          path: |
            apps/android/build/CORT-movil.apk
            apps/android/build/CORT-movil.apk.sha256
            apps/android/build/firma.txt
            apps/android/build/auditoria.txt
          if-no-files-found: error

      - name: publicar la release
        # Sólo cuando la corrida trajo `etiqueta`. Se publica desde el runner porque
        # el APK pesa 56 MB y la línea de la casa va a ~40 KB/s: medido hoy, la
        # bajada del artefacto se cortó dos veces (curl 28 y un timeout de `gh`) y
        # subirla a mano costaría media hora por viaje. El runner sí tiene banda.
        if: ${{ github.event.inputs.etiqueta != '' }}
        env:
          ETIQUETA: ${{ github.event.inputs.etiqueta }}
          COMITE: ${{ github.event.inputs.comite }}
          # Medido en el run 41891940880: sin esta línea el paso se cae con
          # «To use GitHub CLI in a GitHub Actions workflow, set the GH_TOKEN
          # environment variable» y código de salida 4. El `GH_TOKEN` del runner
          # existe, pero `gh` no lo adivina; y es el mismo token efímero al que se
          # le dio `contents: write` arriba — no un secreto nuestro.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd apps/android/build
          # Guarda contra la contradicción medida el 2026-11-05 en la corrida
          # 42104161078: el build salió verde de punta a punta y el APK NO llevaba
          # `libcortmotor.so` (la descarga del motor había fallado en silencio). Las
          # notas de la release prometen «un cerebro GGUF dentro del teléfono», así
          # que publicar ese APK sería publicar una mentira. Se comprueba el propio
          # `auditoria.txt`, que ya lista entrada por entrada lo que entró.
          if grep -q "libcortmotor.so: no está en el APK" auditoria.txt; then
            echo "::error::este APK no lleva libcortmotor.so y las notas prometen el cerebro GGUF: no se publica. Revisá el paso «bajar el motor» (falta el artefacto motor-local-ndk o se cayó la descarga) y corrido de nuevo."
            exit 1
          fi
          # Segunda guarda, del mismo estilo: con el modelo de español fuera del
          # APK, la app necesita `assets/oido.json` para saber de dónde bajarlo.
          # Sin esa ficha el dictado vuelve al motor de Google en silencio.
          if grep -q "assets/oido.json: NO ESTÁ" auditoria.txt; then
            echo "::error::no hay assets/oido.json dentro del APK: el Almacén no tendría de dónde bajar el oído en español. No se publica."
            exit 1
          fi
          # Tercera guarda (F19): la cara. Sin `assets/web/` el teléfono abre la
          # `Cara.java` nativa —el canvas de siempre— y la queja de la dueña
          # («esto no es la versión de PC») volvería a estar publicada en una
          # release verde. `compilar.sh` ya se cae antes, pero el `else` de la
          # auditoría es el que prueba que el `aapt2 link -A` no se comió la carpeta.
          if grep -q "cara del PC: NO ESTÁ" auditoria.txt; then
            echo "::error::el APK no lleva assets/web/: el teléfono mostraría la cara nativa en vez de la interfaz del portátil. No se publica."
            exit 1
          fi
          # Y los archivos sueltos: un `index.html` sin `cort-ui.js` es una pantalla
          # en blanco, que en la práctica es el mismo fallo con otro nombre.
          if grep -A10 "^cara del PC:" auditoria.txt | grep -q "NO ESTÁ"; then
            echo "::error::a la cara del PC le falta algún archivo dentro del APK (ver el bloque «cara del PC» de auditoria.txt). No se publica."
            exit 1
          fi
          PESO=$(stat -c%s CORT-movil.apk)
          # El motivo de este número es la tarde del 2026-11-05: el APK de
          # 162 817 475 bytes se cortó al bajarlo en la casa y el teléfono dijo
          # «aplicación no instalada». Desde `cort-v0.17.2` la dueña pidió el
          # modelo y las dos ABIs dentro con su peso («no importa»), así que el
          # listón ya no es 70 MB sino 120: por encima de ahí se vuelve a la zona
          # donde aquella descarga se cortó, y la salida es desinstalar o compilar
          # con `CORT_ABIS="arm64-v8a"`.
          if [ "$PESO" -gt 120000000 ]; then
            echo "::warning::el APK pesa $PESO bytes: por encima de ~120 MB la descarga de la casa se corta y Samsung lo confunde con una app mal instalada; para volver al paquete de una ABI, CORT_ABIS=\"arm64-v8a\"."
          fi
          MB=$(awk "BEGIN{printf \"%.2f\", $PESO/1048576}" | tr '.' ',')
          SHA=$(awk '{print $1}' CORT-movil.apk.sha256)
          VERSION=$(sed -n 's/^APK móvil de CORT \([^ ]*\).*/\1/p' auditoria.txt)
          CODE=$(sed -n 's/.*versionCode \([0-9]*\).*/\1/p' auditoria.txt)
          OIDO=$(sed -n 's/^oído: //p' auditoria.txt)
          LLAVE=$(sed -n 's/^llave: //p' auditoria.txt)
          HUELLA=$(sed -n 's/.*certificate SHA-256 digest: //p' firma.txt)
          MODEL=$(sed -n 's/^modelo de español: \([0-9]*\) bytes.*/\1/p' auditoria.txt)
          # F19: la prueba de que la cara del PC está dentro del APK no es un
          # adjetivo, es la línea que sacó el propio `zipfile` sobre el archivo
          # publicado. Se copia tal cual en las notas.
          CARA=$(sed -n 's/^cara del PC: //p' auditoria.txt)
          # Las ABIs que de verdad viajaron, leídas de las rutas `lib/<abi>/…` de
          # la misma auditoría: si el artefacto del motor trajera sólo arm64, aquí
          # se ve una y las notas no pueden prometer dos.
          ABIS=$(sed -n 's|^lib/\([^/]*\)/.*|\1|p' auditoria.txt | sort -u | tr '\n' ' ')

          # El número lo dejó el paso de la suite en `$GITHUB_ENV`; el respaldo sólo
          # evita una línea vacía si alguien quita ese paso.
          COMPROBACIONES="${COMPROBACIONES:-la suite}"
          # Miles con espacio y coma decimal, para que la release se lea en español.
          # `numfmt --grouping` depende del locale del runner y en Actions mete comas.
          PESO="$(echo "$PESO" | sed -e :a -e 's/\(.*[0-9]\)\([0-9]\{3\}\)/\1 \2/;ta')"
          MODEL="$(echo "$MODEL" | sed -e :a -e 's/\(.*[0-9]\)\([0-9]\{3\}\)/\1 \2/;ta')"
          # Las notas ya NO se escriben aqui dentro: salen de `apps/android/NOTAS_RELEASE.md`
          # y aqui solo entran los numeros medidos. La razon es una mentira medida el
          # 2026-11-04 al publicar `cort-v0.13.0`: el texto del 0.12.0 seguia diciendo que
          # esta rama no servia `/memoria/puente` y que la camara del telefono no se usaba,
          # y las dos cosas ya eran falsas. Un texto fijo dentro del YAML no se entera de
          # lo que compila: un archivo de markdown del repo, si.
          export NOTAS_VERSION="$VERSION" NOTAS_CODE="$CODE" NOTAS_PESO="$PESO" \
                 NOTAS_MB="$MB" NOTAS_SHA="$SHA" NOTAS_OIDO="$OIDO" \
                 NOTAS_LLAVE="$LLAVE" NOTAS_HUELLA="$HUELLA" \
                 NOTAS_MODEL="$MODEL" NOTAS_CHECS="$COMPROBACIONES" \
                 NOTAS_CARA="$CARA" NOTAS_ABIS="$ABIS"
          python3 ../notas_release.py > notas.md
          TITULO="$(python3 ../notas_release.py --titulo)"
          # Si la plantilla o el script fallan, `set -e` tira del paso antes de publicar:
          # es mejor una corrida roja que una release con las notas a medias.
          #
          # Y aquí va el `--target` QUITADO, con su medición del 2026-11-05: la rama por
          # defecto de este repo es hoy `v0.2-demo` — la OTRA línea de CORT, que no se
          # toca— y un `target_commitish` que apunta a un commit de `web/cort-v0` no se
          # resuelve desde ella. `gh release create --target 4874d4b…` contestó HTTP 404
          # con el token de la dueña y el del runner cayó con HTTP 403 en la corrida
          # 41974599997 (antes había caído con 422 por poner el nombre de la etiqueta:
          # `target_commitish` no admite etiquetas). Sin `--target`, GitHub ancla la
          # release a la etiqueta git ya empujada, que es exactamente el commit que se
          # compiló. Eso es lo que comprueba el guarda de abajo: si la etiqueta y el
          # código compilado no son el mismo commit, no se publica.
          # Detalle medido y aceptado: GitHub deja escrito `target_commitish: v0.2-demo`
          # en la release creada desde una etiqueta que ya existe. Es sólo la forma en que
          # la API recuerda la rama por defecto; el tarball de código fuente resuelve a
          # `refs/tags/cort-v0.15.1` (comprobado con curl -IL el 2026-11-05), así que los
          # artefactos apuntan al commit compilado aunque el campo diga otra cosa.
          DESTINO="$(git rev-parse "refs/tags/${ETIQUETA}^{commit}" 2>/dev/null || true)"
          if [ -z "$DESTINO" ]; then
            echo "::error::la etiqueta $ETIQUETA no está en el repo: empujá el tag antes de publicar"
            exit 1
          fi
          if [ -n "${CODIGO:-}" ] && [ "$DESTINO" != "$CODIGO" ]; then
            echo "::error::la release mentiría: la etiqueta apunta a $DESTINO y se compiló $CODIGO"
            exit 1
          fi
          echo "la release queda anclada a $DESTINO (etiqueta $ETIQUETA)"
          if gh release view "$ETIQUETA" >/dev/null 2>&1; then
            gh release edit "$ETIQUETA" --notes-file notas.md --title "$TITULO"
            gh release upload "$ETIQUETA" CORT-movil.apk CORT-movil.apk.sha256 auditoria.txt firma.txt --clobber
          else
            gh release create "$ETIQUETA" CORT-movil.apk CORT-movil.apk.sha256 auditoria.txt firma.txt \
              --title "$TITULO" \
              --notes-file notas.md
          fi
          # Medido en la corrida 41975870042: la release se publicó bien pero este paso
          # cayó con exit 1 por pedir el campo `draft`, que no existe; el nombre real es
          # `isDraft`. Un diagnóstico mal escrito no puede dejar una corrida roja.
          gh release view "$ETIQUETA" --json tagName,targetCommitish,isDraft,isPrerelease,assets \
            --jq '{etiqueta:.tagName, anclada_a:.targetCommitish, borrador:.isDraft, previa:.isPrerelease, archivos:[.assets[]|{nombre:.name,bytes:.size}]}'
