# Publicar la página de Release cuando se empuja una etiqueta (o `main`).
#
# Por qué existe: desde esta máquina no se puede crear una Release por API — no
# hay sesión de `gh` (medido tres veces), no hay `GH_TOKEN`/`GITHUB_TOKEN` en el
# entorno y no hay `~/.config/gh`. Lo que sí se puede es empujar por SSH, y
# GitHub Actions corre con su propio token efímero (`github.token`), así que el
# trabajo de escribir la página lo hace el pipeline con la nota que **ya está
# redactada a mano** en `docs/RELEASE-NOTES.md` (recortada por
# `scripts/nota_release.py`, con sus pruebas en `test_nota_release.py`).
#
# Por qué también `push: branches: main`: un evento `push` de etiqueta busca el
# YAML en el commit al que apunta esa etiqueta, y las cinco que ya estaban
# publicadas (`v0.7.0` … `v0.10.1`) nacieron **antes** de este archivo — en su
# árbol no hay workflow que disparar. `main` sí lo tiene, y el manifiesto de qué
# publicar es `docs/RELEASE-NOTES.md`: al empujar la rama se recorre la lista y
# se abre la página de cada etiqueta que todavía no la tenga.
#
# Es idempotente a propósito: `gh release view` manda al `continue`, así que
# empujar `main` veinte veces no duplica ni pisa ninguna Release.
#
# Y trae `workflow_dispatch` para poder lanzarla a mano desde
# *Actions → publicar-release → Run workflow*, escribiendo una etiqueta.
name: publicar-release

on:
  push:
    tags:
      - "v*"
    branches:
      - "main"
  workflow_dispatch:
    inputs:
      etiqueta:
        description: "Etiqueta ya publicada que quieres convertir en Release (p. ej. v0.10.0). Vacío: todas las que tengan nota escrita."
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: publicar-release
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar la rama con las notas
        uses: actions/checkout@v4
        with:
          # Siempre la rama por defecto: es donde vive `docs/RELEASE-NOTES.md`
          # completo y donde está este YAML. La etiqueta a publicar se pasa
          # como dato, no como ref.
          ref: ${{ github.event.repository.default_branch }}

      - name: Publicar las Releases que no estén
        env:
          GH_TOKEN: ${{ github.token }}
          # Tres formas de entrar: escribiendo una etiqueta a mano, empujando un
          # tag (`ref_type: tag` y `ref_name: v0.10.1`), o empujando `main`. En
          # el último caso `ref_name` sería «main», que no es una etiqueta, así
          # que sólo se usa cuando `ref_type` dice que de verdad es un tag.
          FIJA: ${{ github.event.inputs.etiqueta }}
          TIPO: ${{ github.event.ref_type }}
          REF: ${{ github.event.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${FIJA:-}" ]; then
            lista="$FIJA"
          elif [ "${TIPO:-}" = "tag" ]; then
            lista="$REF"
          else
            lista="$(python3 scripts/nota_release.py --list)"
          fi
          if [ -z "$lista" ]; then
            echo "No hay etiqueta que publicar (ni en el evento ni en las notas)."
            exit 0
          fi
          publicadas=0
          omitidas=0
          for etiqueta in $lista; do
            if gh release view "$etiqueta" >/dev/null 2>&1; then
              echo "· $etiqueta ya tiene página: no la piso."
              omitidas=$((omitidas + 1))
              continue
            fi
            if python3 scripts/nota_release.py "$etiqueta" nota.md titulo.txt; then
              gh release create "$etiqueta" --title "$(cat titulo.txt)" --notes-file nota.md
            else
              # Etiqueta sin sección: mejor notas generadas que una página muda.
              gh release create "$etiqueta" --generate-notes
            fi
            publicadas=$((publicadas + 1))
          done
          echo "Releases abiertas: $publicadas · ya existían: $omitidas"
