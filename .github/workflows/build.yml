name: Construir instaladores CORT

# Compila el holograma de escritorio para Windows y Linux SIN usar tu PC, y el
# APK del teléfono con el SDK que trae el runner:
# cada vez que creas una etiqueta v* (p. ej. git tag -a v0.2.0-demo && git push origin v0.2.0-demo)
# o desde Actions → "Construir instaladores CORT" → Run workflow.
# Los instaladores (.exe y .AppImage) aparecen como artefactos descargables
# en la página de la ejecución y en la Release si el push fue de una etiqueta.
#
# Si un paso falla, los registros de Actions NO son públicos: el trabajo
# vuelca las últimas líneas del error como anotación del check, que sí se
# puede leer desde la API pública.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false           # que Windows no se cancele si Linux falla
      matrix:
        include:
          - os: windows-latest   # instalador .exe (NSIS)
            script: dist:win
          - os: ubuntu-latest    # AppImage + .deb
            script: dist:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Instalar dependencias
        shell: bash
        run: |
          set -o pipefail
          npm install 2>&1 | tee /tmp/npm-install.log
      - name: Construir instalador (${{ matrix.os }})
        shell: bash
        run: |
          set -o pipefail
          npm run ${{ matrix.script }} 2>&1 | tee /tmp/build.log
      - name: Volcar el fallo como anotación (los logs no son públicos)
        if: failure()
        shell: bash
        run: |
          LOG=/tmp/build.log
          [ -s "$LOG" ] || LOG=/tmp/npm-install.log
          MSG=$(tail -c 3200 "$LOG" | tr '\n' ' ' | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/:/%3A/g')
          echo "::error title=Fallo en ${{ matrix.script }}::$MSG"
      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.os }}
          path: |
            desktop/out/*.exe
            desktop/out/*.AppImage
            desktop/out/*.deb
          if-no-files-found: error

  # El APK del teléfono se compila AQUÍ y nunca en el portátil de la dueña:
  # 1,8 GiB de RAM y sin `javac` (medido). El runner trae el SDK de Android y
  # `apps/apk/compilar.sh` usa `aapt2` + `javac` + `d8` + `zipalign` +
  # `apksigner`, sin Gradle ni AndroidX. La interfaz que viaja dentro del APK es
  # `ui/` de este mismo commit, copiada a `assets/ui/` por el propio script.
  apk:
    runs-on: ubuntu-latest
    env:
      APK_VERSION: "2.10.1"       # UN SOLO APK: el de Java + Kotlin, con todo dentro:
                                 # cara embebida, reproductor con `MediaSession`,
                                 # avisos leídos, modo juego, MV con letra, el mando
                                 # del aparato (volumen, linterna, alarma,
                                 # temporizador, abrir apps, voces del TTS, memoria
                                 # en SQLite, cerebro en la nube, atuendos), el
                                 # OÍDO PROPIO de 2.3.0 (Vosk 0.3.47 con su modelo
                                 # de español), la firma con los tres esquemas a la
                                 # fuerza + la auditoría de instalabilidad de 2.3.1,
                                 # en 2.4.0 los CEREBROS DE CASA (`Ollama.java`:
                                 # lista, descarga con barra, borra y piensa por
                                 # Wi-Fi con el Ollama del PC), la terminal ampliada
                                 # en el teléfono y las REGLAS «cuando X, entonces Y»
                                 # (`automatiza.js`, hoja Equipo · 8), y en 2.4.1 las
                                 # VÍAS PARA ABRIR CORT: la cara se declara
                                 # `ACTION_ASSIST` + `ACTION_VOICE_COMMAND` (el gesto
                                 # del asistente y el botón del auricular mantenido),
                                 # hay baldosín en la cortina rápida (`.Panel`), tres
                                 # atajos en el icono del cajón (`res/xml/atajos.xml`)
                                 # y el doble toque funciona también con la cara
                                 # cerrada (`Reproductor.onMediaButtonEvent`), y en
                                 # 2.8.0 el CATÁLOGO MEDIDO (107 modelos con los bytes
                                 # leídos del registro), el COPILOTO de Código (sólo
                                 # comandos de sólo lectura, dos puertas) y el AVISO de
                                 # que la bajada de un modelo terminó, sin tocar el
                                 # manifiesto; y en 2.9.0 la BAJADA FÍABLE: el progreso
                                 # se suma por capa del manifiesto (antes la última
                                 # ganaba y la barra se quedaba quieta), un `GET
                                 # /api/version` delante corta a los ~3 s un PC dormido
                                 # en vez de esperar 90 s a un timeout, hay CANCELAR
                                 # (botón, voz y la acción `cancela` del puente que ya
                                 # existía: cero permisos nuevos, cero métodos nuevos),
                                 # y mientras baja algo no se lanza una segunda bajada
                                 # que pise el cancelar.
                                 # Tiene que ser IGUAL que el valor por defecto de
                                 # `APK_VERSION` en `apps/apk/compilar.sh`: el
                                 # sector [5] de `scripts/prueba-costura.py` cruza
                                 # los dos, y si se separan la Release anuncia un
                                 # enlace que no es el archivo que sube.
    steps:
      - uses: actions/checkout@v4
      # -- La misma llave de firma en todas las Releases ----------------------
      # Sin esto, cada run firmaba con una llave nueva, y para Android una firma
      # distinta es OTRA aplicación: actualizar == desinstalar, y al desinstalar
      # se van el permiso del micrófono, el de los avisos y la dirección del PC
      # escrita a mano. La caché guarda `apps/apk/keystore/` (keystore + su
      # contraseña) y la devuelve en el siguiente run. `apps/apk/llave.sh` prefiere
      # el secreto `CORT_APK_KEYSTORE_B64` si algún día existe: la caché es la vía
      # que no le pide a la dueña configurar nada.
      # Comprobación pública de que funciona: la huella SHA-256 del certificado
      # sale en el `-firma.txt` de cada APK y como anotación del check-run. Si dos
      # Releases seguidas tienen la misma huella, la llave se mantuvo.
      - name: Cachear la llave de firma
        uses: actions/cache@v4
        with:
          path: apps/apk/keystore
          key: cort-apk-keystore-v1
          restore-keys: cort-apk-keystore-v1
      # -- Las 53 MB del motor, una sola vez ---------------------------------
      # `apps/apk/motor.sh` baja el AAR de Vosk (12.297.565 B), el de JNA
      # (517.278 B) y el modelo de español (39.817.833 B). Son archivos FIJOS, con
      # peso y huella comprobados en el propio script, así que se pueden cachear
      # por versión sin riesgo de quedarse con un motor viejo: si `motor.sh` cambia
      # de número, la clave cambia y se vuelve a bajar. Sin esto, cada run gastaría
      # ~2 minutos de red y dependería de que alphacephei.com esté despierto.
      - name: Cachear el motor offline (Vosk + JNA + modelo)
        uses: actions/cache@v4
        with:
          path: apps/apk/motor-cache
          key: cort-motor-vosk-0.3.47-small-es-0.42-v1
          restore-keys: cort-motor-vosk-
      # `kotlinc` son 87 MB de compilador que no cambian; se cachea aparte del
      # motor porque lo necesita tanto la prueba del oído como el build del APK.
      - name: Cachear el compilador Kotlin
        uses: actions/cache@v4
        with:
          path: ~/.cache/cort-kotlin
          key: cort-kotlin-1.9.24-v1
          restore-keys: cort-kotlin-
      - name: Comprobar la costura (manifiesto ↔ Java ↔ cara)
        id: costura
        # `scripts/prueba-costura.py` es lo único que puede decir si las tres capas
        # se nombran lo mismo, y `javac` NO lo ve nunca: un `@JavascriptInterface`
        # que la cara llama con otro nombre, una pantalla que Java nombra `equipo`
        # y `pantallas.js` no tiene, un `<service>` sin su `android:permission`, un
        # atajo con la etiqueta escrita como literal, un símbolo `@hide` que el
        # `android.jar` no exporta. Son 21 sectores y cuesta una fracción de
        # segundo, así que va EL PRIMERO del trabajo: si la costura está abierta,
        # no gasta ni motor ni SDK. La anotación es obligatoria —los registros de
        # Actions son privados y este repo no tiene token para leerlos—.
        shell: bash
        run: |
          set +e
          python3 scripts/prueba-costura.py > /tmp/costura.log 2>&1
          st=$?
          tail -30 /tmp/costura.log
          if [ $st -ne 0 ]; then
            msg=$(grep -E '^  · |FALTA' /tmp/costura.log \
                  | head -12 | tr '\n\r' '  ' | sed 's/%/%25/g')
            [ -n "$msg" ] || msg=$(tail -10 /tmp/costura.log | tr '\n\r' '  ' | sed 's/%/%25/g')
            echo "::error::prueba-costura.py salió con $st — ${msg:-registro vacío}"
            exit $st
          fi
      - name: Probar el clima y el registro de código (sin red)
        id: clima
        # `scripts/prueba-clima.py` ejerce la parte del cerebro que NO necesita
        # teléfono ni nube: qué ciudad se entendió de la frase («el tiempo en Gijón
        # ahora mismo» tiene que dar Gijón, y «el clima de la semana» no puede dar
        # Semana), la tabla WMO —que antes decía «despejado» a todo—, que una ciudad
        # inexistente se devuelva con su nombre entre comillas en vez del tiempo de
        # otra, y que «hazme una app del clima en Python» se conteste con código y no
        # con el termómetro. Con `sensors.weather` sustituido por un gemelo y la base
        # de memoria en `mktemp`: no gasta cuota de Groq ni abre su .env.
        #
        # Y LO QUE NINGUNA PRUEBA EN CASA PUEDE VER: el guion arrastra dos paquetes
        # de terceros. `brain.local_command` hace `import local_commands`, y ése
        # abre con `import psutil`; `sensors.weather` abre con `import requests`.
        # Los dos están en `backend/requirements.txt` y en el `.venv` de la dueña,
        # pero el `python3` del runner NO los trae: el run 39879890814 (etiqueta
        # v0.2.30-demo) se cayó ahí, con `ModuleNotFoundError: No module named
        # 'psutil'`, en verde en casa y rojo en Actions. Por eso se instalan los dos
        # y luego se comprueba IMPORTANDO, no esperando: la imagen nueva (Ubuntu 26
        # desde el 19-10-2026) puede bloquear `pip` por PEP 668, así que se reintenta
        # con `--user` y con `--break-system-packages`; si aun así no cuela, la
        # anotación dice lo que contestó pip en vez de un traceback a medias.
        shell: bash
        run: |
          set +e
          hacen_falta() { ! python3 -c "import requests, psutil" >/dev/null 2>&1; }
          for opciones in "" "--user" "--break-system-packages" "--break-system-packages --user"; do
            hacen_falta || break
            python3 -m pip install --quiet $opciones requests psutil >> /tmp/pip-clima.log 2>&1
          done
          if hacen_falta; then
            echo "::error::el runner no tiene requests/psutil y pip no los instaló — $(tail -4 /tmp/pip-clima.log | tr '\n\r' '  ' | sed 's/%/%25/g')"
            exit 1
          fi
          python3 scripts/prueba-clima.py > /tmp/clima.log 2>&1
          st=$?
          tail -25 /tmp/clima.log
          if [ $st -ne 0 ]; then
            msg=$(grep -E '^  FALLA' /tmp/clima.log \
                  | head -12 | tr '\n\r' '  ' | sed 's/%/%25/g')
            [ -n "$msg" ] || msg=$(tail -10 /tmp/clima.log | tr '\n\r' '  ' | sed 's/%/%25/g')
            echo "::error::prueba-clima.py salió con $st — ${msg:-registro vacío}"
            exit $st
          fi
      - name: Probar el gestor de modelos de Ollama (sin Ollama, sin red)
        id: modelos
        # `scripts/prueba-modelos.py` es la red que falta para que «no descarga los
        # modelos» deje de ser un misterio. Vigila cuatro cosas, todas con gemelos
        # del taller y `CORT_HOME` en `mktemp` (no enciende nada, no le baja nada a
        # ella): (1) que el módulo VIVA sin `psutil` —el run 39879890814 se cayó
        # justo ahí— y que entonces declare «sin medir» en vez de inventarse el
        # veredicto; (2) que `ollama serve` se arranque con `OLLAMA_HOST` de red
        # (0.0.0.0), que el mando `ollama_red` de Ajustes llegue de verdad al
        # entorno y que el `OLLAMA_HOST` que ella ya puso no se pise; (3) que la
        # dirección que se enseña en pantalla sea la que responde —y que con Ollama
        # apagado nadie salga a la red a preguntarse—; (4) que el sitio del disco se
        # compruebe ANTES de lanzar la bajada, sin negativear un modelo que no está
        # en el catálogo medido.
        #
        # No necesita `psutil` ni `requests`: las dos dependencias se sustituyen o se
        # declaran ausentes a propósito, que es el caso del runner.
        shell: bash
        run: |
          set +e
          python3 scripts/prueba-modelos.py > /tmp/modelos.log 2>&1
          st=$?
          tail -30 /tmp/modelos.log
          if [ $st -ne 0 ]; then
            msg=$(grep -E '^  FALLA' /tmp/modelos.log \
                  | head -12 | tr '\n\r' '  ' | sed 's/%/%25/g')
            [ -n "$msg" ] || msg=$(tail -10 /tmp/modelos.log | tr '\n\r' '  ' | sed 's/%/%25/g')
            echo "::error::prueba-modelos.py salió con $st — ${msg:-registro vacío}"
            exit $st
          fi
      - name: Probar la boca del escritorio (sin sonido, sin red)
        id: boca
        # `scripts/prueba-voz.py` ejerce la voz del PC, que en Linux NO puede ir por
        # el navegador: medido el 2026-10-22 con `scripts/sonda-voz.html`, este
        # Chromium da `speechSynthesis` con CERO voces y `voiceschanged` vacío, así
        # que CORT «hablaba» en silencio y los mandos de 07 · Perfil no mandaban en
        # nada. Desde aquí la boca es el motor del equipo (`espeak-ng`) a través del
        # núcleo. Se compran con un motor de papel —la salida real de `--voices=es`,
        # los códigos de salida y el error de mbrola medidos—: la conversión de los
        # tres mandos (tono→`-p`, velocidad→`-s`, timbre→`-v` sólo si existe), que la
        # variante que el motor ignora NO se ofrezca, que cada fracaso salga con su
        # nombre (`sin-motor`, `vacio`, `no-suena`, `no-responde`), que no queden
        # temporales `cort-voz-*` y que la orden se mande sin shell. Si el runner
        # tiene espeak-ng de verdad, además se sintetiza un WAV y se comprueba su
        # tamaño; si no, se anuncia y no se finge. No abre su .env ni gasta cuota.
        shell: bash
        run: |
          set +e
          python3 scripts/prueba-voz.py > /tmp/boca.log 2>&1
          st=$?
          tail -25 /tmp/boca.log
          if [ $st -ne 0 ]; then
            msg=$(grep -E '^  FALLA' /tmp/boca.log \
                  | head -12 | tr '\n\r' '  ' | sed 's/%/%25/g')
            [ -n "$msg" ] || msg=$(tail -10 /tmp/boca.log | tr '\n\r' '  ' | sed 's/%/%25/g')
            echo "::error::prueba-voz.py salió con $st — ${msg:-registro vacío}"
            exit $st
          fi
      - name: Probar el cerebro en el JDK (lógica, sin teléfono)
        id: mente
        # `scripts/prueba-mente.sh` compila `Cerebro`, `Razon`, `Nube` y `Mente`
        # contra los gemelos de papel de `apps/apk/prueba/papeles` y ejecuta las
        # tres suites: las cuentas a pelo, la ruta de quién responde, y las 283
        # frases de la tabla contra las DOS tablas (la del asset y la del código).
        # Va ANTES de compilar el APK porque si la lógica está rota, el APK se
        # compila igual y llega al teléfono contestando tonterías: ese fallo no lo
        # ve `javac`. Con anotación, porque los registros de Actions son privados.
        shell: bash
        run: |
          set +e
          bash scripts/prueba-mente.sh > /tmp/mente.log 2>&1
          st=$?
          tail -25 /tmp/mente.log
          if [ $st -ne 0 ]; then
            msg=$(grep -E 'FALLO|falla|Error|error:|excepción|Exception' /tmp/mente.log \
                  | head -12 | tr '\n\r' '  ' | sed 's/%/%25/g')
            [ -n "$msg" ] || msg=$(tail -10 /tmp/mente.log | tr '\n\r' '  ' | sed 's/%/%25/g')
            echo "::error::prueba-mente.sh salió con $st — ${msg:-registro vacío}"
            exit $st
          fi
      - name: Probar el motor de automatizaciones con node (sin teléfono)
        id: autos
        # `scripts/prueba-automatiza.mjs` ejerce las reglas «cuando X, entonces Y»
        # sobre el módulo PURO (`ui/js/automatiza.js`): los acentos de la frase, el
        # freno de un minuto, «a las 7:30 una vez al día», la señal del aviso que
        # manda `.Avisos`, la batería del `aparato()` y lo que pasa cuando una acción
        # no existe en este APK. Con almacén, reloj y manos de mentira, así que no
        # necesita WebView ni Android. Son 45 comprobaciones y valen lo que vale el
        # bloque 8 de la hoja Equipo.
        shell: bash
        run: |
          set +e
          node scripts/prueba-automatiza.mjs > /tmp/autos.log 2>&1
          st=$?
          tail -20 /tmp/autos.log
          if [ $st -ne 0 ]; then
            msg=$(grep -E '  NO |FALTA|Error|error:' /tmp/autos.log \
                  | head -12 | tr '\n\r' '  ' | sed 's/%/%25/g')
            [ -n "$msg" ] || msg=$(tail -10 /tmp/autos.log | tr '\n\r' '  ' | sed 's/%/%25/g')
            echo "::error::prueba-automatiza.mjs salió con $st — ${msg:-registro vacío}"
            exit $st
          fi
      - name: Probar los mandos de la voz con node (sin teléfono)
        id: mandos
        # `scripts/prueba-mandos.mjs` ejerce la capa que decide si «pausa» es un
        # mando y a quién se le manda, sobre el módulo PURO `ui/js/mandos.js`: el
        # punto que el reconocedor pega al final («Pausa.»), los acentos, las
        # frases que NO deben casar («un cuadro de la casa»), y la tabla de verdad
        # de los destinos —reproductor de CORT, otra app con teclas, otra app sin
        # teclas, y nada sonando—. Son 63 comprobaciones; valen lo que vale la
        # mitad de F12, la que antes sólo se podía descubrir en su teléfono.
        shell: bash
        run: |
          set +e
          node scripts/prueba-mandos.mjs > /tmp/mandos.log 2>&1
          st=$?
          tail -20 /tmp/mandos.log
          if [ $st -ne 0 ]; then
            msg=$(grep -E '  NO |FALTA|Error|error:' /tmp/mandos.log \
                  | head -12 | tr '\n\r' '  ' | sed 's/%/%25/g')
            [ -n "$msg" ] || msg=$(tail -10 /tmp/mandos.log | tr '\n\r' '  ' | sed 's/%/%25/g')
            echo "::error::prueba-mandos.mjs salió con $st — ${msg:-registro vacío}"
            exit $st
          fi
      - name: Probar los colores del orbe con node (sin WebGL)
        id: colores
        # `scripts/prueba-colores.mjs` ejerce el módulo PURO `ui/js/traje.js`, del
        # que `orb.js` saca sus dieciséis colores. La prueba decisiva de F17 es
        # «cambiar de traje ⇒ cambian TODOS los colores del orbe», y en un CI no
        # hay GPU: aquí se mide la derivación de los seis trajes de `Paleta.java`,
        # que ninguno se quede en el cian de fábrica, que dos trajes no den la
        # misma paleta y que un color roto caiga a fábrica sin apagar la cara.
        shell: bash
        run: |
          set +e
          node scripts/prueba-colores.mjs > /tmp/colores.log 2>&1
          st=$?
          tail -20 /tmp/colores.log
          if [ $st -ne 0 ]; then
            msg=$(grep -E '  NO |FALTA|Error|error:' /tmp/colores.log \
                  | head -12 | tr '\n\r' '  ' | sed 's/%/%25/g')
            [ -n "$msg" ] || msg=$(tail -10 /tmp/colores.log | tr '\n\r' '  ' | sed 's/%/%25/g')
            echo "::error::prueba-colores.mjs salió con $st — ${msg:-registro vacío}"
            exit $st
          fi
      - name: Probar el oído propio con Vosk de verdad (sin teléfono)
        id: oido
        # `scripts/prueba-oido.sh` hace lo que `javac` no puede hacer NUNCA: carga
        # el modelo de español de verdad (`vosk.jar` de escritorio lleva el mismo
        # `libvosk.so` de linux que el AAR de Android), le mete muestras de audio a
        # mano por el gemelo de papel de `AudioRecord` y comprueba seis cosas del
        # `Oido.kt` que sólo se romperían en el teléfono: que el ZIP se desempaca y
        # `Model()` lo acepta, que el silencio avisa `no-speech`, que la señal manda
        # `stt-speech` y `stt-level` entre 0 y 1, que un `read()` negativo —el
        # micrófono que le quita un juego a mitad— NO tumba el proceso, que
        # `cancela()` cierra con UN solo `stt-end`, y que sin sitio libre no lo
        # intenta ni destruye datos. Va antes del APK porque un `Oido` roto llega
        # igual al teléfono y se queda mudo, que es justo la queja que motivó la
        # ronda.
        shell: bash
        env:
          MOTOR_CACHE_DIR: apps/apk/motor-cache
        run: |
          set +e
          chmod +x apps/apk/motor.sh scripts/prueba-oido.sh
          bash scripts/prueba-oido.sh > /tmp/oido.log 2>&1
          st=$?
          grep -vE '^LOG \(VoskAPI' /tmp/oido.log | tail -30
          if [ $st -ne 0 ]; then
            msg=$(grep -E 'FALLA|FALLO|error:|Exception|OutOfMemory|sin asignar' /tmp/oido.log \
                  | grep -vE '^LOG \(VoskAPI' | head -12 | tr '\n\r' '  ' | sed 's/%/%25/g')
            # si la búsqueda no encuentra nada NO se dice «sin detalle»: se vuelca
            # el final del registro igual. En el run rojo de `v0.2.20-demo` el error
            # fue `motor.sh: línea 63: nombre: variable sin asignar`, que no entraba
            # en ningún patrón, y la anotación se quedó vacía — sin sesión no hay
            # forma de leer el registro, así que el vacío es quedar ciego otra vez.
            [ -n "$msg" ] || msg=$(grep -vE '^LOG \(VoskAPI' /tmp/oido.log | tail -12 | tr '\n\r' '  ' | sed 's/%/%25/g')
            echo "::error::prueba-oido.sh salió con $st — ${msg:-registro vacío}"
            exit $st
          fi
      - name: Compilar el APK (aapt2 + kotlinc + javac + d8, sin Gradle)
        id: java
        # **El único APK que existe.** Desde `v0.2.11-demo` ya no se rempaqueta el
        # cuerpo Kotlin original: todo —asistente predeterminado, doble toque del
        # auricular, avisos en voz alta, reproductor propio, contactos y marcar—
        # está en el Java de `apps/apk/src`, y la firma es la de siempre con el
        # anillo del original (`base/CORT-IA-1.1.0.apk` sólo aporta el icono).
        # Sin `continue-on-error`: no hay segunda pata que salve la Release, así
        # que si el Java se rompe, el run se para y la anotación lo dice.
        shell: bash
        env:
          # La llave de firma: secreto del repo si existe; si no, la caché de
          # arriba (`apps/apk/keystore`). `apps/apk/llave.sh` decide en ese orden y
          # `firma.txt` cuenta cuál se usó, que es lo que ella puede leer sin
          # sesión de GitHub.
          CORT_APK_KEYSTORE_B64: ${{ secrets.CORT_APK_KEYSTORE_B64 }}
          CORT_APK_KEYSTORE_PASS: ${{ secrets.CORT_APK_KEYSTORE_PASS }}
        run: |
          # `set +e` es obligatorio: el shell de GitHub se comporta como `bash -e`
          # y mataría el paso antes de `st=$?` y antes de la anotación, dejando un
          # fallo mudo que no se puede leer desde fuera.
          set +e
          chmod +x apps/apk/compilar.sh
          bash -x apps/apk/compilar.sh "$APK_VERSION" > /tmp/apk.log 2>&1
          st=$?
          cat /tmp/apk.log
          if [ $st -ne 0 ]; then
            # Los registros de Actions NO se pueden descargar sin sesión (la API de
            # logs responde 403), pero los annotations del check-run sí se leen por
            # la API pública. `javac` imprime el error en una línea y el detalle
            # (`symbol:` / `location:` / `required:`) en las siguientes: sin ellas
            # hay que adivinar qué método no existe, y eso cuesta una compilación.
            errores="$(grep -E -A 3 '\.java:[0-9]+: error:' /tmp/apk.log \
                       | grep -E '\.java:[0-9]+: error:|symbol:|location:|required:|found:|reason:' \
                       | head -40)"
            # Y lo que diga la auditoría del APK final (`scripts/audita-apk.sh`): si
            # se puso MAL es porque el archivo no es instalable — firma ausente,
            # `resources.arsc` comprimido o desalineado, marcado como depurable — y
            # ese renglón es la noticia, no el final del log.
            auditoria="$(grep -E 'VEREDICTO|auditoría de instalabilidad|no conoce --v|sin ninguna firma|ZIP: MAL|resources\.arsc|certificado:|esquemas pedidos' /tmp/apk.log | tail -14)"
            msg=$( { echo "-- errores --"; echo "${errores:-ninguno}"; \
                     echo "-- auditoría --"; echo "${auditoria:-la auditoría no llegó a correr}"; \
                     echo "-- final del log --"; tail -c 900 /tmp/apk.log; } \
                   | tr '\n\r' '  ' | sed 's/%/%25/g' )
            echo "::error::compilar.sh salió con $st — $msg"
            exit $st
          fi
      - name: Bautizar el APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk
          cp apps/apk/build/CORT.apk "apk/CORT-IA-${APK_VERSION}.apk"
          cp apps/apk/build/firma.txt "apk/CORT-IA-${APK_VERSION}-firma.txt"
          # Se guarda el log del build completo: el paso de abajo pisa /tmp/apk.log.
          cp /tmp/apk.log /tmp/apk-completo.log
      - name: Compilar TAMBIÉN el perfil NÚCLEO (sin la superficie que delata)
        id: nucleo
        # Ronda 2.5. La bisección del peso se cayó sola: ella instaló los dos APK de
        # la 2.4.2 — el de 47 MB y el de 1,6 MB — y Play Protect bloqueó LOS DOS. Con
        # eso muere «es el bulto del oído» y queda la única diferencia que quedó en
        # pie, medida lectura de manifiesto binario contra lectura de manifiesto
        # binario en el mismo disco:
        #
        #   CORT-IA-1.1.0 / 1.1.4 (se instalan)  13 permisos, CERO servicios `BIND_*`
        #   CORT-IA-2.4.2 (bloqueado)            28 permisos, cuatro permisos `BIND_*`
        #                                        repartidos en cinco servicios
        #
        # y las cuatro Gordas (`MANAGE_EXTERNAL_STORAGE`, `SYSTEM_ALERT_WINDOW`,
        # `REQUEST_IGNORE_BATTERY_OPTIMIZATIONS`, `READ_EXTERNAL_STORAGE`) están en
        # los TRES, así que no eran ellas. Lo que el 2.x declara y el 1.x no es el
        # traje de asistente (`VoiceInteractionService` + `VoiceInteractionSessionService`
        # + `RecognitionService`), el lector de notificaciones, el baldosín de Ajustes
        # Rápidos, `ACTION_ASSIST`/`ACTION_VOICE_COMMAND` y `CALL_PHONE` +
        # `READ_CONTACTS` + `READ_CALENDAR`. Esa es la firma con la que un clasificador
        # automático describe un troyano de accesibilidad.
        #
        # El `nucleo` es la misma CORT recortada A ESA variable y nada más: mismas
        # fuentes, mismo dex, mismo oído, misma cara, misma llave, mismo `versionCode`,
        # 21 permisos normales y CERO servicios privilegiados. Si éste se instala, el
        # bloqueo era la superficie y la decisión de producto es inmediata: ofrecer el
        # núcleo primero y dar el asistente después. Si tampoco, ya no queda
        # explicación dentro del archivo y hay que ir a por el otro camino — el que
        # necesita sesión de Google: subir a Play, o `adb install -r`, que también
        # está documentado. Va el segundo para no pisar el manifiesto del completo.
        shell: bash
        env:
          CORT_APK_KEYSTORE_B64: ${{ secrets.CORT_APK_KEYSTORE_B64 }}
          CORT_APK_KEYSTORE_PASS: ${{ secrets.CORT_APK_KEYSTORE_PASS }}
          APK_PERFIL: "nucleo"
        run: |
          set +e
          bash -x apps/apk/compilar.sh "$APK_VERSION" > /tmp/apk-nucleo.log 2>&1
          st=$?
          tail -30 /tmp/apk-nucleo.log
          if [ $st -ne 0 ]; then
            errores="$(grep -E -A 3 '\.java:[0-9]+: error:' /tmp/apk-nucleo.log \
                       | grep -E '\.java:[0-9]+: error:|symbol:|location:|required:|found:|reason:' \
                       | head -20)"
            auditoria="$(grep -E 'VEREDICTO|ZIP: MAL|sin ninguna firma|manifiesto binario|perfil declarado' /tmp/apk-nucleo.log | tail -8)"
            msg=$( { echo "-- nucleo: errores --"; echo "${errores:-ninguno}"; \
                     echo "-- nucleo: auditoría --"; echo "${auditoria:-no corrió}"; \
                     echo "-- nucleo: final del log --"; tail -c 700 /tmp/apk-nucleo.log; } \
                   | tr '\n\r' '  ' | sed 's/%/%25/g' )
            echo "::error::compilar.sh (perfil nucleo) salió con $st — $msg"
            exit $st
          fi
          cp apps/apk/build/CORT.apk "apk/CORT-IA-${APK_VERSION}-nucleo.apk"
          cp apps/apk/build/firma.txt "apk/CORT-IA-${APK_VERSION}-nucleo-firma.txt"
          echo "peso nucleo: $(stat -c '%s' "apk/CORT-IA-${APK_VERSION}-nucleo.apk") B"
          grep -E 'perfil |manifiesto binario|perfil declarado' /tmp/apk-nucleo.log | head -4
      - name: Compilar TAMBIÉN el núcleo SIN el oído dentro
        id: nucleo-ligero
        # La tercera celda de la matriz, que es la que de verdad se parece al `1.1.4`
        # que sí se instala: superficie recortada (`APK_PERFIL=nucleo`) y bulto nativo
        # fuera (`APK_SIN_OIDO=1`). Con dos envases no se puede distinguir «la
        # superficie» de «la superficie MÁS el modelo de 45 MB»: con tres, la matriz
        # queda completa y el teléfono de ella contesta en una tarde.
        #
        #   envase                      superficie   oído dentro   peso
        #   CORT-IA-2.4.2-ligero        privilegiada NO            1.621.264 B  (bloqueado)
        #   CORT-IA-2.4.2               privilegiada SÍ            47.390.449 B  (bloqueado)
        #   CORT-IA-2.5.0-nucleo        núcleo        SÍ            ~47 MB        ?
        #   CORT-IA-2.5.0-nucleo-ligero núcleo        NO            ~1,6 MB       ?
        #
        # Si el `nucleo` entra y el `nucleo-ligero` también: era la superficie, y se
        # puede dar el oído como descarga aparte. Si SÓLO entra el `nucleo-ligero`: era
        # la mezcla, y el modelo de español tiene que salir del APK. Si no entra
        # ninguno de los dos: ya no queda nada dentro del archivo que culpar, y el
        # camino es `adb install -r` o listar la app en Play (`docs/BLOQUEO-PLAY-PROTECT.md`).
        shell: bash
        env:
          CORT_APK_KEYSTORE_B64: ${{ secrets.CORT_APK_KEYSTORE_B64 }}
          CORT_APK_KEYSTORE_PASS: ${{ secrets.CORT_APK_KEYSTORE_PASS }}
          APK_PERFIL: "nucleo"
          APK_SIN_OIDO: "1"
        run: |
          set +e
          bash -x apps/apk/compilar.sh "$APK_VERSION" > /tmp/apk-nucleo-ligero.log 2>&1
          st=$?
          tail -30 /tmp/apk-nucleo-ligero.log
          if [ $st -ne 0 ]; then
            auditoria="$(grep -E 'VEREDICTO|ZIP: MAL|sin ninguna firma|manifiesto binario|perfil declarado' /tmp/apk-nucleo-ligero.log | tail -8)"
            msg=$( { echo "-- nucleo-ligero: auditoría --"; echo "${auditoria:-no corrió}"; \
                     echo "-- nucleo-ligero: final del log --"; tail -c 700 /tmp/apk-nucleo-ligero.log; } \
                   | tr '\n\r' '  ' | sed 's/%/%25/g' )
            echo "::error::compilar.sh (nucleo sin oído) salió con $st — $msg"
            exit $st
          fi
          cp apps/apk/build/CORT.apk "apk/CORT-IA-${APK_VERSION}-nucleo-ligero.apk"
          cp apps/apk/build/firma.txt "apk/CORT-IA-${APK_VERSION}-nucleo-ligero-firma.txt"
          echo "peso nucleo-ligero: $(stat -c '%s' "apk/CORT-IA-${APK_VERSION}-nucleo-ligero.apk") B"
          grep -E 'perfil |variedad|manifiesto binario|perfil declarado' /tmp/apk-nucleo-ligero.log | head -5
      - name: Subir el APK (el que sale en la Release)
        uses: actions/upload-artifact@v4
        with:
          # Se llama `instalador-android` para que lo recoja el mismo
          # `pattern: instalador-*` de abajo y aparezca en la Release con enlace
          # de descarga directo. Desde la 2.5.0 esto sube SEIS archivos: los tres
          # envases (completo, nucleo y nucleo-ligero) con su `-firma.txt` cada uno.
          # `if-no-files-found: error`: una Release sin instaladores no sirve para
          # nada y debe gritar.
          name: instalador-android
          path: apk/*
          if-no-files-found: error

  release:
    needs: [build, apk]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
          merge-multiple: true
          # `instalador-*` recoge los tres instaladores de escritorio y **los APK del
          # teléfono**. No son «las dos versiones que había que elegir» de la ronda
          # 2.0 (el cuerpo Kotlin fuera: `apps/apk/rempaquetar.sh` está borrado del
          # repo y no hay paso que lo corra). Son el MISMO CORT dos veces: completo y
          # ligero, con el mismo `versionCode` y la misma llave, para poder bisecar el
          # bloqueo de Play Protect. La guía de cuál instalar está en
          # `docs/INSTALAR-APK.md`.
          pattern: instalador-*
      - uses: softprops/action-gh-release@v2
        with:
          files: artefactos/*
          body: |
            Instaladores generados por CI: Windows (.exe), Linux (.AppImage y
            .deb) y el APK del teléfono, que sube a la **2.10.1**. Esta Release trae
            **tres APK de Android a propósito**. No son versiones distintas de CORT:
            es el mismo cuerpo —mismas fuentes, mismo dex, misma cara, misma llave y
            mismo `versionCode`— con dos mandos distintos, para poder medir en el
            teléfono de la dueña qué es lo que está bloqueando Play Protect (párrafo
            «Por qué hay tres envases»).
            `CORT-IA-2.10.1.apk` es el de siempre: los ~47 MB de antes, todo dentro.
            `CORT-IA-2.10.1-nucleo.apk` es **el envase recomendado**: el mismo CORT
            sin la superficie privilegiada del manifiesto —cero servicios `BIND_*`,
            cero `ACTION_ASSIST`/`ACTION_VOICE_COMMAND`, sin `CALL_PHONE` ni
            `READ_CONTACTS` ni `READ_CALENDAR`— y con el oído dentro. CORT sigue
            abriéndose con su icono, con los atajos y con el micrófono en pantalla; lo
            que no hace es presentarse como asistente del sistema, leer tus
            notificaciones, poner baldosín en la cortina rápida ni marcar por el
            auricular. **Empieza por éste**: es el que tiene que instalarse sin el
            aviso.
            `CORT-IA-2.10.1-nucleo-ligero.apk` es ese mismo núcleo quitando además el
            bulto del oído (las cuatro `.so` de Vosk/JNA y los 39,8 MB del modelo):
            alrededor de **1,6 MB**, y en **Equipo · 7 · Oído** lo dice con la palabra
            `sin-modelo`. El peso exacto de cada archivo, medido dentro del APK final,
            está en su `-firma.txt` de al lado, y en esa hoja va también el renglón
            `perfil:` con los permisos y los servicios `BIND_*` leídos del
            `AndroidManifest.xml` **binario** del archivo.
            **Qué cambia en la 2.9.0 (la descarga de modelos del teléfono):** en
            **Equipo · Cerebros de casa** la barra ahora suma las capas del modelo en vez
            de quedarse con lo que dice la última línea que llegó —ese era el «no descarga
            los modelos»: la barra temblaba y parecía clavada—, se ve cuántas capas lleva
            el modelo, y la hoja pinta la dirección del PC con el que está hablando. Antes
            de lanzar una bajada CORT hace una pregunta corta (`/api/version`): si el
            portátil está apagado o dormido, lo dice en unos 3 segundos con la frase que
            nombra `OLLAMA_HOST=0.0.0.0:11434`, en vez de quedarse noventa segundos
            esperando un timeout mudo. Y hay botón nuevo **✕ cancelar** (también por voz:
            «cancela la bajada»), que suelta la conexión abierta del teléfono; al cancelar
            no salta aviso, porque eso lo pediste tú. Si ya está bajando un modelo, la
            segunda orden se rechaza diciendo cuál va. Sin permisos nuevos y sin métodos
            nuevos en el puente: la cancelación entra por la acción que ya existía, así
            que el manifiesto del `nucleo` —el que se instala limpio— no se ha tocado.
            **Todavía no lo has visto en tu teléfono**: son cambios medidos en el portátil,
            contra un Ollama de mentira (58 comprobaciones) y en las costuras entre Java,
            el contrato y la cara (8 más). Lo que se comprueba al instalar esta Release es
            que la barra suba de verdad, que un PC apagado responda en español en pocos
            segundos y que el botón ✕ pare la bajada.
            **Qué arregla la 2.10.1 (el 2.10.0 salió con la cara muerta):** el 2.10.0
            se instalaba, pero no cargaba el orbe, no respondían los botones y la voz no
            arrancaba. La causa era una sola línea: `ui/js/hud.js` importa
            `handleTelefonoEvento` de `telefono.js`, y esa función se había declarado
            sin `export`. El navegador rechaza **toda** la gráfica de módulos antes de
            ejecutar nada, así que no se montaba ni el orbe ni la interfaz. Ahora lleva
            `export`, y una comprobación nueva (costura 33) resuelve cada `import` de la
            cara contra el archivo de destino: un nombre que no exista pone la costura
            en rojo antes de compilar. Además la cara importa con `await import()` y, si
            un módulo o WebGL falla, enseña el error en una franja abajo en vez de
            quedarse muda.
            **El botón «CORT · PC» ya no existe:** estaba atravesado sobre la píldora y
            CORT intentaba abrir el PC solo al arrancar. Ahora arranca **siempre local**;
            el botón está oculto y su sitio es **Equipo · 9 · PC o VPS**, una guía para
            escribir `http://IP:8000` en la misma Wi‑Fi o una dirección `https://` de un
            VPS 24/7. Volver al teléfono manda la dirección vacía, y el menú nativo de
            dieciséis filas se abre desde ahí. Sin permisos nuevos.
            **Medido en el portátil para esta Release:** costura **303 `ok`** (sector
            [33]), la sonda de la cara **178 comprobaciones, 0 en rojo** (incluye el
            bloque 9 y la dirección que viaja a `setPc`), mandos **63/63**,
            automatizaciones **45/45**, `prueba-colores.mjs` **28/28**, oído **6/6** y
            talleres F16 **18/18** y F17 **19/19**. Sigue sin poder medirse aquí lo que
            sólo tu teléfono ve: que el orbe y el agua se pinten, que el dedo arrastre
            la burbuja y que la voz suene.
            **Qué cambia en la 2.10.0 (el lote F12 + F14 + F15 + F16 + F17, cerrado
            entero):** es una Release de varias fases a propósito, para no compilar cinco
            veces el mismo cuerpo ni publicar cinco `versionCode` iguales.
            **F12 · la voz responde:** con música sonando CORT ya no cierra el micrófono:
            pide el foco con `AUDIOFOCUS_GAIN_TRANSIENT_MAY_DUCK`, baja la música un
            momento, escucha y la devuelve; la puntuación del reconocedor («Pausa.») deja
            de romper los mandos; «pausa / siguiente / anterior» se mandan al sistema con
            `dispatchMediaKeyEvent` aunque la música la ponga otra app; y una prueba nueva
            recorre cada botón de la cara contra su método del puente para que no quede
            ninguno mudo.
            **F14 · una sola lista:** el diccionario de datos (~91 intenciones y 736
            frases) del que salen la cara, Java y las pruebas; la escalera
            local → casa → nube; cuentas con `x`, regla de tres, hora y porcentaje.
            **F15 · música por nombre:** «pon After Dark», «qué playlists hay», «cámbialo a
            tal canción» y el ecualizador real del aparato, con la canción elegida en el
            puente y en el despertador por la misma función.
            **F16 · el despertador es de CORT:** «despiértame a las 7:30 con After Dark
            para el examen» se parte en hora + canción + nota + rutina; la alarma usa
            `AlarmManager` y una notificación de categoría ALARMA en canal alto, con
            pantalla propia en la cara. **No** se declara `SCHEDULE_EXACT_ALARM`: si
            Android 12+ no da el minuto exacto, la respuesta lo dice con `exacta:false`.
            Tampoco hay `BOOT_COMPLETED`: la alarma no sobrevive a apagar el teléfono, y se
            dice.
            **F17 · la cara vestida:** el orbe deriva sus **dieciséis** colores de
            `--primario`/`--secundario`, así que cambiar de atuendo lo cambia entero (antes
            tenía veinte colores fijos y se quedaba azul); la burbuja recupera la 1.1.4 que
            te gustó (azul translúcida, se arrastra y se pega al borde, opacidad de reposo,
            toque que sigue abriendo CORT); y el agua y el vidrio se apagan con
            `html.freno` cuando hay poca RAM o modo juego. Sin permisos nuevos, firma
            `burbuja(Context, boolean)` intacta y los **44 dp** de siempre.
            **Medido en el portátil, no en tu teléfono:** costura **303 `ok`** (sectores
            [32] y [33] nuevos), la sonda de la cara **178/178**, las **7 suites** Java
            en verde sobre **336 frases de tabla**,
            `prueba-colores.mjs` **28/28** (16 canales × 6 trajes, sin GPU), mandos
            **63/63**, automatizaciones **45/45** y talleres de mutación de F16 (**18/18**)
            y F17 (**19/19**). Lo que sólo puedes ver tú: que el orbe y el agua se vean
            como esperas, que la burbuja se deje arrastrar con el dedo, que la alarma
            despierte con la canción, y que los presets del ecualizador existan en tu
            Samsung. El pipeline compila `Flotante.java` por primera vez en esta Release:
            aquí no hay `android.jar`.
            **Se instala encima del 2.0.0, del 2.1.0, del 2.2.0, del 2.3.0, del
            2.3.1, del 2.4.0, del 2.4.1, del 2.4.2, del 2.5.0, del 2.6.0, del 2.7.0, del
            2.8.0 y del 2.9.0 sin desinstalar y
            sin perder nada** (misma llave `fa:ab:ef:46:8f:3a…` en los tres archivos; el
            `versionCode` lo deriva `apps/apk/compilar.sh` de la versión con
            `MA*10000 + MI*100 + PA`, así que siempre sale mayor que el del envase
            anterior, y los tres APK de esta Release lo comparten: se puede pasar de uno
            a otro instalando encima):
            mira la huella del `-firma.txt` de las dos Releases y compárala antes de
            instalar. **Si vienes de un 1.x**, el primer intento dará error —es la
            llave distinta, medida en `docs/INSTALAR-APK.md`—: desinstala una vez,
            instala este, y de aquí en adelante todas las actualizaciones entran
            encima.

            **La cara nueva (ronda F9): cada apartado es su propia app.** `ui/` viaja
            dentro del APK desde la 2.6.0, así que lo que se montó entonces sigue
            aquí: el orbe queda con **un solo botón** (☰),
            que abre un **cajón** con las hojas, las once ventanas de vidrio de siempre y
            los ajustes; **Música** es calco de Lark Player (barra con buscar/orden/más,
            cuatro chips, mini fijo abajo que sube a pantalla completa); y **Charla** es
            calco de Gemini/Qoder (el **nombre del modelo** con su ▾ y su cambio
            `models/use`, **seis modos**, el `+` que **adjunta el texto de un archivo**
            leyéndolo por `GET /api/lee` con el candado de raíces de siempre, y la
            píldora de escritura redonda). Cada hoja lleva su propio color y su propio
            fondo (`ui/css/apps.css`). Nada de esto toca el manifiesto, la llave de
            firma ni el `versionCode` del envase anterior: el perfil que ya tienes
            instalado sigue siendo válido.

            **La ronda F10: los cinco fallos que ella trajo, arreglados de frente.**
            (1) El **modo juego** se quedaba clavado y era la causa del micrófono mudo y
            de la música en silencio —el `Reproductor` pedía el foco, lo rechazaba y no
            decía nada—; ahora el negativo tiene nombre en las cuatro capas (Java,
            `voice.js`, `hud.js` y el cartel, que es un **botón** que se toca para salir)
            y poner música desde la cara manda salir del modo. (2) **Las carátulas**: no
            existía una sola línea que pidiera una portada; `musicaCaratula` la saca del
            índice con `loadThumbnail` y la manda en `base64`, porque el `WebView` tiene
            `setAllowFileAccess(false)` y un `file://` nunca cargaría; cada fila pinta su
            foto y, si el teléfono no la tiene, su glifo —nunca un hueco—. (3) **La
            pestaña Vídeos** salía medio vacía porque el tope de 400 era compartido con
            las canciones: ahora cada una tiene el suyo y va en rejilla. (4) **El
            buscador** fallaba con acentos y la ñ porque el `LIKE` de SQLite sólo ignora
            mayúsculas ASCII; Java pliega las palabras antes de comparar. Y (5) **MV** ya
            no es otra app: es la letra fusionada dentro del reproductor (se llega por la
            ❝ de la fila), y el orbe ya no se despierta encima del vídeo. Añadido: el
            botón nativo «CORT · PC» se oculta en las hojas donde tapaba la píldora, el
            `⋮` del reproductor trae Velocidad / Dormir / Ocultar / Compartir, y **Charla
            piensa en el teléfono** cuando el portátil no está (cae al puente `mente` y
            la respuesta vuelve por el evento, en vez de dejar la frase de error).

            **La ronda F11: el catálogo medido, el copiloto de verdad y el aviso de la
            bajada.** (1) El catálogo de modelos del teléfono son **107 modelos con el
            peso medido** en el registro de Ollama (`scripts/mede-catalogo.py`), no
            inventado: los 14 que ofrece la hoja de modelos del PC son un subconjunto de
            esos 107 y salen de los mismos bytes, así que «cabe en tu portátil» se decide
            con un número que existe. (2) La pantalla **Código** tiene modo **copiloto**:
            escribes lo que quieres averiguar y CORT te lo devuelve como **plan de pasos**,
            cada uno con su ▶. El plan lo arma `backend/app/copiloto.py`, que **sólo
            ejecuta comandos de sólo lectura** —una lista escrita a mano de verbos, con
            sus subórdenes y sus banderas prohibidas—, y la puerta se comprueba **dos
            veces**: al planear y otra vez al ejecutar, así que un plan falso que se
            declare `seguro: True` con un `rm` dentro sigue sin correrse. No hay `shell`,
            la salida se corta en 8000 caracteres y cada plan caduca a los 900 s. Lo que
            ella quiera añadir se escribe en `~/.cort/copiloto.json`, que **no puede abrir
            lo que está en la lista de nunca**: un `permito: ["rm"]` se ignora. La cara
            pinta ▶ sólo en los pasos que el backend marcó como seguros; los demás salen
            con su motivo y su botón de copiar, y poner `> ` delante de la línea salta el
            modo y manda la orden como siempre. (3) **La bajada avisa sola**: cuando el
            modelo termina —o cuando se corta— se pone una notificación con su propio
            canal, y la hoja ya no pide la pantalla encendida: se puede cerrar y bloquear
            el teléfono. El aviso vive en su propio fichero, `Timbre.java`, y no dentro de
            `Ollama.java`, porque `Ollama` se compila y se prueba **en el portátil con el
            JDK** (ahí un `NotificationManager` de verdad no existe): `Prueba4` llama a la
            descarga contra un Ollama de mentira y cuenta los avisos que se habrían puesto
            —3 de sus 39 comprobaciones son justo ésa, y se ponen rojas si el aviso deja
            de llamarse—. Es una notificación normal —cero `foregroundServiceType`, cero
            permisos nuevos en el manifiesto, que es lo que mira Play Protect—; lo que no
            promete es llegar si Android mata la app por memoria, y lo dice.
            (4) Todo eso está comprobado **sin encender el teléfono**:
            `scripts/prueba-costura.py` trae los sectores [23] y [24], donde el módulo del
            copiloto se importa y se le preguntan 20 comandos de escritura negados y 14 de
            lectura autorizados, y una batería de 21 mutaciones (13 de la cara y el
            copiloto, 8 del aviso y su gemelo de papel) —corrida en el taller sobre un
            árbol de enlaces duros, no en este pipeline— comprueba que cada comprobación
            nueva se ponga **roja** si se rompe lo que dice mirar: un verde que no puede
            caer no es prueba, y aquí todas caen. Dos de esas 21 enseñaron
            algo que no se veía de frente —una comprobación que lee prosa se pone roja
            leyéndose a sí misma: hay que mirar el CÓDIGO, no los comentarios, ni el párrafo
            que explica el reparto—.

            **Los cerebros de casa: Ollama por Wi-Fi desde el teléfono**
            (`docs/CEREBROS-DE-CASA.md`). `Ollama.java` habla con el Ollama de tu PC
            y desde la hoja **Equipo · 3 · Cerebro** se puede **buscar** el PC en la
            Wi-Fi, ver **qué modelos hay**, **descargar** uno con su barra de progreso,
            **borrarlo** y **elegirlo** para pensar. Al elegirlo, CORT pasa a contestar
            con `de:"casa"`: sin clave y sin internet, usando el ordenador de casa.
            Ollama **no cabe dentro del APK** —es un servidor en Go que pide Linux—, así
            que lo que viaja dentro es su cliente; la única tarea manual es arrancar el
            servidor con `OLLAMA_HOST=0.0.0.0:11434` para que conteste a la red. **Cero
            permisos nuevos**: el barrido de la red propia sale de `NetworkInterface`, no
            de `WifiInfo`. Probado contra un Ollama de mentira levantado dentro del JDK
            (`apps/apk/prueba/Prueba4.java`, 36 comprobaciones) antes de firmar.

            **La terminal, ampliada en el teléfono** (pantalla **Código**). Antes en el
            teléfono la consola no hacía nada porque no hay núcleo que consultar. Ahora
            las órdenes se atienden **en el aparato**: volumen, linterna, alarmas, apps,
            memoria, cerebro y los modelos de casa, con `estado` para leer lo que mide
            el teléfono y `ayuda` para ver la lista de lo que se atiende sin portátil.
            Lo que CORT contesta se escribe en la propia consola (la respuesta del
            cerebro llega por el evento `mente`, sin bloquear el hilo del puente; en el
            PC la terminal sigue mandando la línea a `/api/command` como siempre).

            **Automatizaciones como las de JARVIS** (`docs/AUTOMATIZAR-CORT.md`, hoja
            **Equipo · 8 · Automatiza**). Reglas suyas, de dos mitades: «cuando
            ⟨pasa una cosa⟩ → haz ⟨otra⟩». Los cinco disparadores son señales que ya
            existían o que esta ronda añade sin permiso nuevo: su **frase**, el **aviso**
            que recién llega (Java manda el evento `{type:"aviso"}` desde `.Avisos`), el
            **auricular**, la **batería** y la **hora**. Las ocho acciones usan las manos
            de siempre: hablar, volumen, linterna, abrir una app, la música, pensar,
            apuntar un recuerdo y poner una alarma. Se crean **hablando** («automatiza
            cuando diga modo noche haz callar la música») o con los botones, vienen tres
            de muestra, cada regla tiene su `▶ probar ahora`, y se guardan en las
            preferencias del WebView. Se cumplen **mientras CORT está en pantalla** —la
            cara es una página y una página cerrada no escucha—; lo que sigue funcionando
            con la pantalla apagada es lo que hace Java solo (leer avisos, el
            reproductor, el oído del auricular). El motor es puro y se prueba con node
            sin teléfono (`scripts/prueba-automatiza.mjs`, 45 comprobaciones).

            **Cómo se abre CORT — asistente, auricular, cortina y atajos**
            (`docs/ABRIR-CORT.md`). Hasta el 2.4.0 la cara se declaraba sólo con su
            icono del cajón, así que el gesto del asistente y el botón del audífono no
            tenían a dónde venir. Ahora hay cinco puertas y **cero permisos nuevos**:
            la actividad responde a `ACTION_ASSIST` (el gesto: mantener el botón de
            inicio o deslizar desde la esquina, con CORT elegido como aplicación de
            asistencia) y a `ACTION_VOICE_COMMAND` (mantener el botón del auricular);
            `.Panel` añade el baldosín **`CORT escucha`** a la cortina rápida, que
            funciona aunque tu fabricante no deje cambiar el asistente; y
            `res/xml/atajos.xml` pone **Escucha / Equipo / Charla** al mantener pulsado
            el icono. Y el **doble toque del auricular funciona con la cara cerrada**:
            la sesión de `.Reproductor` tenía `onPlay`/`onPause` pero no leía la tecla,
            así que sólo CORT sonando, el segundo toque dentro de 500 ms pausa la
            canción (el micrófono no puede oír con la música encima), abre la cara y
            pinta la insignia de «te escucho». El primer toque sigue siendo de la
            música, y en modo juego el doble toque no es de CORT. La voz de CORT ya
            salía por el auricular: el `TextToSpeech` va por el stream de multimedia
            (medido en `musicPlaying()`).

            **¿Play Protect te lo bloquea? Lea `docs/BLOQUEO-PLAY-PROTECT.md` antes
            de tirar el APK.** Es la ronda de que se pueda instalar: este `.apk`
            sale firmado con los **tres esquemas a la vez** (v1 en `META-INF/`, v2 y
            v3 en el bloque de firma, pedidos con bandera explícita en vez de dejarlos
            al default que `apksigner` elige según el `minSdk`), y cada Release publica
            en su `-firma.txt` una **auditoría medida sobre el archivo final**: sha256,
            peso exacto, qué esquemas están, la ventana de validez del certificado,
            `resources.arsc` sin comprimir y alineado, `minSdk`/`targetSdk` y que no
            esté marcado como depurable. Si el sha256 del archivo de tu teléfono es el
            de esa hoja, el APK está entero y bien firmado, y lo que falla es el aviso
            de Google a cualquier app con certificado auto-firmada y fuera de Play:
            ahí está, renglón por renglón, qué pulsar según la frase exacta que sale
            en pantalla (incluido el reloj del teléfono: el certificado de CORT empieza
            a ser válido el **2026-10-21 11:19 GMT**, así que un móvil con la hora
            atrasada lo ve «aún no válido» y eso se parece muchísimo a un bloqueo).

            **Por qué hay tres envases en esta Release.** Porque las dos explicaciones
            cómodas **se cayeron con medidas**. La primera («Play Protect bloquea todo
            lo auto-firmado»): el `CORT-IA-1.1.4.apk` también es auto-firmado, también
            salió de este pipeline, y a la dueña se le instala bien. La segunda («es el
            bulto nativo del oído»): la ronda 2.4.2 publicó el mismo APK con y sin los
            45,7 MB de `.so` y modelo, ella probó **los dos** el 2026-10-22 y
            «los dos fallan, Play Protect sigue bloqueando». El peso es inocente, y con
            él se cayó también lo que decía esta hoja la ronda pasada.

            Lo que quedó en pie es lo que se midió leyendo el `AndroidManifest.xml`
            **binario** de los tres APK que hay en el mismo disco —la charca de cadenas
            UTF-16, con el mismo método que ahora corre en cada Release dentro de
            `scripts/audita-apk.sh`—:

            ```
            CORT-IA-1.1.0 (ella, se instala)   13 permisos · 0 servicios BIND_*
            CORT-IA-1.1.4 (mío, se instala)    13 permisos · 0 servicios BIND_*
            CORT-IA-2.4.2 (bloqueado)          28 permisos · 4 BIND_* en 5 servicios
            ```

            Las cuatro Gordas que se señalaban (`MANAGE_EXTERNAL_STORAGE`,
            `SYSTEM_ALERT_WINDOW`, `REQUEST_IGNORE_BATTERY_OPTIMIZATIONS`,
            `READ_EXTERNAL_STORAGE`) están en **los tres** archivos: no eran ellas. Lo
            que el 2.x declara y el 1.1.4 no son los cinco servicios privilegiados —
            `VoiceInteractionService`, su `VoiceInteractionSessionService`, el
            `RecognitionService`, el `NotificationListenerService` y el `TileService`—,
            las acciones `ACTION_ASSIST`/`ACTION_VOICE_COMMAND` y el trío
            `CALL_PHONE` + `READ_CONTACTS` + `READ_CALENDAR`. Un clasificador automático
            sin contexto describe con ese mismo paquete un troyano de accesibilidad: no
            significa que CORT lo sea, significa que un escáner no tiene forma de
            saberlo.

            Esa prueba **ya está hecha y ganada**: la dueña instaló el
            `CORT-IA-2.5.0-nucleo.apk` en su teléfono el 2026-10-22 y funcionó. Cero
            `BIND_*` entra; cuatro `BIND_*` se bloquea. Por eso el `nucleo` es desde
            aquí el envase recomendado y éste sigue siendo el archivo que hay que
            instalar primero: `CORT-IA-2.10.1-nucleo.apk`. Si alguna vez se volviera a
            bloquear, el siguiente paso sigue escrito en
            `docs/BLOQUEO-PLAY-PROTECT.md` —probar el `‑ligero` (1,6 MB) y, si ése
            entra, sacar el modelo de 39,8 MB del APK—, y si ninguno de los tres
            entrara, dentro del archivo ya no queda nada que tocar: quedan `adb
            install -r` por USB o listar la app en Play, y las dos vías están ahí
            escritas.

            Los tres archivos están firmados con la misma llave `fa:ab:ef:46:8f:3a…` y
            el mismo `versionCode` 20600, así que se puede pasar del uno al otro
            **instalando encima**, sin desinstalar y sin perder el perfil, las claves ni
            los gustos. Lo que sí se pierde al pasar al núcleo, porque el permiso deja
            de estar declarado: el role de asistente, el interruptor de notificaciones,
            el baldosín de la cortina y los contactos leídos.

            **Un APK, el de Java, con el logo de siempre.** `apps/apk/compilar.sh`
            saca el icono del `base/CORT-IA-1.1.0.apk` (sus cinco densidades y el
            adaptativo, fondo `#02040A` medido en la propia imagen), no lo dibuja
            ni lo cambia. El paquete sigue siendo `com.cort.ia`, así que
            actualizar es instalar encima **si la firma coincide** (lea el párrafo
            de la llave más abajo).

            **Asistente de verdad.** `res/xml/asistente.xml` ya no declara una
            `settingsActivity` —Android descartaba en silencio al asistente cuyos
            ajustes no fueran de una app del sistema, y una APK instalada a mano
            nunca lo es—, y el botón «Poner CORT como asistente» pide el **rol**
            oficial con `RoleManager` (Android 10+), que es el cuadro que de verdad
            te pone en la lista. Se dice por voz: `pon CORT como asistente`. Con
            CORT elegido, el **gesto de asistente** llega a la cara —desde el 2.4.1,
            que declara `ACTION_ASSIST` y `ACTION_VOICE_COMMAND`, que antes no había
            y por eso el gesto se lo quedaba Google aunque CORT estuviera marcado—,
            y con él el botón del auricular mantenido y `lee mis avisos`.

            **Su propio reproductor.** `.Reproductor` es un servicio en primer
            plano con su notificación (play/pausa, siguiente) y su `MediaSession`,
            así que la música y el video **siguen sonando con la cara cerrada o la
            pantalla apagada** y el auricular obedece. CORT lee tu índice de audio
            y video (`MediaStore`), reproduce por URI, salta a cualquier segundo,
            va **cuadro a cuadro** en video (±1/30 s) y arma la cola sola por
            gustos: «me gustan estas» sube artista y género, «quítalas» los baja,
            y la próxima vez que pidas música sale mejor ordenada. Las playlists se
            guardan con nombre y se vuelven a poner. Todo eso vive en claro, en las
            preferencias de la app: se puede leer y borrar sin misterios.

            **Cinco pantallas que no tocan el orbe.** Además de la cara de siempre
            hay hojas a pantalla completa, y se cambia entre ellas con el menú de
            **tres líneas (☰)**, deslizando el dedo de lado, con `Alt+←/→` o
            diciéndolo: «abre el chat», «pantalla de código», «abre el mv», «abre el
            equipo», «vuelve al orbe». **Charla** es un chat como los de siempre —burbujas, copiar la
            respuesta, guardarla en 04 · Notas— con los modelos que tengas bajados,
            elegibles desde la propia pantalla (y diciéndote, en el teléfono, que
            los modelos viven y corren en tu portátil: allí se bajan, allí se usan).
            **Código** es la terminal y el cuaderno: lo que escribes ahí se ejecuta
            **en tu PC** (Android no deja abrir un shell desde una app normal, y no
            se finge lo contrario), y el cuaderno guarda lo que escribiste aunque
            cierres la app. **Música** manda al reproductor de arriba. Cuando no es
            la pantalla del orbe, el holograma **deja de dibujarse** (`orb.pausa()`):
            en un teléfono modesto eso es RAM, GPU y batería, y así ninguna
            interfaz nueva tapa la otra.

            **MV: el video con su letra, y el orbe hecho disco.** La hoja **MV** es
            la que estaba pedida separada del reproductor: pone la imagen del
            videoclip (`<video>` sobre la misma `content://` que reproduce CORT, con
            `setAllowContentAccess`) y debajo la **letra sincronizada**, línea a
            línea, con la línea activa marcada y **clic para saltar a ese segundo**.
            La letra viene de LRCLIB (sin clave, cacheada 40 canciones, y si el
            servidor está saturado te lo dice y la rebuscas con un botón). El
            holograma no se va de esta hoja: se **encoge a una esquina girando como
            un disco**, así que la esfera sigue siendo tuya mientras ves el video.
            En audio suelto la hoja no se queda en negro: lo dice y te deja la letra.
            El avance **cuadro a cuadro** (◂ ▸, ±1/30 s) funciona aquí también.

            **Modo juego: CORT se aparte mientras juegas.** Pedida tal cual: el
            Call of Duty se cerraba y la música desaparecía cuando el asistente le
            robaba el micro. Con el modo juego puesto —por voz (**«modo juego»** y
            **«vuelve CORT»**), desde el interruptor de las hojas Música/MV o desde
            el botón `CORT · PC`— CORT **cierra el micrófono**, no pide el foco
            audio al reproducir, y deja de susurrar por el auricular; el aviso de
            que está callado se ve en la barra superior (🎮). Al quitarlo, todo
            vuelve a su sitio. **No** hace falta darle ningún permiso de uso de
            aplicaciones ni de lista de programas instalados: es un interruptor, no
            un espía, y así queda firmado en el manifiesto.

            **La hoja Equipo: CORT manda sobre el aparato, y se ve dónde.** Es la
            hoja nueva (`☰ ▸ Equipo`, o «abre el equipo») y trae **seis bloques**:
            **Voz** (voces instaladas y preajustes: «voz de siri», «cambia la voz»),
            **Mando** (volumen, linterna, alarmas, temporizador, abrir apps: «sube el
            volumen», «pon una alarma a las 7:30», «enciende la linterna»), **Cerebro**
            (con quién piensa cuando no está el PC), **Memoria** (lo que CORT guarda en
            el teléfono y su sincronía con el portátil), **Atuendos** (los seis trajes
            de color y la burbuja: «ponte azul», «atuendo Cortana», «burbuja») y
            **Agenda** (tus citas y los avisos de Gmail). Cada bloque avisa en su propio
            pie si lo que le falta es el APK nuevo, un permiso, o el PC: **no** finge
            haber hecho lo que no hizo. Son las ocho funciones del contrato del puente
            (`docs/CONTRATO-PUENTE-2.1.md`): `accion`, `ajusteVoz`, `memoria`, `mente`,
            `atuendo`, `agenda`, `burbuja` y `comparte`, comprobadas una por una en los
            cuatro sitios donde viven —su clase de Java, el puente, la cara y el
            manifiesto— por `scripts/prueba-costura.py`.

            **Tres interruptores nuevos, y se dicen.** Son los que hay que dar a mano
            la primera vez que se usan (ninguno se pide al abrir la app):
            **«Aparecer encima de otras apps»** para la **burbuja** (el puntito de CORT
            flotando: «burbuja»; al tocarlo abre la cara y escucha; en **modo juego
            nunca aparece**, y al poner el modo juego la que estuviera puesta se quita
            sola), **Cámara** para la **linterna** (va por `setTorchMode`: no enciende
            la cámara, no captura imagen, y sin el permiso CORT lo dice en vez de
            forzarte el cuadro), y **Calendario de sólo lectura** para «¿qué tengo
            hoy?». `WRITE_CALENDAR` **no está pedido a propósito**: «apunta la cena con
            Samuel a las 9» rellena el formulario del calendario del sistema y **el
            dedo que guarda eres tú**. Del correo no se lee el contenido —no hay API
            para el Gmail de otra app—: se cuentan los avisos que ya salieron en tu
            barra y se abre Gmail con un toque.

            **Piensa sin el portátil.** El bloque **Cerebro** y la orden **«piensa
            <pregunta>»** contestan con la cara abierta y sin Wi-Fi con el PC:
            `Mente.java` usa la nube que tú ajustaste desde la propia pantalla (Groq,
            OpenAI, DeepSeek, Mistral, Qwen, Anthropic u Ollama en red local), y la
            **clave no sale nunca del teléfono** —se guarda en el APK y sólo se lee por
            voz un `sí/no` de «puesta o no puesta»—. Si no hay nube, hablan las **33
            reglas y 283 frases** de `assets/habilidades.json`, y esas sí **ejecutan**
            la orden que reconocen (subir el volumen, abrir una app) en vez de quedarse
            en la promesa. **Memoria** guarda en SQLite del teléfono lo que aprende y
            **«sincroniza con el PC»** lo cuadra con `~/.cort` por la puerta
            `/api/memoria`; y el botón **📤 enviar** de las hojas Música/MV pasa un
            archivo tuyo a otra app (WhatsApp, correo, Drive) por el proveedor de
            archivos del propio APK, que es la única forma legal de enseñar un archivo
            en Android 8+.

            **El cerebro se ensanchó, y eso es lo que pide la dueña: «que haga de todo».**
            `Mente` piensa en tres escalones, del más barato al más caro: primero la
            tabla de frases (acción conocida), después **`Razon`** y sólo luego la nube.
            `Razon` es Java puro sin portátil ni red: sumas y productos, porcentajes
            («cuánto es el 15 % de 240»), conversiones (km↔mi, kg↔lb, °C↔°F), y fechas y
            horas reales del teléfono («qué día es hoy», «cuánto falta para el viernes»,
            «que horas son»). Las dos frases que antes respondían con una excusa —«no
            tengo barra de estado» a *qué hora es*— están **borradas de las dos tablas**,
            y `scripts/prueba-costura.py` falla si vuelven. La tabla pasó de 35 a **33
            reglas con 283 frases** y ya no se escribe a mano dos veces: sale de
            `scripts/habilidades.py`, que vierta el JSON del APK y el cuerpo de
            `Cerebro.tablaDelCodigo()` del mismo listado. Y se comprueba **en el
            portátil**, que hasta ahora era imposible: `scripts/prueba-mente.sh` pone
            gemelos de papel a las cinco clases de Android que atan esas cuatro clases,
            las compila con el JDK de a pie y pasa las tres suites (43 cuentas de
            `Razon`, 45 de la ruta de `Mente`, y las 283 frases una por una contra las
            DOS tablas para ver los robos por orden). El paso
            «Probar el cerebro en el JDK» va **delante** de compilar el APK: si la
            lógica se rompe, el run para, porque un APK que compila y contesta tonterías
            es peor que uno que no compila.

            **El teléfono enseña lo que tiene dentro.** La hoja **Equipo** ya no deja los
            huecos en `—` por decoración: `Aparato.java` lee batería (nivel, temperatura,
            tecnología y si está enchufado), RAM libre y ocupada, almacenamiento, red
            (wifi / celular / ethernet), CPU, brillo y resolución, y `Sentidos.java`
            engancha `SensorManager` y trae luz, proximidad, acelerómetro, giroscopio,
            brújula, presión, temperatura y humedad con su nombre real de fabricante.
            Cada clave que la cara pinta está cruzada con la que Java emite
            (`scripts/prueba-costura.py`, sector 10): 16 de la hoja Equipo y 6 de cada
            fila de sensores. Y el **«sale error al instalar» tiene por fin causa
            medida**: con `keytool -printcert -jarfile` sobre los APK publicados, el
            2.0.0 y el 2.1.0 salen con la huella `fa:ab:ef:46:8f:3a…` y el 1.1.4 con
            `eb:d6:25:04:41:bc…`. Cambiar de llave es, para Android, otra aplicación:
            `INSTALL_FAILED_UPDATE_INCOMPATIBLE`. Es un coste de **una sola vez** al
            saltar de 1.x a 2.x; desde el 2.0.0 la llave no se mueve.
            `scripts/instala-apk.sh` baja la Release, comprueba que el peso sea el
            anunciado, lee la firma y traduce el código de Android a español, y
            `docs/INSTALAR-APK.md` dice qué tres cosas hay que tocar en el teléfono y
            qué borra desinstalar.

            **Ordena tus archivos sin perder ni uno.** En **01 · Archivos** hay botón
            **⤢ ordena** y se dice por voz: «ordena mis archivos», «ordena mis
            documentos», «ordena la música». Lo primero que sale es un **plan**:
            cada archivo con su `de → a` y su motivo, el total, y **nada se mueve**
            hasta que digas **«confirmar»** (o **«cancelar»**, y no se toca nada). El
            plan caduca a los quince minutos y lleva un token, así que confirmar no
            puede mover una carpeta distinta de la que viste. `organiza.py` **no
            conoce ninguna primitiva de borrado**: reorganiza, y si el nombre ya
            está ocupado añade ` (2)` en vez de pisar nada. Probado aquí, en un
            `mktemp` con sus carpetas de mentirijillas: `scripts/prueba-organiza.py`.

            **Dile que se actualice solo.** `GET /api/update` compara lo instalado
            con la última Release de GitHub, y se pide por voz: **«revisa si hay
            actualizaciones»**, **«actualízate»**. CORT cuenta qué hay nuevo y qué
            pesa; si dices **«sí»**, el escritorio baja su instalador o —si pesa más
            de 100 MB, que es lo normal y congelaría un portátil pequeño dentro de
            una petición— deja los pasos listos y `scripts/actualiza.sh` hace la
            reparación **con copia de seguridad** de la instalación anterior en
            `~/Aplicaciones/CORT.anterior-<fecha>`, sin sudo y sin tocar nunca
            `~/.cort` (tus claves, notas y recuerdos). En el teléfono Android no
            deja que una app se reemplace a sí misma: ahí CORT te da el enlace del
            APK y lo instalas tú encima.

            **Y ya no traba el teléfono.** El micro de «Oye CORT» se cierra al pasar
            a segundo plano, al apagarse la pantalla, mientras suena música y
            mientras la ventana 11 cuenta caché; la escucha se rearma con respiros
            cada vez más largos si nadie la llama. El reproductor tampoco trabó: las
            consultas al índice corren en su propio hilo, nunca en el de la cara.

            **Te lo lee**: `lee mis avisos` en el teléfono —WhatsApp, Gmail,
            Telegram, Signal— desde la barra de notificaciones, con un oído que
            guarda doce líneas en RAM y nunca escribe disco; `lee mis notas`,
            `lee mis tareas` y `lee el documento <nombre>` en el PC. Las notas y las
            pendientes («tengo que …», y `listo 1` para marcarlas hechas) viven en el
            backend, así que en el teléfono hacen falta conectados por Wi-Fi con
            `bash scripts/telefono.sh`; sin PC la cara lo avisa en voz alta.

            **Llamadas y contactos, dicho sin adornos.** `llama a Samuel` busca en
            tus contactos y marca: con el permiso `CALL_PHONE` va directo, sin él se
            abre el marcador con el número puesto. Lo que **no** hace esta entrega:
            contestar por ti ni ser un buzón de voz —Android exige ser el «teléfono
            predeterminado» para eso, y a medias deja sin marcar llamadas normales—,
            y no hay API para leer los SMS de otro ni entrar en WhatsApp.

            **Ya no se pierde tu clave al actualizar.** `cort_config.json` (las
            claves de Groq/Gemini que se pegan en 07 · Perfil) y `cort_memory.db`
            (notas, pendientes y recuerdos) estaban guardados dentro de la carpeta
            del programa, que es justo la que sustituye un instalador nuevo. Ahora
            viven en tu carpeta personal — `~/.cort` en Linux/macOS,
            `%APPDATA%\CORT` en Windows, o donde diga `CORT_HOME` — y la primera
            arrancada copia ahí lo que hubiera antes. La ruta se ve en 07 · Perfil.

            **Analizar el equipo deja de ser un suplicio.** La ventana 11
            (Optimizar) contesta **al instante** con la RAM y los procesos: lo que
            tarda —contar la caché del disco— se mide en un hilo aparte y se va
            pintando cuando llega, en vez de dejar la pantalla congelada esperando.
            En 10 · Modelos, «descargar» ya no deja la interfaz colgada: pone el
            modelo **en cola**, arranca Ollama él solo, enseña el avance en MB y MB/s
            y tiene su `✕ cancelar`. Y el logo de los instaladores es ahora el
            **mismo anillo** que el de la app del teléfono
            (`bash scripts/icono-del-telefonito.sh`).

            **Actualizar el APK sin desinstalar: esta vez se instala encima.** La
            firma la decide `apps/apk/llave.sh` (secreto del repo ▸ caché del pipeline ▸
            generar una nueva). Estaba **medido**: sin secreto, la huella de cada
            Release era distinta porque `actions/cache` guarda la llave en el *ref* que
            la creó, y cada etiqueta es otro ref. Los dos secretos
            (`CORT_APK_KEYSTORE_B64` y `CORT_APK_KEYSTORE_PASS`) ya están puestos en
            Settings ▸ Secrets and variables ▸ Actions, y la Release anterior
            (`v0.2.13-demo`, con `CORT-IA-2.0.0-firma.txt`) **ya firmó con esa llave
            fija**. Así que el `2.2.0` se instala **encima** del `2.0.0` y del `2.1.0`:
            `versionCode` 20200 por encima de 20100, mismo paquete `com.cort.ia`, misma
            firma —y con ello se quedan el micrófono concedido, el doble toque, el
            permiso de los avisos, la dirección del PC y los gustos que CORT anotó en el
            teléfono—. El juez público sigue siendo el `-firma.txt`:
            `faabef468f3ae04fdfab9659d6a051c453d6ded7b965468c9c3b85caffa31977` tiene que
            aparecer en las dos Releases; si en la tuya no está, desinstala una vez y ya
            no volverá a tocar. La llave nunca se sube al repo: el repo es público y
            está en `.gitignore`.

            **Escucha sin internet: el oído propio.** `Oido.kt` (Kotlin, el método
            del original) mete dentro del APK el reconocedor de español de **Vosk
            0.3.47** con su modelo `vosk-model-small-es-0.42`: al abrir CORT se
            desempaca a `filesDir/motor/` (60.286.598 B en 14 archivos, medidos) y
            desde ahí entiende «CORT», «hola CORT» y las órdenes **sin red y sin los
            servicios de voz de Google** —el caso real de un teléfono de gama baja
            donde esos servicios no vienen, y el de datos apagados o sin cobertura.
            Funciona así: el puente intenta primero el oído propio y, si todavía está
            cargando o el modelo no cabe, cae solo al reconocedor de siempre, así que
            la cara nunca se queda muda por este cambio. `prueba-oido.sh` lo prueba
            EN PIPELINE con el motor de verdad (desempaque, silencio, señal, micrófono
            quitado a mitad, cancelación y falta de sitio: seis comprobaciones), antes
            de compilar. Se puede apagar en Ajustes, y el estado («extrayendo»,
            «cargando», «listo», «sin-sitio», «roto» y por qué) se lee en la pantalla
            Equipo. Cuesta espacio, y eso está dicho en voz alta: los `.so` de
            arm64-v8a y armeabi-v7a (8.862.928 B + 168.176 B + 8.279.808 B + 122.296 B)
            y el ZIP del modelo viajan dentro; a cambio CORT oye sin nube.

            **El tamaño, sin adornos y medido.** Se bajaron los dos APK y se contaron
            sus entradas. El `1.1.0` original: 1.815.389 B de archivo sobre
            4.538.254 B sin comprimir, 45 entradas. El `2.1.0` que se publicó en
            `v0.2.15-demo`: 978.056 B sobre 2.349.202 B, 42 entradas. La proporción es
            la misma —**0,40 frente a 0,42**, o sea que no estaba apretado de más— y la
            diferencia de peso está en el código que el original arrastraba: sus cuatro
            `classes*.dex` y los `kotlin/*.kotlin_builtins` suman 919.207 B comprimidos,
            frente a los 90.943 B de un `classes.dex` de Java puro (aquí no hay Kotlin ni
            AndroidX ni Gradle: `aapt2` + `javac` + `d8`, el método de siempre). Lo que la
            cara tiene dentro **no faltó ni falta**: los 11 archivos de `assets/ui/` del
            `1.1.0` están los once, más `habilidades.json`, `pantallas.js` y
            `telefono.js` —1.622.292 B de interfaz sin comprimir por los 1.408.297 B
            del original: 214 KB más de cara dentro de un archivo más pequeño—. Este
            `2.2.0` mete además las dos clases nuevas del entorno, `Aparato.java` y
            `Sentidos.java`, y su tabla de frases casi triplicada; el peso exacto que
            salió lo declara su propio `-firma.txt`, medido en Actions por `compilar.sh`
            y bajado por `scripts/instala-apk.sh`, no estimado aquí.

            Requisitos en escritorio: Python 3.10+ y Chrome/Edge.
            Requisitos del APK: Android 8 o más (el rol de asistente y el permiso de
            música, desde Android 10 y 13 respectivamente; en los antiguos CORT se
            elige a mano en Ajustes y la música pide el permiso viejo).
            Instrucciones completas, incluido el modo teléfono por Wi-Fi y el permiso
            de los avisos, en el README.
