name: Construir instaladores CORT

# Compila el holograma de escritorio para Windows y Linux SIN usar tu PC, y el
# APK del teléfono con el SDK que trae el runner:
# cada vez que creas una etiqueta v* (p. ej. git tag -a v0.2.0-demo && git push origin v0.2.0-demo)
# o desde Actions → "Construir instaladores CORT" → Run workflow.
# Los instaladores (.exe y .AppImage) aparecen como artefactos descargables
# en la página de la ejecución y en la Release si el push fue de una etiqueta.
#
# Si un paso falla, los registros de Actions NO son públicos: el trabajo
# vuelca las últimas líneas del error como anotación del check, que sí se
# puede leer desde la API pública.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false           # que Windows no se cancele si Linux falla
      matrix:
        include:
          - os: windows-latest   # instalador .exe (NSIS)
            script: dist:win
          - os: ubuntu-latest    # AppImage + .deb
            script: dist:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Instalar dependencias
        shell: bash
        run: |
          set -o pipefail
          npm install 2>&1 | tee /tmp/npm-install.log
      - name: Construir instalador (${{ matrix.os }})
        shell: bash
        run: |
          set -o pipefail
          npm run ${{ matrix.script }} 2>&1 | tee /tmp/build.log
      - name: Volcar el fallo como anotación (los logs no son públicos)
        if: failure()
        shell: bash
        run: |
          LOG=/tmp/build.log
          [ -s "$LOG" ] || LOG=/tmp/npm-install.log
          MSG=$(tail -c 3200 "$LOG" | tr '\n' ' ' | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/:/%3A/g')
          echo "::error title=Fallo en ${{ matrix.script }}::$MSG"
      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.os }}
          path: |
            desktop/out/*.exe
            desktop/out/*.AppImage
            desktop/out/*.deb
          if-no-files-found: error

  # El APK del teléfono se compila AQUÍ y nunca en el portátil de la dueña:
  # 1,8 GiB de RAM y sin `javac` (medido). El runner trae el SDK de Android y
  # `apps/apk/compilar.sh` usa `aapt2` + `javac` + `d8` + `zipalign` +
  # `apksigner`, sin Gradle ni AndroidX. La interfaz que viaja dentro del APK es
  # `ui/` de este mismo commit, copiada a `assets/ui/` por el propio script.
  apk:
    runs-on: ubuntu-latest
    env:
      APK_VERSION: "1.2.2"       # la versión del APK experimental de Java
      TELEFONO_VERSION: "1.1.3"  # el APK del teléfono: cuerpo 1.1.0 + cara actual
    steps:
      - uses: actions/checkout@v4
      # -- La misma llave de firma en todas las Releases ----------------------
      # Sin esto, cada run firmaba con una llave nueva, y para Android una firma
      # distinta es OTRA aplicación: actualizar == desinstalar, y al desinstalar
      # se van el permiso del micrófono, el de los avisos y la dirección del PC
      # escrita a mano. La caché guarda `apps/apk/keystore/` (keystore + su
      # contraseña) y la devuelve en el siguiente run. `apps/apk/llave.sh` prefiere
      # el secreto `CORT_APK_KEYSTORE_B64` si algún día existe: la caché es la vía
      # que no le pide a la dueña configurar nada.
      # Comprobación pública de que funciona: la huella SHA-256 del certificado
      # sale en el `-firma.txt` de cada APK y como anotación del check-run. Si dos
      # Releases seguidas tienen la misma huella, la llave se mantuvo.
      - name: Cachear la llave de firma
        uses: actions/cache@v4
        with:
          path: apps/apk/keystore
          key: cort-apk-keystore-v1
          restore-keys: cort-apk-keystore-v1
      - name: Compilar el APK de Java (aapt2 + javac + d8, sin Gradle)
        id: java
        # Este APK es el **experimental**: el holograma embebido con asistente del
        # sistema, doble toque de auriculares y lectura de avisos. Sale en la
        # Release (paso `instalador-asistente`), pero con `continue-on-error`: si
        # un día se rompe el Java, la dueña sigue recibiendo la actualización de su
        # APK de siempre, que es la otra pata del trabajo.
        continue-on-error: true
        shell: bash
        env:
          # La llave de firma: secreto del repo si existe; si no, la caché de
          # arriba (`apps/apk/keystore`). `apps/apk/llave.sh` decide en ese orden y
          # `firma.txt` cuenta cuál se usó, que es lo que ella puede leer sin
          # sesión de GitHub.
          CORT_APK_KEYSTORE_B64: ${{ secrets.CORT_APK_KEYSTORE_B64 }}
          CORT_APK_KEYSTORE_PASS: ${{ secrets.CORT_APK_KEYSTORE_PASS }}
        run: |
          # `set +e` es obligatorio: el shell de GitHub se comporta como `bash -e`
          # y mataría el paso antes de `st=$?` y antes de la anotación, dejando un
          # fallo mudo que no se puede leer desde fuera.
          set +e
          chmod +x apps/apk/compilar.sh
          bash -x apps/apk/compilar.sh "$APK_VERSION" > /tmp/apk.log 2>&1
          st=$?
          cat /tmp/apk.log
          if [ $st -ne 0 ]; then
            # Los registros de Actions NO se pueden descargar sin sesión (la API de
            # logs responde 403), pero los annotations del check-run sí se leen por
            # la API pública. `javac` imprime el error en una línea y el detalle
            # (`symbol:` / `location:` / `required:`) en las siguientes: sin ellas
            # hay que adivinar qué método no existe, y eso cuesta una compilación.
            errores="$(grep -E -A 3 '\.java:[0-9]+: error:' /tmp/apk.log \
                       | grep -E '\.java:[0-9]+: error:|symbol:|location:|required:|found:|reason:' \
                       | head -40)"
            msg=$( { echo "-- errores --"; echo "${errores:-ninguno}"; \
                     echo "-- final del log --"; tail -c 900 /tmp/apk.log; } \
                   | tr '\n\r' '  ' | sed 's/%/%25/g' )
            echo "::error::compilar.sh salió con $st — $msg"
            exit $st
          fi
      - name: Bautizar el APK experimental de Java
        if: steps.java.conclusion == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk-java
          cp apps/apk/build/CORT.apk "apk-java/CORT-IA-${APK_VERSION}-asistente.apk"
          cp apps/apk/build/firma.txt "apk-java/CORT-IA-${APK_VERSION}-asistente-firma.txt"
      - name: Rempaquetar el APK del teléfono (cuerpo original + cara actual)
        id: telefono
        shell: bash
        env:
          CORT_APK_KEYSTORE_B64: ${{ secrets.CORT_APK_KEYSTORE_B64 }}
          CORT_APK_KEYSTORE_PASS: ${{ secrets.CORT_APK_KEYSTORE_PASS }}
        run: |
          # `set +e` otra vez: si el paso muere con `bash -e` antes de la
          # anotación, el fallo vuelve a ser ilegible (los logs de Actions piden
          # sesión; la anotación del check-run no).
          set +e
          chmod +x apps/apk/rempaquetar.sh
          bash -x apps/apk/rempaquetar.sh "$TELEFONO_VERSION" > /tmp/rempaq.log 2>&1
          st=$?
          cat /tmp/rempaq.log
          if [ $st -ne 0 ]; then
            errores="$(grep -E 'zip|zipalign|apksigner|PKHEAD|falta|no está' /tmp/rempaq.log | tail -12)"
            msg=$( { echo "-- rempaquetar --"; echo "${errores:-ninguna}"; \
                     echo "-- final del log --"; tail -c 900 /tmp/rempaq.log; } \
                   | tr '\n\r' '  ' | sed 's/%/%25/g' )
            echo "::error::rempaquetar.sh salió con $st — $msg"
            exit $st
          fi
      - name: Subir el APK del teléfono (el que sale en la Release)
        uses: actions/upload-artifact@v4
        with:
          name: instalador-android
          path: |
            apps/apk/build/CORT-IA-${{ env.TELEFONO_VERSION }}.apk
            apps/apk/build/CORT-IA-${{ env.TELEFONO_VERSION }}-firma.txt
          if-no-files-found: error
      - name: Subir el APK del asistente (también va a la Release)
        uses: actions/upload-artifact@v4
        with:
          # Se llama `instalador-asistente` para que lo recoja el mismo
          # `pattern: instalador-*` de abajo: así el APK del asistente aparece en
          # la Release, con enlace de descarga directo, en vez de quedar
          # entierrado en los artefactos del run (donde hace falta sesión de
          # GitHub para bajarlo). `if-no-files-found: ignore` sigue siendo la red
          # de seguridad: si el Java de esta ronda no compila, la Release sale
          # sólo con el APK del cuerpo original y el run no se tira.
          name: instalador-asistente
          path: apk-java/*
          if-no-files-found: ignore

  release:
    needs: [build, apk]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
          merge-multiple: true
          # `instalador-*` recoge ahora los **dos** APK del teléfono:
          # `instalador-android` (el cuerpo original con la cara nueva) y
          # `instalador-asistente` (el de Java, con asistente predeterminado,
          # doble toque del auricular y lectura de avisos). Van los dos a la
          # Release porque la dueña tiene que poder descargarlos con un clic.
          # Compartmente aviso: los dos son `com.cort.ia`, así que en el teléfono
          # se instala **uno** u otro, no los dos a la vez.
          pattern: instalador-*
      - uses: softprops/action-gh-release@v2
        with:
          files: artefactos/*
          body: |
            Instaladores generados por CI: Windows (.exe), Linux (.AppImage y .deb)
            y **dos** APK para el teléfono.

            `CORT-IA-1.1.3.apk` es **el CORT de siempre con la interfaz nueva
            dentro**: el cuerpo es el binario original `CORT-IA-1.1.0` (Kotlin, su
            icono de anillo, micrófono, archivos, apps), y `apps/apk/rempaquetar.sh`
            le cambia sólo `assets/ui/` por la del commit — once ventanas, con
            10 · Modelos y 11 · Optimizar —, realinea y refirma.

            `CORT-IA-1.2.2-asistente.apk` es el APK escrito en Java desde este repo
            (`apps/apk/compilar.sh`, sin Gradle). Es el que puede ponerse como
            **asistente predeterminado** (Ajustes ▸ Aplicación de asistencia
            predeterminada ▸ CORT), el que obedece al **doble toque del auricular**
            y el que **lee en voz alta los avisos** que llegan —WhatsApp, Gmail,
            Telegram, Signal— desde la barra de notificaciones, con un oído que
            guarda doce líneas en RAM y nunca escribe disco.

            **Te lo lee**: `lee mis notas`, `lee mis tareas`,
            `lee el documento <nombre>` y `lee mis avisos`. Las notas y las
            pendientes («tengo que …», y `listo 1` para marcarlas hechas) viven en el
            backend del PC, así que en el teléfono hacen falta conectados por Wi-Fi
            con `bash scripts/telefono.sh`; sin PC la cara lo avisa en voz alta.

            **Ya no se pierde tu clave al actualizar.** `cort_config.json` (las
            claves de Groq/Gemini que se pegan en 07 · Perfil) y `cort_memory.db`
            (notas, pendientes y recuerdos) estaban guardados dentro de la carpeta
            del programa, que es justo la que sustituye un instalador nuevo. Ahora
            viven en tu carpeta personal — `~/.cort` en Linux/macOS,
            `%APPDATA%\CORT` en Windows, o donde diga `CORT_HOME` — y la primera
            arrancada copia ahí lo que hubiera antes. La ruta se ve en 07 · Perfil.

            **Y el APK se puede actualizar sin desinstalar.** La firma es siempre la
            misma llave (`apps/apk/llave.sh`: secreto del repo si existe, si no la
            caché del pipeline), así que los permisos concedidos —micrófono, doble
            toque, acceso a las notificaciones— y la dirección del PC se quedan.
            Esta Release **aún pide desinstalar una vez**, porque las anteriores
            firmaban cada una con una llave distinta; a partir de la siguiente ya
            no. Cada APK lleva su `-firma.txt` con la huella del certificado: si
            dos Releases seguidas tienen la misma huella, la llave se mantuvo.

            Los dos APK comparten paquete (`com.cort.ia`): en el teléfono se instala
            **uno u otro**, no los dos a la vez.

            Requisitos en escritorio: Python 3.10+ y Chrome/Edge.
            Instrucciones completas, incluido el modo teléfono por Wi-Fi y el permiso
            de los avisos, en el README.
