name: Construir instaladores CORT

# Compila el holograma de escritorio para Windows y Linux SIN usar tu PC, y el
# APK del teléfono con el SDK que trae el runner:
# cada vez que creas una etiqueta v* (p. ej. git tag -a v0.2.0-demo && git push origin v0.2.0-demo)
# o desde Actions → "Construir instaladores CORT" → Run workflow.
# Los instaladores (.exe y .AppImage) aparecen como artefactos descargables
# en la página de la ejecución y en la Release si el push fue de una etiqueta.
#
# Si un paso falla, los registros de Actions NO son públicos: el trabajo
# vuelca las últimas líneas del error como anotación del check, que sí se
# puede leer desde la API pública.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false           # que Windows no se cancele si Linux falla
      matrix:
        include:
          - os: windows-latest   # instalador .exe (NSIS)
            script: dist:win
          - os: ubuntu-latest    # AppImage + .deb
            script: dist:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Instalar dependencias
        shell: bash
        run: |
          set -o pipefail
          npm install 2>&1 | tee /tmp/npm-install.log
      - name: Construir instalador (${{ matrix.os }})
        shell: bash
        run: |
          set -o pipefail
          npm run ${{ matrix.script }} 2>&1 | tee /tmp/build.log
      - name: Volcar el fallo como anotación (los logs no son públicos)
        if: failure()
        shell: bash
        run: |
          LOG=/tmp/build.log
          [ -s "$LOG" ] || LOG=/tmp/npm-install.log
          MSG=$(tail -c 3200 "$LOG" | tr '\n' ' ' | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/:/%3A/g')
          echo "::error title=Fallo en ${{ matrix.script }}::$MSG"
      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.os }}
          path: |
            desktop/out/*.exe
            desktop/out/*.AppImage
            desktop/out/*.deb
          if-no-files-found: error

  # El APK del teléfono se compila AQUÍ y nunca en el portátil de la dueña:
  # 1,8 GiB de RAM y sin `javac` (medido). El runner trae el SDK de Android y
  # `apps/apk/compilar.sh` usa `aapt2` + `javac` + `d8` + `zipalign` +
  # `apksigner`, sin Gradle ni AndroidX. La interfaz que viaja dentro del APK es
  # `ui/` de este mismo commit, copiada a `assets/ui/` por el propio script.
  apk:
    runs-on: ubuntu-latest
    env:
      APK_VERSION: "2.3.0"       # UN SOLO APK: el de Java + Kotlin, con todo dentro:
                                 # cara embebida, reproductor con `MediaSession`,
                                 # avisos leídos, modo juego, MV con letra, el mando
                                 # del aparato (volumen, linterna, alarma,
                                 # temporizador, abrir apps, voces del TTS, memoria
                                 # en SQLite, cerebro en la nube, atuendos) y —nuevo
                                 # en 2.3.0— el OÍDO PROPIO: Vosk 0.3.47 con su
                                 # modelo de español, para escuchar sin internet y
                                 # sin los servicios de voz de Google.
                                 # Tiene que ser IGUAL que el valor por defecto de
                                 # `APK_VERSION` en `apps/apk/compilar.sh`: el
                                 # sector [5] de `scripts/prueba-costura.py` cruza
                                 # los dos, y si se separan la Release anuncia un
                                 # enlace que no es el archivo que sube.
    steps:
      - uses: actions/checkout@v4
      # -- La misma llave de firma en todas las Releases ----------------------
      # Sin esto, cada run firmaba con una llave nueva, y para Android una firma
      # distinta es OTRA aplicación: actualizar == desinstalar, y al desinstalar
      # se van el permiso del micrófono, el de los avisos y la dirección del PC
      # escrita a mano. La caché guarda `apps/apk/keystore/` (keystore + su
      # contraseña) y la devuelve en el siguiente run. `apps/apk/llave.sh` prefiere
      # el secreto `CORT_APK_KEYSTORE_B64` si algún día existe: la caché es la vía
      # que no le pide a la dueña configurar nada.
      # Comprobación pública de que funciona: la huella SHA-256 del certificado
      # sale en el `-firma.txt` de cada APK y como anotación del check-run. Si dos
      # Releases seguidas tienen la misma huella, la llave se mantuvo.
      - name: Cachear la llave de firma
        uses: actions/cache@v4
        with:
          path: apps/apk/keystore
          key: cort-apk-keystore-v1
          restore-keys: cort-apk-keystore-v1
      # -- Las 53 MB del motor, una sola vez ---------------------------------
      # `apps/apk/motor.sh` baja el AAR de Vosk (12.297.565 B), el de JNA
      # (517.278 B) y el modelo de español (39.817.833 B). Son archivos FIJOS, con
      # peso y huella comprobados en el propio script, así que se pueden cachear
      # por versión sin riesgo de quedarse con un motor viejo: si `motor.sh` cambia
      # de número, la clave cambia y se vuelve a bajar. Sin esto, cada run gastaría
      # ~2 minutos de red y dependería de que alphacephei.com esté despierto.
      - name: Cachear el motor offline (Vosk + JNA + modelo)
        uses: actions/cache@v4
        with:
          path: apps/apk/motor-cache
          key: cort-motor-vosk-0.3.47-small-es-0.42-v1
          restore-keys: cort-motor-vosk-
      # `kotlinc` son 87 MB de compilador que no cambian; se cachea aparte del
      # motor porque lo necesita tanto la prueba del oído como el build del APK.
      - name: Cachear el compilador Kotlin
        uses: actions/cache@v4
        with:
          path: ~/.cache/cort-kotlin
          key: cort-kotlin-1.9.24-v1
          restore-keys: cort-kotlin-
      - name: Probar el cerebro en el JDK (lógica, sin teléfono)
        id: mente
        # `scripts/prueba-mente.sh` compila `Cerebro`, `Razon`, `Nube` y `Mente`
        # contra los gemelos de papel de `apps/apk/prueba/papeles` y ejecuta las
        # tres suites: las cuentas a pelo, la ruta de quién responde, y las 283
        # frases de la tabla contra las DOS tablas (la del asset y la del código).
        # Va ANTES de compilar el APK porque si la lógica está rota, el APK se
        # compila igual y llega al teléfono contestando tonterías: ese fallo no lo
        # ve `javac`. Con anotación, porque los registros de Actions son privados.
        shell: bash
        run: |
          set +e
          bash scripts/prueba-mente.sh > /tmp/mente.log 2>&1
          st=$?
          tail -25 /tmp/mente.log
          if [ $st -ne 0 ]; then
            msg=$(grep -E 'FALLO|falla|Error|error:|excepción|Exception' /tmp/mente.log \
                  | head -25 | tr '\n\r' '  ' | sed 's/%/%25/g')
            echo "::error::prueba-mente.sh salió con $st — ${msg:-sin detalle}"
            exit $st
          fi
      - name: Probar el oído propio con Vosk de verdad (sin teléfono)
        id: oido
        # `scripts/prueba-oido.sh` hace lo que `javac` no puede hacer NUNCA: carga
        # el modelo de español de verdad (`vosk.jar` de escritorio lleva el mismo
        # `libvosk.so` de linux que el AAR de Android), le mete muestras de audio a
        # mano por el gemelo de papel de `AudioRecord` y comprueba seis cosas del
        # `Oido.kt` que sólo se romperían en el teléfono: que el ZIP se desempaca y
        # `Model()` lo acepta, que el silencio avisa `no-speech`, que la señal manda
        # `stt-speech` y `stt-level` entre 0 y 1, que un `read()` negativo —el
        # micrófono que le quita un juego a mitad— NO tumba el proceso, que
        # `cancela()` cierra con UN solo `stt-end`, y que sin sitio libre no lo
        # intenta ni destruye datos. Va antes del APK porque un `Oido` roto llega
        # igual al teléfono y se queda mudo, que es justo la queja que motivó la
        # ronda.
        shell: bash
        env:
          MOTOR_CACHE_DIR: apps/apk/motor-cache
        run: |
          set +e
          chmod +x apps/apk/motor.sh scripts/prueba-oido.sh
          bash scripts/prueba-oido.sh > /tmp/oido.log 2>&1
          st=$?
          grep -vE '^LOG \(VoskAPI' /tmp/oido.log | tail -30
          if [ $st -ne 0 ]; then
            msg=$(grep -E 'FALLA|FALLO|error:|Exception|OutOfMemory' /tmp/oido.log \
                  | grep -vE '^LOG \(VoskAPI' | head -20 | tr '\n\r' '  ' | sed 's/%/%25/g')
            echo "::error::prueba-oido.sh salió con $st — ${msg:-sin detalle}"
            exit $st
          fi
      - name: Compilar el APK (aapt2 + kotlinc + javac + d8, sin Gradle)
        id: java
        # **El único APK que existe.** Desde `v0.2.11-demo` ya no se rempaqueta el
        # cuerpo Kotlin original: todo —asistente predeterminado, doble toque del
        # auricular, avisos en voz alta, reproductor propio, contactos y marcar—
        # está en el Java de `apps/apk/src`, y la firma es la de siempre con el
        # anillo del original (`base/CORT-IA-1.1.0.apk` sólo aporta el icono).
        # Sin `continue-on-error`: no hay segunda pata que salve la Release, así
        # que si el Java se rompe, el run se para y la anotación lo dice.
        shell: bash
        env:
          # La llave de firma: secreto del repo si existe; si no, la caché de
          # arriba (`apps/apk/keystore`). `apps/apk/llave.sh` decide en ese orden y
          # `firma.txt` cuenta cuál se usó, que es lo que ella puede leer sin
          # sesión de GitHub.
          CORT_APK_KEYSTORE_B64: ${{ secrets.CORT_APK_KEYSTORE_B64 }}
          CORT_APK_KEYSTORE_PASS: ${{ secrets.CORT_APK_KEYSTORE_PASS }}
        run: |
          # `set +e` es obligatorio: el shell de GitHub se comporta como `bash -e`
          # y mataría el paso antes de `st=$?` y antes de la anotación, dejando un
          # fallo mudo que no se puede leer desde fuera.
          set +e
          chmod +x apps/apk/compilar.sh
          bash -x apps/apk/compilar.sh "$APK_VERSION" > /tmp/apk.log 2>&1
          st=$?
          cat /tmp/apk.log
          if [ $st -ne 0 ]; then
            # Los registros de Actions NO se pueden descargar sin sesión (la API de
            # logs responde 403), pero los annotations del check-run sí se leen por
            # la API pública. `javac` imprime el error en una línea y el detalle
            # (`symbol:` / `location:` / `required:`) en las siguientes: sin ellas
            # hay que adivinar qué método no existe, y eso cuesta una compilación.
            errores="$(grep -E -A 3 '\.java:[0-9]+: error:' /tmp/apk.log \
                       | grep -E '\.java:[0-9]+: error:|symbol:|location:|required:|found:|reason:' \
                       | head -40)"
            msg=$( { echo "-- errores --"; echo "${errores:-ninguno}"; \
                     echo "-- final del log --"; tail -c 900 /tmp/apk.log; } \
                   | tr '\n\r' '  ' | sed 's/%/%25/g' )
            echo "::error::compilar.sh salió con $st — $msg"
            exit $st
          fi
      - name: Bautizar el APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk
          cp apps/apk/build/CORT.apk "apk/CORT-IA-${APK_VERSION}.apk"
          cp apps/apk/build/firma.txt "apk/CORT-IA-${APK_VERSION}-firma.txt"
      - name: Subir el APK (el que sale en la Release)
        uses: actions/upload-artifact@v4
        with:
          # Se llama `instalador-android` para que lo recoja el mismo
          # `pattern: instalador-*` de abajo y aparezca en la Release con enlace
          # de descarga directo. `if-no-files-found: error`: este APK es el único,
          # así que una Release sin él no sirve para nada y debe gritar.
          name: instalador-android
          path: apk/*
          if-no-files-found: error

  release:
    needs: [build, apk]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
          merge-multiple: true
          # `instalador-*` recoge los tres instaladores de escritorio y **el**
          # APK del teléfono. Desde esta Release ya no hay dos APK que elegir:
          # el cuerpo Kotlin original quedó fuera (`apps/apk/rempaquetar.sh` está
          # borrado del repo y no hay paso que lo corra) porque todo lo que hacía
          # está en el de Java, con su icono de anillo y sus permisos.
          pattern: instalador-*
      - uses: softprops/action-gh-release@v2
        with:
          files: artefactos/*
          body: |
            Instaladores generados por CI: Windows (.exe), Linux (.AppImage y
            .deb) y **un solo APK** para el teléfono, que sube a la **2.3.0**. Se
            acabaron las dos versiones que había que elegir: `CORT-IA-2.3.0.apk`
            es el CORT de siempre —el anillo en el cajón de aplicaciones— y lleva
            dentro todo lo que estaba repartido entre los dos, más el **oído propio
            sin nube** (párrafo «Escucha sin internet» abajo). **Se instala encima
            del 2.0.0, del 2.1.0 y del 2.2.0 sin desinstalar y sin perder nada**
            (misma llave `fa:ab:ef:46:8f:3a…`, `versionCode` 20300 > 20200): mira la
            huella del `-firma.txt` de las dos Releases y compárala antes de
            instalar. **Si vienes de un 1.x**, el primer intento dará error —es la
            llave distinta, medida en `docs/INSTALAR-APK.md`—: desinstala una vez,
            instala este, y de aquí en adelante todas las actualizaciones entran
            encima.

            **Un APK, el de Java, con el logo de siempre.** `apps/apk/compilar.sh`
            saca el icono del `base/CORT-IA-1.1.0.apk` (sus cinco densidades y el
            adaptativo, fondo `#02040A` medido en la propia imagen), no lo dibuja
            ni lo cambia. El paquete sigue siendo `com.cort.ia`, así que
            actualizar es instalar encima **si la firma coincide** (lea el párrafo
            de la llave más abajo).

            **Asistente de verdad.** `res/xml/asistente.xml` ya no declara una
            `settingsActivity` —Android descartaba en silencio al asistente cuyos
            ajustes no fueran de una app del sistema, y una APK instalada a mano
            nunca lo es—, y el botón «Poner CORT como asistente» pide el **rol**
            oficial con `RoleManager` (Android 10+), que es el cuadro que de verdad
            te pone en la lista. Se dice por voz: `pon CORT como asistente`. Con
            CORT elegido: doble toque del auricular, gesto de asistente y
            `lee mis avisos`.

            **Su propio reproductor.** `.Reproductor` es un servicio en primer
            plano con su notificación (play/pausa, siguiente) y su `MediaSession`,
            así que la música y el video **siguen sonando con la cara cerrada o la
            pantalla apagada** y el auricular obedece. CORT lee tu índice de audio
            y video (`MediaStore`), reproduce por URI, salta a cualquier segundo,
            va **cuadro a cuadro** en video (±1/30 s) y arma la cola sola por
            gustos: «me gustan estas» sube artista y género, «quítalas» los baja,
            y la próxima vez que pidas música sale mejor ordenada. Las playlists se
            guardan con nombre y se vuelven a poner. Todo eso vive en claro, en las
            preferencias de la app: se puede leer y borrar sin misterios.

            **Cinco pantallas que no tocan el orbe.** Además de la cara de siempre
            hay hojas a pantalla completa, y se cambia entre ellas con el menú de
            **tres líneas (☰)**, deslizando el dedo de lado, con `Alt+←/→` o
            diciéndolo: «abre el chat», «pantalla de código», «abre el mv», «abre el
            equipo», «vuelve al orbe». **Charla** es un chat como los de siempre —burbujas, copiar la
            respuesta, guardarla en 04 · Notas— con los modelos que tengas bajados,
            elegibles desde la propia pantalla (y diciéndote, en el teléfono, que
            los modelos viven y corren en tu portátil: allí se bajan, allí se usan).
            **Código** es la terminal y el cuaderno: lo que escribes ahí se ejecuta
            **en tu PC** (Android no deja abrir un shell desde una app normal, y no
            se finge lo contrario), y el cuaderno guarda lo que escribiste aunque
            cierres la app. **Música** manda al reproductor de arriba. Cuando no es
            la pantalla del orbe, el holograma **deja de dibujarse** (`orb.pausa()`):
            en un teléfono modesto eso es RAM, GPU y batería, y así ninguna
            interfaz nueva tapa la otra.

            **MV: el video con su letra, y el orbe hecho disco.** La hoja **MV** es
            la que estaba pedida separada del reproductor: pone la imagen del
            videoclip (`<video>` sobre la misma `content://` que reproduce CORT, con
            `setAllowContentAccess`) y debajo la **letra sincronizada**, línea a
            línea, con la línea activa marcada y **clic para saltar a ese segundo**.
            La letra viene de LRCLIB (sin clave, cacheada 40 canciones, y si el
            servidor está saturado te lo dice y la rebuscas con un botón). El
            holograma no se va de esta hoja: se **encoge a una esquina girando como
            un disco**, así que la esfera sigue siendo tuya mientras ves el video.
            En audio suelto la hoja no se queda en negro: lo dice y te deja la letra.
            El avance **cuadro a cuadro** (◂ ▸, ±1/30 s) funciona aquí también.

            **Modo juego: CORT se aparte mientras juegas.** Pedida tal cual: el
            Call of Duty se cerraba y la música desaparecía cuando el asistente le
            robaba el micro. Con el modo juego puesto —por voz (**«modo juego»** y
            **«vuelve CORT»**), desde el interruptor de las hojas Música/MV o desde
            el botón `CORT · PC`— CORT **cierra el micrófono**, no pide el foco
            audio al reproducir, y deja de susurrar por el auricular; el aviso de
            que está callado se ve en la barra superior (🎮). Al quitarlo, todo
            vuelve a su sitio. **No** hace falta darle ningún permiso de uso de
            aplicaciones ni de lista de programas instalados: es un interruptor, no
            un espía, y así queda firmado en el manifiesto.

            **La hoja Equipo: CORT manda sobre el aparato, y se ve dónde.** Es la
            hoja nueva (`☰ ▸ Equipo`, o «abre el equipo») y trae **seis bloques**:
            **Voz** (voces instaladas y preajustes: «voz de siri», «cambia la voz»),
            **Mando** (volumen, linterna, alarmas, temporizador, abrir apps: «sube el
            volumen», «pon una alarma a las 7:30», «enciende la linterna»), **Cerebro**
            (con quién piensa cuando no está el PC), **Memoria** (lo que CORT guarda en
            el teléfono y su sincronía con el portátil), **Atuendos** (los seis trajes
            de color y la burbuja: «ponte azul», «atuendo Cortana», «burbuja») y
            **Agenda** (tus citas y los avisos de Gmail). Cada bloque avisa en su propio
            pie si lo que le falta es el APK nuevo, un permiso, o el PC: **no** finge
            haber hecho lo que no hizo. Son las ocho funciones del contrato del puente
            (`docs/CONTRATO-PUENTE-2.1.md`): `accion`, `ajusteVoz`, `memoria`, `mente`,
            `atuendo`, `agenda`, `burbuja` y `comparte`, comprobadas una por una en los
            cuatro sitios donde viven —su clase de Java, el puente, la cara y el
            manifiesto— por `scripts/prueba-costura.py`.

            **Tres interruptores nuevos, y se dicen.** Son los que hay que dar a mano
            la primera vez que se usan (ninguno se pide al abrir la app):
            **«Aparecer encima de otras apps»** para la **burbuja** (el puntito de CORT
            flotando: «burbuja»; al tocarlo abre la cara y escucha; en **modo juego
            nunca aparece**, y al poner el modo juego la que estuviera puesta se quita
            sola), **Cámara** para la **linterna** (va por `setTorchMode`: no enciende
            la cámara, no captura imagen, y sin el permiso CORT lo dice en vez de
            forzarte el cuadro), y **Calendario de sólo lectura** para «¿qué tengo
            hoy?». `WRITE_CALENDAR` **no está pedido a propósito**: «apunta la cena con
            Samuel a las 9» rellena el formulario del calendario del sistema y **el
            dedo que guarda eres tú**. Del correo no se lee el contenido —no hay API
            para el Gmail de otra app—: se cuentan los avisos que ya salieron en tu
            barra y se abre Gmail con un toque.

            **Piensa sin el portátil.** El bloque **Cerebro** y la orden **«piensa
            <pregunta>»** contestan con la cara abierta y sin Wi-Fi con el PC:
            `Mente.java` usa la nube que tú ajustaste desde la propia pantalla (Groq,
            OpenAI, DeepSeek, Mistral, Qwen, Anthropic u Ollama en red local), y la
            **clave no sale nunca del teléfono** —se guarda en el APK y sólo se lee por
            voz un `sí/no` de «puesta o no puesta»—. Si no hay nube, hablan las **33
            reglas y 283 frases** de `assets/habilidades.json`, y esas sí **ejecutan**
            la orden que reconocen (subir el volumen, abrir una app) en vez de quedarse
            en la promesa. **Memoria** guarda en SQLite del teléfono lo que aprende y
            **«sincroniza con el PC»** lo cuadra con `~/.cort` por la puerta
            `/api/memoria`; y el botón **📤 enviar** de las hojas Música/MV pasa un
            archivo tuyo a otra app (WhatsApp, correo, Drive) por el proveedor de
            archivos del propio APK, que es la única forma legal de enseñar un archivo
            en Android 8+.

            **El cerebro se ensanchó, y eso es lo que pide la dueña: «que haga de todo».**
            `Mente` piensa en tres escalones, del más barato al más caro: primero la
            tabla de frases (acción conocida), después **`Razon`** y sólo luego la nube.
            `Razon` es Java puro sin portátil ni red: sumas y productos, porcentajes
            («cuánto es el 15 % de 240»), conversiones (km↔mi, kg↔lb, °C↔°F), y fechas y
            horas reales del teléfono («qué día es hoy», «cuánto falta para el viernes»,
            «que horas son»). Las dos frases que antes respondían con una excusa —«no
            tengo barra de estado» a *qué hora es*— están **borradas de las dos tablas**,
            y `scripts/prueba-costura.py` falla si vuelven. La tabla pasó de 35 a **33
            reglas con 283 frases** y ya no se escribe a mano dos veces: sale de
            `scripts/habilidades.py`, que vierta el JSON del APK y el cuerpo de
            `Cerebro.tablaDelCodigo()` del mismo listado. Y se comprueba **en el
            portátil**, que hasta ahora era imposible: `scripts/prueba-mente.sh` pone
            gemelos de papel a las cinco clases de Android que atan esas cuatro clases,
            las compila con el JDK de a pie y pasa las tres suites (43 cuentas de
            `Razon`, 45 de la ruta de `Mente`, y las 283 frases una por una contra las
            DOS tablas para ver los robos por orden). El paso
            «Probar el cerebro en el JDK» va **delante** de compilar el APK: si la
            lógica se rompe, el run para, porque un APK que compila y contesta tonterías
            es peor que uno que no compila.

            **El teléfono enseña lo que tiene dentro.** La hoja **Equipo** ya no deja los
            huecos en `—` por decoración: `Aparato.java` lee batería (nivel, temperatura,
            tecnología y si está enchufado), RAM libre y ocupada, almacenamiento, red
            (wifi / celular / ethernet), CPU, brillo y resolución, y `Sentidos.java`
            engancha `SensorManager` y trae luz, proximidad, acelerómetro, giroscopio,
            brújula, presión, temperatura y humedad con su nombre real de fabricante.
            Cada clave que la cara pinta está cruzada con la que Java emite
            (`scripts/prueba-costura.py`, sector 10): 16 de la hoja Equipo y 6 de cada
            fila de sensores. Y el **«sale error al instalar» tiene por fin causa
            medida**: con `keytool -printcert -jarfile` sobre los APK publicados, el
            2.0.0 y el 2.1.0 salen con la huella `fa:ab:ef:46:8f:3a…` y el 1.1.4 con
            `eb:d6:25:04:41:bc…`. Cambiar de llave es, para Android, otra aplicación:
            `INSTALL_FAILED_UPDATE_INCOMPATIBLE`. Es un coste de **una sola vez** al
            saltar de 1.x a 2.x; desde el 2.0.0 la llave no se mueve.
            `scripts/instala-apk.sh` baja la Release, comprueba que el peso sea el
            anunciado, lee la firma y traduce el código de Android a español, y
            `docs/INSTALAR-APK.md` dice qué tres cosas hay que tocar en el teléfono y
            qué borra desinstalar.

            **Ordena tus archivos sin perder ni uno.** En **01 · Archivos** hay botón
            **⤢ ordena** y se dice por voz: «ordena mis archivos», «ordena mis
            documentos», «ordena la música». Lo primero que sale es un **plan**:
            cada archivo con su `de → a` y su motivo, el total, y **nada se mueve**
            hasta que digas **«confirmar»** (o **«cancelar»**, y no se toca nada). El
            plan caduca a los quince minutos y lleva un token, así que confirmar no
            puede mover una carpeta distinta de la que viste. `organiza.py` **no
            conoce ninguna primitiva de borrado**: reorganiza, y si el nombre ya
            está ocupado añade ` (2)` en vez de pisar nada. Probado aquí, en un
            `mktemp` con sus carpetas de mentirijillas: `scripts/prueba-organiza.py`.

            **Dile que se actualice solo.** `GET /api/update` compara lo instalado
            con la última Release de GitHub, y se pide por voz: **«revisa si hay
            actualizaciones»**, **«actualízate»**. CORT cuenta qué hay nuevo y qué
            pesa; si dices **«sí»**, el escritorio baja su instalador o —si pesa más
            de 100 MB, que es lo normal y congelaría un portátil pequeño dentro de
            una petición— deja los pasos listos y `scripts/actualiza.sh` hace la
            reparación **con copia de seguridad** de la instalación anterior en
            `~/Aplicaciones/CORT.anterior-<fecha>`, sin sudo y sin tocar nunca
            `~/.cort` (tus claves, notas y recuerdos). En el teléfono Android no
            deja que una app se reemplace a sí misma: ahí CORT te da el enlace del
            APK y lo instalas tú encima.

            **Y ya no traba el teléfono.** El micro de «Oye CORT» se cierra al pasar
            a segundo plano, al apagarse la pantalla, mientras suena música y
            mientras la ventana 11 cuenta caché; la escucha se rearma con respiros
            cada vez más largos si nadie la llama. El reproductor tampoco trabó: las
            consultas al índice corren en su propio hilo, nunca en el de la cara.

            **Te lo lee**: `lee mis avisos` en el teléfono —WhatsApp, Gmail,
            Telegram, Signal— desde la barra de notificaciones, con un oído que
            guarda doce líneas en RAM y nunca escribe disco; `lee mis notas`,
            `lee mis tareas` y `lee el documento <nombre>` en el PC. Las notas y las
            pendientes («tengo que …», y `listo 1` para marcarlas hechas) viven en el
            backend, así que en el teléfono hacen falta conectados por Wi-Fi con
            `bash scripts/telefono.sh`; sin PC la cara lo avisa en voz alta.

            **Llamadas y contactos, dicho sin adornos.** `llama a Samuel` busca en
            tus contactos y marca: con el permiso `CALL_PHONE` va directo, sin él se
            abre el marcador con el número puesto. Lo que **no** hace esta entrega:
            contestar por ti ni ser un buzón de voz —Android exige ser el «teléfono
            predeterminado» para eso, y a medias deja sin marcar llamadas normales—,
            y no hay API para leer los SMS de otro ni entrar en WhatsApp.

            **Ya no se pierde tu clave al actualizar.** `cort_config.json` (las
            claves de Groq/Gemini que se pegan en 07 · Perfil) y `cort_memory.db`
            (notas, pendientes y recuerdos) estaban guardados dentro de la carpeta
            del programa, que es justo la que sustituye un instalador nuevo. Ahora
            viven en tu carpeta personal — `~/.cort` en Linux/macOS,
            `%APPDATA%\CORT` en Windows, o donde diga `CORT_HOME` — y la primera
            arrancada copia ahí lo que hubiera antes. La ruta se ve en 07 · Perfil.

            **Analizar el equipo deja de ser un suplicio.** La ventana 11
            (Optimizar) contesta **al instante** con la RAM y los procesos: lo que
            tarda —contar la caché del disco— se mide en un hilo aparte y se va
            pintando cuando llega, en vez de dejar la pantalla congelada esperando.
            En 10 · Modelos, «descargar» ya no deja la interfaz colgada: pone el
            modelo **en cola**, arranca Ollama él solo, enseña el avance en MB y MB/s
            y tiene su `✕ cancelar`. Y el logo de los instaladores es ahora el
            **mismo anillo** que el de la app del teléfono
            (`bash scripts/icono-del-telefonito.sh`).

            **Actualizar el APK sin desinstalar: esta vez se instala encima.** La
            firma la decide `apps/apk/llave.sh` (secreto del repo ▸ caché del pipeline ▸
            generar una nueva). Estaba **medido**: sin secreto, la huella de cada
            Release era distinta porque `actions/cache` guarda la llave en el *ref* que
            la creó, y cada etiqueta es otro ref. Los dos secretos
            (`CORT_APK_KEYSTORE_B64` y `CORT_APK_KEYSTORE_PASS`) ya están puestos en
            Settings ▸ Secrets and variables ▸ Actions, y la Release anterior
            (`v0.2.13-demo`, con `CORT-IA-2.0.0-firma.txt`) **ya firmó con esa llave
            fija**. Así que el `2.2.0` se instala **encima** del `2.0.0` y del `2.1.0`:
            `versionCode` 20200 por encima de 20100, mismo paquete `com.cort.ia`, misma
            firma —y con ello se quedan el micrófono concedido, el doble toque, el
            permiso de los avisos, la dirección del PC y los gustos que CORT anotó en el
            teléfono—. El juez público sigue siendo el `-firma.txt`:
            `faabef468f3ae04fdfab9659d6a051c453d6ded7b965468c9c3b85caffa31977` tiene que
            aparecer en las dos Releases; si en la tuya no está, desinstala una vez y ya
            no volverá a tocar. La llave nunca se sube al repo: el repo es público y
            está en `.gitignore`.

            **Escucha sin internet: el oído propio.** `Oido.kt` (Kotlin, el método
            del original) mete dentro del APK el reconocedor de español de **Vosk
            0.3.47** con su modelo `vosk-model-small-es-0.42`: al abrir CORT se
            desempaca a `filesDir/motor/` (60.286.598 B en 14 archivos, medidos) y
            desde ahí entiende «CORT», «hola CORT» y las órdenes **sin red y sin los
            servicios de voz de Google** —el caso real de un teléfono de gama baja
            donde esos servicios no vienen, y el de datos apagados o sin cobertura.
            Funciona así: el puente intenta primero el oído propio y, si todavía está
            cargando o el modelo no cabe, cae solo al reconocedor de siempre, así que
            la cara nunca se queda muda por este cambio. `prueba-oido.sh` lo prueba
            EN PIPELINE con el motor de verdad (desempaque, silencio, señal, micrófono
            quitado a mitad, cancelación y falta de sitio: seis comprobaciones), antes
            de compilar. Se puede apagar en Ajustes, y el estado («extrayendo»,
            «cargando», «listo», «sin-sitio», «roto» y por qué) se lee en la pantalla
            Equipo. Cuesta espacio, y eso está dicho en voz alta: los `.so` de
            arm64-v8a y armeabi-v7a (8.862.928 B + 168.176 B + 8.279.808 B + 122.296 B)
            y el ZIP del modelo viajan dentro; a cambio CORT oye sin nube.

            **El tamaño, sin adornos y medido.** Se bajaron los dos APK y se contaron
            sus entradas. El `1.1.0` original: 1.815.389 B de archivo sobre
            4.538.254 B sin comprimir, 45 entradas. El `2.1.0` que se publicó en
            `v0.2.15-demo`: 978.056 B sobre 2.349.202 B, 42 entradas. La proporción es
            la misma —**0,40 frente a 0,42**, o sea que no estaba apretado de más— y la
            diferencia de peso está en el código que el original arrastraba: sus cuatro
            `classes*.dex` y los `kotlin/*.kotlin_builtins` suman 919.207 B comprimidos,
            frente a los 90.943 B de un `classes.dex` de Java puro (aquí no hay Kotlin ni
            AndroidX ni Gradle: `aapt2` + `javac` + `d8`, el método de siempre). Lo que la
            cara tiene dentro **no faltó ni falta**: los 11 archivos de `assets/ui/` del
            `1.1.0` están los once, más `habilidades.json`, `pantallas.js` y
            `telefono.js` —1.622.292 B de interfaz sin comprimir por los 1.408.297 B
            del original: 214 KB más de cara dentro de un archivo más pequeño—. Este
            `2.2.0` mete además las dos clases nuevas del entorno, `Aparato.java` y
            `Sentidos.java`, y su tabla de frases casi triplicada; el peso exacto que
            salió lo declara su propio `-firma.txt`, medido en Actions por `compilar.sh`
            y bajado por `scripts/instala-apk.sh`, no estimado aquí.

            Requisitos en escritorio: Python 3.10+ y Chrome/Edge.
            Requisitos del APK: Android 8 o más (el rol de asistente y el permiso de
            música, desde Android 10 y 13 respectivamente; en los antiguos CORT se
            elige a mano en Ajustes y la música pide el permiso viejo).
            Instrucciones completas, incluido el modo teléfono por Wi-Fi y el permiso
            de los avisos, en el README.
