name: Construir instaladores CORT

# Compila el holograma de escritorio para Windows y Linux SIN usar tu PC:
# cada vez que creas una etiqueta v* (p. ej. git tag -a v0.2.0-demo && git push origin v0.2.0-demo)
# o desde Actions → "Construir instaladores CORT" → Run workflow.
# Los instaladores (.exe y .AppImage) aparecen como artefactos descargables
# en la página de la ejecución y en la Release si el push fue de una etiqueta.
#
# Si un paso falla, los registros de Actions NO son públicos: el trabajo
# vuelca las últimas líneas del error como anotación del check, que sí se
# puede leer desde la API pública.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false           # que Windows no se cancele si Linux falla
      matrix:
        include:
          - os: windows-latest   # instalador .exe (NSIS)
            script: dist:win
          - os: ubuntu-latest    # AppImage + .deb
            script: dist:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Instalar dependencias
        shell: bash
        run: |
          set -o pipefail
          npm install 2>&1 | tee /tmp/npm-install.log
      - name: Construir instalador (${{ matrix.os }})
        shell: bash
        run: |
          set -o pipefail
          npm run ${{ matrix.script }} 2>&1 | tee /tmp/build.log
      - name: Volcar el fallo como anotación (los logs no son públicos)
        if: failure()
        shell: bash
        run: |
          LOG=/tmp/build.log
          [ -s "$LOG" ] || LOG=/tmp/npm-install.log
          MSG=$(tail -c 3200 "$LOG" | tr '\n' ' ' | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/:/%3A/g')
          echo "::error title=Fallo en ${{ matrix.script }}::$MSG"
      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.os }}
          path: |
            desktop/out/*.exe
            desktop/out/*.AppImage
            desktop/out/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artefactos, merge-multiple: true }
      - name: Añadir el APK de Android que vive en el repo
        run: |
          if ls instaladores/*.apk >/dev/null 2>&1; then
            cp instaladores/*.apk artefactos/
            echo "APK incluido en la Release"
          else
            echo "No hay APK en instaladores/: se publica sin él"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: artefactos/*
          body: |
            Instaladores generados por CI: Windows (.exe), Linux (.AppImage y .deb)
            y el APK de Android que hay en `instaladores/`.

            Requisitos en escritorio: Python 3.10+ y Chrome/Edge.
            Instrucciones completas en el README.
